name: Deployment Test (Azure)

# Test the public single-plane installer against an ephemeral Azure cluster.
# See ci/deployment-test/README.md for prerequisites, state recovery and rollout.
# Three modes, each cheaper to set up than the next:
#
#   1. `init-only` (~30s, no cloud setup): terraform init + validate + fmt
#      against the Azure example module. Provider-download + HCL syntax check;
#      ZERO Azure API calls.
#   2. `auth-check` (~2 min, requires OIDC + Azure App Reg): runs terraform
#      plan. First step that actually touches Azure — confirms the federated-
#      identity → service-principal → RBAC chain.
#   3. `full-deployment`: build HEAD images/CLI, run deploy-osmo-single-plane.sh,
#      run the existing OETF selection, then destroy even after partial failure.
#
# Triggers:
#   - `workflow_dispatch` — once this file lands on the default branch, the
#     "Run workflow" button in Actions becomes available for all three modes.
#   - `pull_request` — auto-runs `init-only` when deployment-test inputs change.
#     A `ci:azure-deployment` label event skips init-only and starts the full
#     HEAD integration path at the chart contract check.
#
# PR-label trigger (works pre-merge when the dispatcher isn't registered yet):
#   - `ci:azure-deployment` → full-deployment starts immediately for an eligible
#     deployment-related PR.
#     Later pushes run only automatic validation; remove and re-add the label
#     to rerun full E2E at the new head.
# auth-check is workflow_dispatch only — it's a developer-driven smoke for
# the OIDC chain, not something we want to run automatically per PR.
#
# Scheduled trigger (PRIMARY mode of operation on main):
#   - Daily at 00:00 UTC = 5pm PDT (16:00 PST during winter — GitHub cron
#     is UTC, doesn't adjust for DST). github.event_name='schedule' runs
#     build-images + full-deployment end-to-end on main, the same path
#     the PR-label gate exercises. Scripts, charts, images, and CLI all come
#     from the tested source SHA. Schedule events fire only from the repo's
#     default branch (main), not forks or feature branches.
#
# Slack notification (failure-only, schedule-only):
#   - notify-slack-on-azure-deployment-test-failure posts to the channel
#     named by `vars.CI_SLACK_CHANNEL` (fallback `osmo-slack-test`) using
#     `OSMO_SLACK_BOT_TOKEN` (xoxb- bot token with chat:write scope) via
#     Slack `chat.postMessage`. Override at repo/org level when redirecting
#     the noise (e.g. to #osmo-oncall once this gate goes prod-ready).
#   - Fires only on scheduled-run failures. PR-label and workflow_dispatch
#     runs surface their own status interactively.
#   - If the secret is unset or the API returns non-ok, the step logs a
#     warning and exits 0 — the gate's overall status is unaffected.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        required: true
        default: init-only
        options:
          - init-only
          - auth-check
          - full-deployment
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/deployment-test.yaml'
      - 'ci/deployment-test/**'
      - 'deployments/BUILD'
      - 'deployments/charts/osmo/**'
      - 'deployments/charts/service/**'
      - 'deployments/charts/backend-operator/**'
      - 'deployments/scripts/deploy-k8s.sh'
      - 'deployments/scripts/run-deployment-test.sh'
      - 'deployments/scripts/deploy-osmo-single-plane.sh'
      - 'deployments/scripts/single-plane-azure.yaml'
      - 'deployments/scripts/single-plane-values.jq'
      - 'deployments/scripts/azure/**'
      - 'deployments/scripts/common.sh'
      - 'deployments/scripts/install-kai-scheduler.sh'
      - 'deployments/scripts/verify.sh'
      - 'deployments/workflows/verify-*.yaml'
      - 'deployments/scripts/tests/**'
      - 'deployments/terraform/azure/**'
      - 'bzl/patches/aspect_rules_py_skip_venv_interpreter.patch'
      - 'bzl/tests/**'
      - 'src/operator/BUILD'
      - 'src/operator/backend_test_runner/BUILD'
  schedule:
    # Daily at 00:00 UTC = 5pm PDT (16:00 PST during winter — GitHub cron
    # is UTC, doesn't track DST). Schedule fires only on main, not on
    # feature branches.
    - cron: '0 0 * * *'

# Full runs share one resource group and queue in one concurrency group.
# Auth checks and non-matching label events use unique groups, so they never
# wait behind cloud provisioning.
concurrency:
  group: >-
    ${{ (github.event_name == 'schedule'
          || github.event.inputs.mode == 'full-deployment'
          || (github.event_name == 'pull_request'
              && github.event.action == 'labeled'
              && github.event.label.name == 'ci:azure-deployment'))
        && 'deployment-test-azure'
        || format('deployment-test-azure-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

# OIDC federation to Azure; state encryption and registry access use separate secrets.
# `id-token: write` lets the runner mint a JWT that Azure trusts via the
# Federated Identity Credential on the App Registration. The federated
# credential is bound to the `internal-ci` GitHub environment (subject =
# `repo:NVIDIA/OSMO:environment:internal-ci`), so the auth-check and
# full-deployment jobs must declare `environment: internal-ci` for the
# subject claim to match. Environment-scoped Variables (vars.AZURE_*)
# also resolve only inside jobs with that environment.
permissions:
  id-token: write
  contents: read

jobs:
  # Cheapest mode — no Azure setup needed. On PRs this runs for normal update
  # events, but not for the full-deployment label event: that path starts with
  # head-chart-contract so a chart mismatch fails before Terraform apply.
  init-only:
    if: >-
      ${{ github.event.inputs.mode == 'init-only'
          || (github.event_name == 'pull_request'
              && github.event.action != 'labeled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deployments/terraform/azure/example
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform init (no Azure auth required)
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      # Existing formatting drift is outside this gate's behavioral contract.
      - name: terraform fmt -check (informational)
        run: terraform fmt -check -recursive -no-color || true

  # First step that actually talks to Azure — terraform plan reads the
  # resource group via the azurerm_resource_group data source. Requires
  # the full OIDC + App Reg + RBAC setup. Provisions nothing.
  auth-check:
    if: ${{ github.event.inputs.mode == 'auth-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: internal-ci
    env: &azure_env
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CLUSTER_NAME: ${{ vars.AZURE_CLUSTER_NAME || 'osmo-deployment-test' }}
      AZURE_REGION: ${{ vars.AZURE_REGION || 'eastus2' }}
      RUN_DIR: ${{ github.workspace }}/runs/deployment-test-azure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Plan the single-plane profile (no provisioning)
        run: |
          source ci/deployment-test/azure-inputs.sh
          ci_azure_inputs
          ci_azure_save_inputs "$RUNNER_TEMP/inputs"
          terraform -chdir=deployments/terraform/azure/example init -input=false
          terraform -chdir=deployments/terraform/azure/example plan -input=false -no-color \
            -var-file="$RUNNER_TEMP/inputs/single-plane.tfvars" \
            -var-file="$RUNNER_TEMP/inputs/ci.tfvars.json"

  # Lint and render the unified chart from this checkout before starting any
  # expensive work. This catches script/image/chart contract gaps in about a
  # minute instead of discovering them after Azure is provisioned.
  head-chart-contract:
    if: >-
      ${{ github.event_name == 'schedule'
          || github.event.inputs.mode == 'full-deployment'
          || (github.event_name == 'pull_request'
              && github.event.action == 'labeled'
              && github.event.label.name == 'ci:azure-deployment') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chart_version: ${{ steps.contract.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.16.2'

      - name: verify HEAD chart contract
        id: contract
        run: bash ci/deployment-test/check-head-chart-contract.sh

  # Build OSMO service + backend images from THIS PR's source and push them
  # to nvcr.io/nvstaging/osmo so the deployment-test below verifies the
  # actual diff, not whatever's currently published at
  # nvcr.io/nvidia/osmo:latest. Without this job the gate is meaningless
  # for service-code PRs (it always tests the published `latest`, never
  # the proposed change). After the HEAD chart preflight, this job runs in
  # before Azure provisioning; failed builds do not leave resources.
  #
  # Pushes go to `nvcr.io/nvstaging/osmo` — the same team the Jenkins dev
  # pipeline uses (nvcr.io restricts registries to 3 path segments
  # `<org>/<team>/<image>`, so a dedicated `/ci` subpath isn't possible).
  # Keep the cleanup-compatible `pr-` prefix and include the workflow run ID,
  # plus the attempt, so a rerun cannot overwrite images from an earlier attempt.
  build-images:
    needs: head-chart-contract
    if: ${{ needs.head-chart-contract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: internal-ci
    permissions:
      contents: read
    outputs:
      image_registry: ${{ steps.tag.outputs.registry }}
      image_tag: ${{ steps.tag.outputs.tag }}
      cli_artifact: ${{ steps.tag.outputs.cli_artifact }}
    steps:
      # rules_oci + ~10 service images on a stock GHA runner needs ~25 GB
      # of free disk; default ubuntu-latest is ~14 GB free. Same recipe
      # as pr-checks.yaml's ci-public.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true

      # Same setup-bazel pin + external-cache manifest as pr-checks.yaml.
      # disk-cache is keyed per-workflow so we don't share cache state with
      # ci-public/ci-internal (different bazel targets, different shape).
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8
        with:
          bazelisk-cache: true
          bazelisk-version: 1.27.0
          disk-cache: ${{ github.workflow }}-images
          repository-cache: true
          external-cache: |
            manifest:
              osmo_python_deps: src/locked_requirements.txt
              osmo_tests_python_deps: src/tests/locked_requirements.txt
              osmo_mypy_deps: bzl/mypy/locked_requirements.txt
              pylint_python_deps: bzl/linting/locked_requirements.txt
              io_bazel_rules_go: src/runtime/go.mod
              bazel_gazelle: src/runtime/go.sum

      # nvcr.io auth for rules_oci's `oci_push` (reads ~/.docker/config.json).
      # NGC_API_KEY is a repo secret with push scope on nvcr.io/nvstaging.
      # NGC's convention: literal username `$oauthtoken` + the API key as
      # the password.
      - name: Log in to nvcr.io
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      # Tag layout: nvcr.io/nvstaging/osmo/<image>:pr-<pr|main>-<run-id>-<attempt>-amd64
      # The `-amd64` suffix is appended by rules_oci's per-arch oci_push;
      # we expose the FULL tag (with suffix) so downstream uses match the
      # actual remote tag.
      - id: tag
        run: |
          SCOPE="${{ github.event.pull_request.number || 'main' }}"
          TAG_BASE="pr-${SCOPE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "cli_artifact=head-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "registry=nvcr.io/nvstaging/osmo"
            echo "tag=${TAG_BASE}-amd64"
          } >> "$GITHUB_OUTPUT"

      # Minimal --no-gpu image set: 8 service images + client + init-container.
      # The public repo has no //ci:push_images orchestrator (that's GitLab-CI
      # only — it lives in the internal repo's `ci/` dir). Iterate the
      # per-target oci_push rules directly. Each accepts --repository and
      # --tag at `bazel run` time, so we don't need to mutate the constants
      # repo to redirect from the default nvcr.io/nvidia/osmo path to
      # nvcr.io/nvstaging/osmo.
      - name: Build and push OSMO images
        env:
          REMOTE_CACHE: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
          REG: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          CACHE_FLAG=()
          if [[ -n "${REMOTE_CACHE:-}" ]]; then
            CACHE_FLAG=(--remote_cache="$REMOTE_CACHE")
            echo "::notice::Using bazel remote cache"
          else
            echo "::warning::BAZEL_REMOTE_CACHE_URL not set — cold build will be slow (~60 min)"
          fi

          push_one() {
            local target="$1" image="$2"
            echo "::group::$image → $REG/$image:$TAG"
            echo "▶ $(date -u +%H:%M:%S) bazel run $target"
            bazel run --config=ci "${CACHE_FLAG[@]}" "$target" -- \
              --repository "$REG/$image" \
              --tag "$TAG"
            echo "::endgroup::"
          }

          # SERVICE_IMAGES (per chart's deployment templates)
          push_one //src/service/core:service_push_x86_64                   service
          push_one //src/service/logger:logger_push_x86_64                  logger
          push_one //src/service/agent:agent_service_push_x86_64            agent
          push_one //src/service/authz_sidecar:authz_sidecar_push_x86_64    authz-sidecar
          push_one //src/service/router:router_push_x86_64                  router
          push_one //src/service/worker:worker_push_x86_64                  worker
          push_one //src/service/delayed_job_monitor:delayed_job_monitor_push_x86_64  delayed-job-monitor
          # web-ui uses sh_binary + docker buildx (not oci_push); same flag shape
          push_one //src/ui:build_push_web_ui_x86_64                        web-ui
          # BACKEND_IMAGES the chart's backend_images.{init,client} reference
          push_one //src/cli:cli_push_x86_64                                client
          push_one //src/runtime:init_push_x86_64                           init-container
          # backend-operator chart deploys the listener and worker: without
          # them, the operator install hits ImagePullBackOff and helm `--wait`
          # times out with `context deadline exceeded`. The test runner is spawned
          # later, but it shares the same Python runfiles image construction
          # and is published from the same corrected source revision.
          push_one //src/operator:backend_listener_push_x86_64              backend-listener
          push_one //src/operator:backend_worker_push_x86_64                backend-worker
          push_one //src/operator/backend_test_runner:backend_test_runner_push_x86_64  backend-test-runner

          # Package the CLI from this checkout for the deploy verification and
          # OETF jobs. The client image above already built the expensive
          # PyInstaller tree, so this target is a small cached packaging step.
          echo "::group::HEAD CLI installer"
          bazel build --config=ci "${CACHE_FLAG[@]}" \
            //src/cli/packaging/linux:linux_client_installer_x86_64
          echo "::endgroup::"

      - name: Upload HEAD CLI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.cli_artifact }}
          path: bazel-bin/src/cli/packaging/linux/linux_client_installer_x86_64.sh
          retention-days: 7
          if-no-files-found: error

      # nvcr.io requires auth for every pull. The deploy-osmo job below
      # passes registry credentials to the single-plane script using the
      # same NGC_API_KEY the push here uses, so AKS can pull.
      - name: Step summary
        run: |
          {
            echo "### OSMO images built from source"
            echo ""
            echo "- Registry: \`${{ steps.tag.outputs.registry }}\`"
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo ""
            echo "Packages pushed:"
            for img in \
                service logger agent authz-sidecar router worker \
                delayed-job-monitor web-ui init-container client \
                backend-listener backend-worker backend-test-runner; do
              echo "  - \`${{ steps.tag.outputs.registry }}/$img:${{ steps.tag.outputs.tag }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # One provisioning owner: the public installer. Setup <=20m, pre-clean
  # <=30m, installer <=105m, finalization <=20m, with 5m job-level headroom.
  deploy-osmo:
    needs: [head-chart-contract, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: internal-ci
    env: *azure_env
    outputs:
      producer_attempt: ${{ steps.identity.outputs.attempt }}
      state_artifact: ${{ steps.identity.outputs.state_artifact }}
      marker_artifact: ${{ steps.identity.outputs.marker_artifact }}
      cloud_gate: ${{ steps.marker_upload.outcome }}
    steps:
      - name: Record producer identity
        id: identity
        timeout-minutes: 1
        run: |
          {
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "state_artifact=tf-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "marker_artifact=cloud-attempt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - uses: hashicorp/setup-terraform@v3
        timeout-minutes: 2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Azure login (OIDC)
        uses: azure/login@v2
        timeout-minutes: 2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - &install_tools
        name: Install kubectl and Helm
        timeout-minutes: 2
        run: |
          set -euo pipefail
          KUBECTL_VERSION=v1.31.0
          curl -fsSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" \
            | awk -v file="$RUNNER_TEMP/kubectl" '{ print $1 "  " file }' | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz
          echo "9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Download HEAD CLI
        uses: actions/download-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ needs.build-images.outputs.cli_artifact }}
          path: ${{ runner.temp }}/head-cli
      - &install_cli
        name: Install HEAD CLI
        timeout-minutes: 2
        run: |
          bash "$RUNNER_TEMP/head-cli/linux_client_installer_x86_64.sh"
          osmo version
      - name: Validate inputs and encryption before cloud mutations
        id: preflight
        timeout-minutes: 3
        env:
          OSMO_AZURE_TFSTATE_KEY: ${{ secrets.OSMO_AZURE_TFSTATE_KEY }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${NGC_API_KEY:?Registry credentials are required}"
          source ci/deployment-test/azure-inputs.sh
          ci_azure_inputs
          ci_azure_check_group
          bash ci/deployment-test/azure-state.sh check
          ci_azure_save_inputs "$RUNNER_TEMP/inputs"
          ci_azure_write_marker "$RUNNER_TEMP/cloud-attempt.json"
          mkdir -p "$RUN_DIR" "$RUNNER_TEMP/terraform-work"
          jq -n --arg password "$NGC_API_KEY" \
            '{auths:{"nvcr.io":{auth:(("$oauthtoken:" + $password) | @base64)}}}' \
            > "$RUNNER_TEMP/docker-config.json"
      # A durable marker is a prerequisite for either pre-clean or apply.
      - name: Record permission to begin cloud work
        id: marker_upload
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.identity.outputs.marker_artifact }}
          path: ${{ runner.temp }}/cloud-attempt.json
          retention-days: 7
          if-no-files-found: error
      - name: Clean leftovers in the dedicated resource group
        timeout-minutes: 30
        env:
          PRODUCER_ATTEMPT: ${{ steps.identity.outputs.attempt }}
          AZURE_SWEEP_SECONDS: 1740
        run: bash ci/deployment-test/azure-cleanup.sh sweep "$RUNNER_TEMP/cloud-attempt.json"
      - name: Provision and verify single-plane OSMO
        id: deploy
        timeout-minutes: 105
        env:
          OSMO_IMAGE_REGISTRY: ${{ needs.build-images.outputs.image_registry }}
          OSMO_IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          set -euo pipefail
          source ci/deployment-test/azure-inputs.sh
          ci_azure_inputs
          export OSMO_TERRAFORM_WORK_DIR="$RUNNER_TEMP/terraform-work"
          export OSMO_IMAGE_PULL_SECRET=nvcr-pull
          export OSMO_IMAGE_PULL_CONFIG="$RUNNER_TEMP/docker-config.json"
          bash deployments/scripts/deploy-osmo-single-plane.sh 2>&1 | tee "$RUN_DIR/deploy.log"
      - name: Encrypt state, including partial apply
        id: state
        if: ${{ always() && steps.marker_upload.outcome == 'success' }}
        timeout-minutes: 3
        env:
          OSMO_AZURE_TFSTATE_KEY: ${{ secrets.OSMO_AZURE_TFSTATE_KEY }}
        run: |
          bash ci/deployment-test/azure-state.sh save "$RUNNER_TEMP/terraform-work" \
            "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/cloud-attempt.json" "$RUNNER_TEMP/terraform-state.gpg"
      - name: Upload encrypted state
        if: ${{ always() && steps.state.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: ${{ steps.identity.outputs.state_artifact }}
          path: ${{ runner.temp }}/terraform-state.gpg
          retention-days: 7
          if-no-files-found: error
      - name: Deployment diagnostics
        if: ${{ always() && steps.marker_upload.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PRODUCER_ATTEMPT: ${{ steps.identity.outputs.attempt }}
        run: bash ci/deployment-test/azure-cleanup.sh diagnostics "$RUNNER_TEMP/cloud-attempt.json"
      - name: Deployment summary
        if: always()
        timeout-minutes: 1
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          CLOUD_GATE: ${{ steps.marker_upload.outcome }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
          CHART_VERSION: ${{ needs.head-chart-contract.outputs.chart_version }}
        run: |
          {
            echo '### Single-plane deployment'
            echo "- Cloud gate: $CLOUD_GATE; installer/verification: $DEPLOY_RESULT"
            echo "- Source: $GITHUB_SHA; image tag: $IMAGE_TAG; unified chart: $CHART_VERSION"
            echo '- Namespace/release: osmo'
            echo '- Installer log: deploy.log; cleanup runs separately even after failure.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: deploy-osmo-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/deployment-test-azure/
          retention-days: 14
          if-no-files-found: warn

  oetf:
    needs: [build-images, deploy-osmo]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal-ci
    env: *azure_env
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - uses: azure/login@v2
        timeout-minutes: 1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - *install_tools
      - uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: ${{ needs.build-images.outputs.cli_artifact }}
          path: ${{ runner.temp }}/head-cli
      - *install_cli
      - name: Setup Bazel
        timeout-minutes: 2
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8
        with:
          bazelisk-cache: true
          bazelisk-version: 1.27.0
          disk-cache: ${{ github.workflow }}-oetf
          repository-cache: true
      - name: Existing OETF selection against single-plane
        id: suite
        timeout-minutes: 30
        run: bash ci/deployment-test/run-single-plane-oetf.sh
      - name: OETF summary
        timeout-minutes: 1
        if: always()
        env:
          OETF_RESULT: ${{ steps.suite.outcome }}
        run: |
          {
            echo '### OETF'
            echo "- Result: $OETF_RESULT"
            echo '- Tags: api,websocket,logger,task-env,negative; exclusions: auth,mcp'
            if [[ -s "$RUN_DIR/oetf-result.json" ]]; then
              jq -r '"- Total: \(.total); passed: \(.passed); failed: \(.failed); errors: \(.errored); skipped: \(.skipped)",
                (.results[] | "- \(.target): \(.name) — \(.status)")' "$RUN_DIR/oetf-result.json"
            else
              echo '- No results produced; inspect the OETF step and logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload OETF results
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oetf-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw .oetf-bep.json contains token-valued Bazel arguments. Never upload it.
          path: |
            runs/deployment-test-azure/oetf-result.json
            runs/deployment-test-azure/oetf.log
            runs/deployment-test-azure/oetf-port-forward.log
          retention-days: 14
          if-no-files-found: warn

  # Setup/restore <=10m, diagnostics <=3m, destroy <=22m, sweep <=10m,
  # summary/upload <=5m. A failure in restore/destroy cannot skip the sweep.
  tf-destroy:
    needs: [deploy-osmo, oetf]
    if: ${{ always() && needs.deploy-osmo.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: internal-ci
    env: *azure_env
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Classify cloud attempt
        id: attempt
        timeout-minutes: 1
        env:
          CLOUD_GATE: ${{ needs.deploy-osmo.outputs.cloud_gate }}
        run: |
          case "$CLOUD_GATE" in
            success) echo 'started=true' >> "$GITHUB_OUTPUT" ;;
            skipped|failure)
              echo 'started=false' >> "$GITHUB_OUTPUT"
              echo 'Cloud gate never passed; no Azure mutation is needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo '::error::Cloud attempt unknown after interruption; recover the producer marker before cleanup.'; exit 1 ;;
          esac
      - name: Download producer marker
        id: marker_download
        if: steps.attempt.outputs.started == 'true'
        uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: ${{ needs.deploy-osmo.outputs.marker_artifact }}
          path: ${{ runner.temp }}/marker
      - name: Validate producer and deletion scope
        id: scope
        if: steps.attempt.outputs.started == 'true'
        timeout-minutes: 1
        env:
          PRODUCER_ATTEMPT: ${{ needs.deploy-osmo.outputs.producer_attempt }}
        run: |
          source ci/deployment-test/azure-inputs.sh
          ci_azure_inputs
          ci_azure_check_marker "$RUNNER_TEMP/marker/cloud-attempt.json"
      - name: Azure login for cleanup
        id: azure
        if: steps.scope.outcome == 'success'
        uses: azure/login@v2
        timeout-minutes: 1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        if: steps.scope.outcome == 'success'
        timeout-minutes: 1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Download encrypted producer state
        id: state_download
        if: ${{ always() && steps.azure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: ${{ needs.deploy-osmo.outputs.state_artifact }}
          path: ${{ runner.temp }}/encrypted-state
      - name: Restore state
        id: restore
        if: ${{ always() && steps.state_download.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          OSMO_AZURE_TFSTATE_KEY: ${{ secrets.OSMO_AZURE_TFSTATE_KEY }}
        run: |
          bash ci/deployment-test/azure-state.sh restore \
            "$RUNNER_TEMP/encrypted-state/terraform-state.gpg" "$RUNNER_TEMP/restored-state"
      - name: Install diagnostic tools
        if: ${{ always() && steps.azure.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          curl -fsSL https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl.sha256 \
            | awk -v file="$RUNNER_TEMP/kubectl" '{print $1 "  " file}' | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          # Hosted runners provide Helm; its absence only limits diagnostics.
      - name: Capture cluster diagnostics after OETF
        if: ${{ always() && steps.azure.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PRODUCER_ATTEMPT: ${{ needs.deploy-osmo.outputs.producer_attempt }}
        run: bash ci/deployment-test/azure-cleanup.sh diagnostics "$RUNNER_TEMP/marker/cloud-attempt.json"
      - name: Destroy using the single-plane state and inputs
        id: destroy
        if: ${{ always() && steps.restore.outcome == 'success' && steps.azure.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 22
        env:
          PRODUCER_ATTEMPT: ${{ needs.deploy-osmo.outputs.producer_attempt }}
        run: |
          set -o pipefail
          mkdir -p "$RUN_DIR"
          bash ci/deployment-test/azure-cleanup.sh destroy "$RUNNER_TEMP/marker/cloud-attempt.json" \
            "$RUNNER_TEMP/restored-state" 2>&1 | tee "$RUN_DIR/terraform-destroy.log"
      - name: Sweep partial resources and verify empty inventory
        id: sweep
        if: ${{ always() && steps.azure.outcome == 'success' && steps.scope.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PRODUCER_ATTEMPT: ${{ needs.deploy-osmo.outputs.producer_attempt }}
        run: bash ci/deployment-test/azure-cleanup.sh sweep "$RUNNER_TEMP/marker/cloud-attempt.json"
      - name: Report cleanup result
        if: always()
        timeout-minutes: 1
        env:
          STARTED: ${{ steps.attempt.outputs.started }}
          RESTORE_RESULT: ${{ steps.restore.outcome }}
          DESTROY_RESULT: ${{ steps.destroy.outcome }}
          SWEEP_RESULT: ${{ steps.sweep.outcome }}
        run: |
          {
            echo '### Azure cleanup'
            echo "- Cloud attempt: ${STARTED:-unknown}"
            echo "- Restore: $RESTORE_RESULT; destroy: $DESTROY_RESULT; inventory/sweep: $SWEEP_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$STARTED" == false ]] && exit 0
          [[ "$STARTED" == true && "$RESTORE_RESULT" == success && "$DESTROY_RESULT" == success && "$SWEEP_RESULT" == success ]]
      - name: Upload cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: tf-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/deployment-test-azure/
          retention-days: 14
          if-no-files-found: warn

  notify-slack-on-azure-deployment-test-failure:
    needs: [head-chart-contract, build-images, deploy-osmo, oetf, tf-destroy]
    # always() so this evaluates even when an upstream `needs:` failed.
    # Fires only on scheduled-run failures — PR-label and workflow_dispatch
    # runs surface their own status interactively.
    if: >-
      ${{ always()
          && github.event_name == 'schedule'
          && (needs.head-chart-contract.result == 'failure'
              || needs.build-images.result == 'failure'
              || needs.deploy-osmo.result == 'failure'
              || needs.oetf.result == 'failure'
              || needs.tf-destroy.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      # Best-effort decoration (author/subject/links) — must never block
      # the notification; the post step has fallbacks for every output.
      - name: Gather context (commit metadata + commits since previous green run)
        id: ctx
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW_ID: ${{ github.workflow_ref }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          # 1) HEAD commit metadata — author display name + first-line subject.
          # Daily cron runs land on whatever's on main at fire time. Embed
          # both so the on-call doesn't have to click through to identify
          # whose change is suspect.
          commit_resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                              -H 'Accept: application/vnd.github+json' \
                              "https://api.github.com/repos/${REPO}/commits/${SHA}")
          author=$(jq -r '.commit.author.name // "unknown"' <<<"$commit_resp")
          # First line extracted inside jq — piping jq to `head -1` can
          # SIGPIPE jq on large squash-merge messages and kill the step
          # under pipefail.
          subject=$(jq -r '.commit.message // "" | split("\n")[0]' <<<"$commit_resp")
          # Trim subject to ≤ 120 chars so the Slack block doesn't sprawl.
          if [[ ${#subject} -gt 120 ]]; then subject="${subject:0:117}..."; fi

          # 2) Find the most recent successful scheduled run BEFORE this
          # one, then build a compare link spanning every commit that
          # landed since. Daily cron on a busy repo can easily span 10+
          # commits — a single "current SHA" link is misleading.
          # Fall back to a plain "recent commits on main" view when this
          # is the first scheduled run (no prior green to compare against).
          wf_runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                          -H 'Accept: application/vnd.github+json' \
                          "https://api.github.com/repos/${REPO}/actions/workflows/deployment-test.yaml/runs?event=schedule&status=success&per_page=2")
          prev_sha=$(jq -r --arg this "$RUN_ID" \
            '[(.workflow_runs // [])[] | select((.id | tostring) != $this)] | .[0].head_sha // empty' \
            <<<"$wf_runs")
          if [[ -n "$prev_sha" && "$prev_sha" != "$SHA" ]]; then
            compare_url="${SERVER_URL}/${REPO}/compare/${prev_sha}...${SHA}"
            # Count commits in the range (best-effort).
            compare_resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                                 -H 'Accept: application/vnd.github+json' \
                                 "https://api.github.com/repos/${REPO}/compare/${prev_sha}...${SHA}")
            commit_count=$(jq -r '.total_commits // 0' <<<"$compare_resp")
            compare_label="${commit_count} commits since last green run"
          else
            compare_url="${SERVER_URL}/${REPO}/commits/${GITHUB_REF_NAME:-main}"
            compare_label="Recent commits on main"
          fi

          # 3) Resolve the artifact ID for THIS run so the Slack button
          # deep-links directly to the artifact's download page. GitHub
          # has no `#artifacts` anchor on the run page — links with that
          # fragment land at the top of the page with no scroll. The
          # working URL shape is:
          #   https://github.com/<owner>/<repo>/actions/runs/<run_id>/artifacts/<artifact_id>
          # which renders the artifact's download flow directly. We pick
          # a non-expired diagnostic artifact (exclude encrypted state/markers); fall back
          # to the run page when none is found (e.g. job aborted before
          # the always() upload step ran).
          artifacts_resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                                 -H 'Accept: application/vnd.github+json' \
                                 "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=10")
          # `.artifacts // []` — an API error response has no .artifacts, and
          # iterating null aborts jq (and the step) with exit 5.
          artifact_id=$(jq -r '[(.artifacts // [])[] | select(.expired==false and (.name | startswith("tf-destroy-") or startswith("deploy-osmo-") or startswith("oetf-")))] | .[0].id // empty' <<<"$artifacts_resp")
          artifact_name=$(jq -r '[(.artifacts // [])[] | select(.expired==false and (.name | startswith("tf-destroy-") or startswith("deploy-osmo-") or startswith("oetf-")))] | .[0].name // empty' <<<"$artifacts_resp")
          if [[ -n "$artifact_id" ]]; then
            artifact_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}/artifacts/${artifact_id}"
            artifact_label="Download ${artifact_name}"
          else
            artifact_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
            artifact_label="(no artifact yet — open run page)"
          fi

          # 4) Persist outputs (escape multi-line values).
          {
            echo "author<<__GHA_EOF__"; echo "$author"; echo "__GHA_EOF__"
            echo "subject<<__GHA_EOF__"; echo "$subject"; echo "__GHA_EOF__"
            echo "short_sha=${SHA:0:7}"
            echo "compare_url=$compare_url"
            echo "compare_label=$compare_label"
            echo "artifact_url=$artifact_url"
            echo "artifact_label=$artifact_label"
          } >> "$GITHUB_OUTPUT"

      - name: Post failure notification to Slack
        env:
          OSMO_SLACK_BOT_TOKEN: ${{ secrets.OSMO_SLACK_BOT_TOKEN }}
          # `vars.CI_SLACK_CHANNEL` lets the channel be overridden at the
          # repo/org level without editing this file. Default `osmo-slack-test`
          # while the gate proves itself; flip to e.g. #osmo-oncall once it's
          # trusted. Note: the org-level `vars.TESTBOT_SLACK_CHANNEL` is NOT
          # what we want here — it points at #osmo-code-reviews (testbot's
          # PR-review channel), which is the wrong audience for deploy-gate
          # failures.
          SLACK_CHANNEL: ${{ vars.CI_SLACK_CHANNEL || 'osmo-slack-test' }}
          CHART_RESULT: ${{ needs.head-chart-contract.result }}
          BI_RESULT: ${{ needs.build-images.result }}
          DEPLOY_RESULT: ${{ needs.deploy-osmo.result }}
          OETF_RESULT: ${{ needs.oetf.result }}
          DESTROY_RESULT: ${{ needs.tf-destroy.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AUTHOR: ${{ steps.ctx.outputs.author }}
          SUBJECT: ${{ steps.ctx.outputs.subject }}
          SHORT_SHA: ${{ steps.ctx.outputs.short_sha }}
          FULL_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          COMPARE_URL: ${{ steps.ctx.outputs.compare_url }}
          COMPARE_LABEL: ${{ steps.ctx.outputs.compare_label }}
          ARTIFACT_URL: ${{ steps.ctx.outputs.artifact_url }}
          ARTIFACT_LABEL: ${{ steps.ctx.outputs.artifact_label }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [[ -z "${OSMO_SLACK_BOT_TOKEN:-}" ]]; then
            echo "::warning::OSMO_SLACK_BOT_TOKEN secret not set — skipping Slack notification."
            exit 0
          fi

          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          if [[ -n "${RUN_ATTEMPT:-}" && "${RUN_ATTEMPT}" != "1" ]]; then
            run_url="${run_url}/attempts/${RUN_ATTEMPT}"
          fi
          commit_url="${SERVER_URL}/${REPO}/commit/${FULL_SHA}"
          workflow_url="${SERVER_URL}/${REPO}/blob/${REF_NAME}/.github/workflows/deployment-test.yaml"
          # Gather-context is continue-on-error, so any of its outputs may
          # be empty here.
          AUTHOR="${AUTHOR:-unknown}"
          SUBJECT="${SUBJECT:-(commit metadata unavailable)}"
          SHORT_SHA="${SHORT_SHA:-${FULL_SHA:0:7}}"
          COMPARE_URL="${COMPARE_URL:-${SERVER_URL}/${REPO}/commits/${REF_NAME}}"
          COMPARE_LABEL="${COMPARE_LABEL:-Recent commits}"
          artifact_url="${ARTIFACT_URL:-$run_url}"
          artifact_label="${ARTIFACT_LABEL:-Open run page}"
          header_text=":x: OSMO Azure deployment-test FAILED"
          trigger_label="Daily schedule (00:00 UTC = 5pm PDT)"

          payload=$(jq -n \
            --arg channel       "$SLACK_CHANNEL" \
            --arg header_text   "$header_text" \
            --arg trigger_label "$trigger_label" \
            --arg branch        "$REF_NAME" \
            --arg short_sha     "$SHORT_SHA" \
            --arg author        "$AUTHOR" \
            --arg subject       "$SUBJECT" \
            --arg chart         "$CHART_RESULT" \
            --arg bi            "$BI_RESULT" \
            --arg deploy        "$DEPLOY_RESULT" \
            --arg oetf          "$OETF_RESULT" \
            --arg destroy       "$DESTROY_RESULT" \
            --arg workflow      "$WORKFLOW" \
            --arg run_url       "$run_url" \
            --arg commit_url    "$commit_url" \
            --arg workflow_url  "$workflow_url" \
            --arg artifact_url  "$artifact_url" \
            --arg artifact_label "$artifact_label" \
            --arg compare_url   "$COMPARE_URL" \
            --arg compare_label "$COMPARE_LABEL" \
            --arg run_id        "$RUN_ID" \
            '{
              channel: $channel,
              text: "\($header_text) — \($workflow) run #\($run_id) (branch \($branch))",
              blocks: [
                { type: "header",
                  text: { type: "plain_text", text: $header_text } },
                { type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*head-chart-contract*\n`\($chart)`" },
                    { type: "mrkdwn", text: "*build-images*\n`\($bi)`" },
                    { type: "mrkdwn", text: "*deploy-osmo*\n`\($deploy)`" },
                    { type: "mrkdwn", text: "*oetf*\n`\($oetf)`" },
                    { type: "mrkdwn", text: "*tf-destroy*\n`\($destroy)`" },
                    { type: "mrkdwn", text: "*Trigger*\n\($trigger_label)" }
                  ] },
                { type: "section",
                  text: { type: "mrkdwn",
                          text: "*Branch:* `\($branch)`  •  *Tested commit:* <\($commit_url)|`\($short_sha)`> by *\($author)*\n>\($subject)" } },
                { type: "context",
                  elements: [
                    { type: "mrkdwn",
                      text: "Daily cron can span many commits since the last green run. Use the *\($compare_label)* button to see everything that landed in between — narrowing blame from a single SHA to the actual contributing change is usually faster from the compare view." }
                  ] },
                { type: "actions",
                  elements: [
                    { type: "button",
                      text: { type: "plain_text", text: "View run + logs" },
                      url:  $run_url,
                      style: "danger" },
                    { type: "button",
                      text: { type: "plain_text", text: $artifact_label },
                      url:  $artifact_url },
                    { type: "button",
                      text: { type: "plain_text", text: $compare_label },
                      url:  $compare_url },
                    { type: "button",
                      text: { type: "plain_text", text: "Workflow file" },
                      url:  $workflow_url }
                  ] },
                { type: "context",
                  elements: [
                    { type: "mrkdwn",
                      text: ":bulb: First-look investigation: open *Download artifacts* → unzip → check the deploy-osmo, oetf and tf-destroy job summaries and their diagnostic artifacts." }
                  ] }
              ]
            }')

          echo "::group::Slack payload (preview)"
          # head may close the pipe early — don't let SIGPIPE fail the step.
          { echo "$payload" | jq -C . | head -80; } || true
          echo "::endgroup::"

          # Same `chat.postMessage` call pattern that
          # update-distroless-images.yaml uses (lines 210–224). Stay resilient:
          # we never want a Slack outage to turn a passed deploy into a
          # failed run, so log + continue rather than fail.
          if ! response=$(
            curl -fsSL \
              -H "Authorization: Bearer $OSMO_SLACK_BOT_TOKEN" \
              -H 'Content-Type: application/json; charset=utf-8' \
              -d "$payload" \
              https://slack.com/api/chat.postMessage
          ); then
            echo "::warning::Slack POST failed (network/transport) — message not delivered."
            exit 0
          fi
          ok=$(jq -r '.ok' <<<"$response")
          if [[ "$ok" != "true" ]]; then
            echo "::warning::Slack chat.postMessage returned ok=$ok — message not delivered."
            echo "  Full response: $response"
            exit 0
          fi
          ts=$(jq -r '.ts // ""' <<<"$response")
          ch=$(jq -r '.channel // ""' <<<"$response")
          echo "::notice::Slack notification posted to channel $ch (ts=$ts)."
