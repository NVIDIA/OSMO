# Responds to /testbot commands in review comments on AI-generated PRs.
# Delegates fixes to Claude Code CLI and posts inline replies.
name: Testbot - Respond to Reviews

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: testbot-respond-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  respond:
    environment: testbot-respond
    # Label gate + fork rejection. Author association is checked per-thread in
    # respond.py, not here — a bot comment event must still let the workflow run
    # so it can process pending /testbot threads from repo members.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-generated') &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.SVC_OSMO_CI_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.6'

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/ui/package.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: pnpm install --frozen-lockfile

      # bazel-contrib/setup-bazel uses GitHub's listReleases API to find the
      # bazelisk binary, but as of 2026-04-27 that endpoint returns an empty
      # array for bazelbuild/bazelisk while /releases/tags/v<X> still works.
      # Install bazelisk directly from the asset URL to bypass the broken path.
      # Bazelisk doesn't publish official checksums for v1.27.0 (issue #306),
      # so we pin the SHA256 we observed and verify before sudo-installing.
      - name: Install Bazelisk
        env:
          BAZELISK_VERSION: v1.27.0
          BAZELISK_SHA256: e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazelisk" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  $RUNNER_TEMP/bazelisk" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/bazelisk" /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Configure git
        run: |
          git config user.name "testbot[bot]"
          git config user.email "testbot[bot]@users.noreply.github.com"

      # Runner health probe. Runs 32920178725 and 32402379151 ended with "the
      # runner has received a shutdown signal" and exit 143 about 8-9 minutes
      # into the step below — short of both its 900s CLI timeout and this
      # job's 20min timeout, with no review comment or newer run that could
      # have cancelled them. Every post step was skipped, where the run that
      # hit the CLI timeout cleanly ran all of its post steps. That is the
      # runner VM going away, not the job being stopped, and of the 30 most
      # recent failed OSMO runs the message appears on this workflow alone.
      #
      # The step captures Claude's output and prints nothing, so there is no
      # evidence for any cause. This samples the candidates — memory, disk
      # bytes, inodes, kernel OOM kills — and names the processes holding
      # them, so the next occurrence identifies the culprit.
      #
      # Everything streams to the live log deliberately: post steps are
      # exactly what this failure skips, so a summary written there would be
      # lost. Streamed lines survive.
      - name: Start runner health probe
        run: |
          cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          # Deliberately no `set -e`: a probe must never fail the job.
          # Record our own pid, not setsid's — setsid forks, so the launcher's
          # $! belongs to a process that has already exited by the time the
          # stop step tries to use it, and the probe outlives the job.
          echo $$ > "$RUNNER_TEMP/probe.pid"
          # kernel.dmesg_restrict means dmesg usually needs sudo here, but
          # never assume it is available — fall back, then give up quietly.
          read_dmesg() { dmesg 2>/dev/null || sudo -n dmesg 2>/dev/null || true; }
          oom_seen=$(read_dmesg | grep -ci 'Killed process')
          tick=0
          while true; do
            mem=$(free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB total=%sMB", $3, $7, $2}')
            swap=$(free -m | awk '/^Swap:/{printf "%s/%sMB", $3, $2}')
            root=$(df -h --output=pcent,avail / | awk 'NR==2{printf "%s used %s free", $1, $2}')
            # NB: -i and --output are mutually exclusive, hence ipcent/iavail.
            inode=$(df --output=ipcent,iavail / | awk 'NR==2{printf "%s used %s free", $1, $2}')
            top=$(ps -eo rss,comm --no-headers --sort=-rss 2>/dev/null | head -3 \
                  | awk '{printf "%s=%dMB ", $2, $1/1024}')
            echo "[probe] $(date -u +%H:%M:%S) mem: $mem swap=$swap | root: $root | inodes: $inode | top: $top"

            # Kernel OOM killer is the definitive answer for the memory case.
            oom_now=$(read_dmesg | grep -ci 'Killed process')
            if [ "${oom_now:-0}" -gt "${oom_seen:-0}" ]; then
              echo "[probe] *** KERNEL OOM KILL DETECTED ***"
              read_dmesg | grep -i 'Killed process\|Out of memory' | tail -5 | sed 's/^/[probe]   /'
              oom_seen=$oom_now
            fi

            # Every 4th tick (~1min): what is actually running. Claude may
            # shell out to bazel, whose output base dwarfs the disk a hosted
            # runner has free, and its allowedTools include `rm *` and `mv *`.
            if [ $((tick % 4)) -eq 0 ]; then
              echo "[probe] top 12 processes by RSS:"
              ps -eo rss,etimes,pid,args --no-headers --sort=-rss 2>/dev/null \
                | head -12 | cut -c1-180 \
                | awk '{rss=$1; $1=""; printf "[probe]   %6dMB %s\n", rss/1024, $0}'
            fi

            # Name the directories eating the disk before it is too late.
            pct=$(df --output=pcent / | tr -dc '0-9')
            if [ "${pct:-0}" -ge 85 ]; then
              echo "[probe] *** ROOT DISK AT ${pct}% — largest directories ***"
              timeout 20 du -xh -d2 /home/runner /tmp /var 2>/dev/null \
                | sort -rh | head -12 | sed 's/^/[probe]   /'
            fi
            tick=$((tick + 1))
            sleep 15
          done
          PROBE
          chmod +x "$RUNNER_TEMP/probe.sh"
          # setsid + nohup so the probe outlives this step and keeps sampling
          # through the Claude run. Its stdout is the live job log.
          rm -f "$RUNNER_TEMP/probe.pid"
          setsid nohup "$RUNNER_TEMP/probe.sh" > "$RUNNER_TEMP/probe.log" 2>&1 &
          for _ in 1 2 3 4 5; do
            [ -s "$RUNNER_TEMP/probe.pid" ] && break
            sleep 1
          done
          echo "probe started (pid $(cat "$RUNNER_TEMP/probe.pid" 2>/dev/null || echo unknown))"

      - name: Respond to review comments
        run: |
          # Stream the probe's samples into this step's log so they are
          # interleaved with the run and flushed as they happen.
          tail -f "$RUNNER_TEMP/probe.log" &
          TAIL_PID=$!
          trap 'kill "$TAIL_PID" 2>/dev/null || true' EXIT

          # Baseline, so a later sample can be compared against a known start.
          echo "[probe] baseline:"
          free -m | sed 's/^/[probe]   /'
          df -h / /mnt 2>/dev/null | sed 's/^/[probe]   /'
          df -i / /mnt 2>/dev/null | sed 's/^/[probe]   /'

          # -u so respond.py's own progress reaches the log before a hard
          # kill instead of dying in a buffer.
          PYTHONPATH=src/scripts python -u -m testbot.respond \
            --pr-number ${{ github.event.pull_request.number }} \
            --trigger-phrase /testbot \
            --max-responses 10 \
            --max-turns 200 \
            --timeout 900 \
            --model aws/anthropic/bedrock-claude-opus-5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.NVIDIA_NIM_KEY }}
          ANTHROPIC_BASE_URL: https://inference-api.nvidia.com
          DISABLE_PROMPT_CACHING: "1"  # NVIDIA gateway rejects cache_control.ephemeral.scope
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"  # NVIDIA gateway rejects context_management
          GH_TOKEN: ${{ secrets.SVC_OSMO_CI_TOKEN }}

      # Only reached when the runner survives, which is itself a useful
      # signal: if this step is missing from a run, the VM died. The peak
      # figures come from the streamed samples above, not from here.
      - name: Stop runner health probe
        if: always()
        run: |
          probe_pid=$(cat "$RUNNER_TEMP/probe.pid" 2>/dev/null)
          # setsid made it a group leader, so signal the group; fall back to
          # the bare pid, then to a name match.
          [ -n "$probe_pid" ] && { kill -- "-$probe_pid" 2>/dev/null || kill "$probe_pid" 2>/dev/null; }
          pkill -f "$RUNNER_TEMP/probe.sh" 2>/dev/null || true
          echo "[probe] final:"
          free -m | sed 's/^/[probe]   /'
          df -h / /mnt 2>/dev/null | sed 's/^/[probe]   /'
          df -i / /mnt 2>/dev/null | sed 's/^/[probe]   /'
          echo "[probe] highest memory sample seen:"
          grep -o 'used=[0-9]*MB' "$RUNNER_TEMP/probe.log" 2>/dev/null \
            | tr -dc '0-9\n' | sort -n | tail -1 | sed 's/^/[probe]   used=/;s/$/MB/'
          # grep -c prints 0 *and* exits non-zero on no match, so `|| echo 0`
          # would print it twice.
          echo "[probe] OOM kills recorded: $(grep -c 'KERNEL OOM KILL' "$RUNNER_TEMP/probe.log" 2>/dev/null || true)"
