name: Testbot - Respond to Reviews

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: testbot-respond-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    environment: testbot-respond
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-generated') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login != 'svc-osmo-ci' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          token: ${{ secrets.SVC_OSMO_CI_TOKEN }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'

      - name: Prepare review requests
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.SVC_OSMO_CI_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/testbot-harness/src/scripts"
          cp -R src/scripts/testbot "$RUNNER_TEMP/testbot-harness/src/scripts/"
          PYTHONPATH="$RUNNER_TEMP/testbot-harness" \
            python "$RUNNER_TEMP/testbot-harness/src/scripts/testbot/respond.py" \
              --stage prepare --pr-number "$PR_NUMBER" \
              --request "$RUNNER_TEMP/testbot-response-request.json" \
              --artifacts "$RUNNER_TEMP/testbot-respond"

      - name: Setup agents and build tools
        if: steps.prepare.outputs.has_work == 'true'
        uses: ./.github/actions/testbot-setup
        with:
          build-tools: 'true'
          reviewer-sandbox: 'true'

      - name: Checkout requested PR revision
        if: steps.prepare.outputs.has_work == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.prepare.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.SVC_OSMO_CI_TOKEN }}
          persist-credentials: false

      - name: Apply and verify changes
        id: apply
        if: steps.prepare.outputs.has_work == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_NIM_KEY }}
        run: |
          PYTHONPATH="$RUNNER_TEMP/testbot-harness" \
            python "$RUNNER_TEMP/testbot-harness/src/scripts/testbot/respond.py" \
              --stage apply --pr-number "$PR_NUMBER" \
              --request "$RUNNER_TEMP/testbot-response-request.json" \
              --artifacts "$RUNNER_TEMP/testbot-respond"

      - name: Publish changes and replies
        if: always() && contains(fromJSON('["success","failure"]'), steps.apply.outcome)
        env:
          GH_TOKEN: ${{ secrets.SVC_OSMO_CI_TOKEN }}
          TESTBOT_APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          PYTHONPATH="$RUNNER_TEMP/testbot-harness" \
            python "$RUNNER_TEMP/testbot-harness/src/scripts/testbot/respond.py" \
              --stage publish --pr-number "$PR_NUMBER" \
              --request "$RUNNER_TEMP/testbot-response-request.json" \
              --artifacts "$RUNNER_TEMP/testbot-respond"

      - name: Upload diagnostics
        if: always() && steps.prepare.outputs.has_work == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbot-respond-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testbot-respond/
          if-no-files-found: ignore
          retention-days: 14
