# Generate, review, and verify tests before publication.
name: Testbot

on:
  schedule:
    - cron: '0 */2 * * 1-5'  # Every two hours on weekdays
  workflow_dispatch:
    inputs:
      max_targets:
        description: 'Max files to target'
        default: '3'
      max_uncovered:
        description: 'Max uncovered lines per target (0 = no cap)'
        default: '500'
      max_turns:
        description: 'Max generation agent turns'
        default: '400'
      timeout_minutes:
        description: 'Maximum minutes for each pipeline job'
        default: '75'
      model:
        description: 'LLM model name on NVIDIA gateway'
        default: 'aws/anthropic/bedrock-claude-opus-5'
      dry_run:
        description: 'Generate but do not create PR'
        type: boolean
        default: false
      slack_channel:
        description: 'Slack channel for review request (empty = no notification)'
        default: '#osmo-code-reviews'
      force_run:
        description: 'Bypass the open-PR preflight'
        type: boolean
        default: false
      force_create_pr:
        description: 'Allow publication while another testbot PR awaits review'
        type: boolean
        default: false
      skip_slack:
        description: 'Skip the Slack review request'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: testbot
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.open-testbot-prs.outputs.should_run }}
    steps:
      - name: Check open testbot PRs
        id: open-testbot-prs
        run: |
          set -euo pipefail
          if [[ "$FORCE_RUN" == "true" ]]; then
            echo "force_run=true; bypassing open-PR preflight check."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! unapproved_prs="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --label ai-generated \
              --state open \
              --author svc-osmo-ci \
              --json number,reviewDecision,url \
              --jq '.[] | select(.reviewDecision != "APPROVED") | "#\(.number) \(.reviewDecision // "UNKNOWN") \(.url)"'
          )"; then
            echo "Failed to list open testbot PRs; skipping generation."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$unapproved_prs" ]]; then
            echo "Open unapproved testbot PR(s) exist; skipping generation:"
            echo "$unapproved_prs"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No open unapproved testbot PRs; continuing."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FORCE_RUN: ${{ inputs.force_run || 'false' }}

  select-targets:
    name: Pick targets
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    environment: nim-env
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      has_targets: ${{ steps.pick-targets.outputs.has_targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up runtimes and check reviewer sandbox early
        uses: ./.github/actions/testbot-setup
        with:
          reviewer-sandbox: 'true'

      - name: Score criticality (Stage 1)
        run: |
          mkdir -p "$RUNNER_TEMP/testbot-targets"
          PYTHONPATH=. python src/scripts/testbot/criticality_scorer.py \
            --repo-root . \
            --shortlist-size 20 \
            --max-uncovered ${{ inputs.max_uncovered || '500' }} \
            --output "$RUNNER_TEMP/testbot-targets/shortlist.json"
          echo "::group::Shortlist JSON (full per-signal breakdown)"
          cat "$RUNNER_TEMP/testbot-targets/shortlist.json"
          echo "::endgroup::"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Pick targets via subagent (Stage 2)
        id: pick-targets
        run: |
          PYTHONPATH=. python src/scripts/testbot/select_targets_agent.py \
            --shortlist "$RUNNER_TEMP/testbot-targets/shortlist.json" \
            --max-targets ${{ inputs.max_targets || '3' }} \
            --output "$RUNNER_TEMP/testbot-targets/targets.txt" \
            --meta-output "$RUNNER_TEMP/testbot-targets/targets_meta.json"
          echo "::group::Selected targets"
          cat "$RUNNER_TEMP/testbot-targets/targets.txt"
          echo "::endgroup::"
          jq -r '"has_targets=\(length > 0)"' "$RUNNER_TEMP/testbot-targets/targets_meta.json" >> "$GITHUB_OUTPUT"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.NVIDIA_NIM_KEY }}
          ANTHROPIC_BASE_URL: https://inference-api.nvidia.com
          ANTHROPIC_MODEL: ${{ inputs.model || 'aws/anthropic/bedrock-claude-opus-5' }}
          DISABLE_PROMPT_CACHING: "1"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"

      - name: Summarize selection
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          PYTHONPATH=. python -m src.scripts.testbot.run_summary \
            --artifacts "$RUNNER_TEMP/testbot-targets" --stage selection \
            --outcome "$JOB_OUTCOME"

      - name: Preserve targets diagnostics and changes
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: testbot-targets-${{ github.run_id }}
          path: ${{ runner.temp }}/testbot-targets/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  generate-tests:
    name: Generate tests
    needs: select-targets
    if: needs.select-targets.outputs.has_targets == 'true'
    environment: nim-env
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '75') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/testbot-setup
        with:
          build-tools: 'true'

      - name: Download targets handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testbot-targets-${{ github.run_id }}
          path: ${{ runner.temp }}/testbot-targets

      - name: Generate tests with recovery
        run: |
          stop_token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$stop_token"
          set +e
          PYTHONPATH=. python -m src.scripts.testbot.pipeline \
            --stage generate --artifacts "$RUNNER_TEMP/testbot" \
            --targets-meta "$RUNNER_TEMP/testbot-targets/targets_meta.json" \
            --max-turns "$MAX_TURNS"
          status=$?
          echo "::$stop_token::"
          exit "$status"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.NVIDIA_NIM_KEY }}
          ANTHROPIC_BASE_URL: https://inference-api.nvidia.com
          ANTHROPIC_MODEL: ${{ inputs.model || 'aws/anthropic/bedrock-claude-opus-5' }}
          MAX_TURNS: ${{ inputs.max_turns || '400' }}
          DISABLE_PROMPT_CACHING: "1"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"

      - name: Summarize generation
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          PYTHONPATH=. python -m src.scripts.testbot.run_summary \
            --artifacts "$RUNNER_TEMP/testbot" --stage generation \
            --outcome "$JOB_OUTCOME"

      - name: Preserve generation diagnostics and changes
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: testbot-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/testbot/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  review-tests:
    name: Review, repair, and verify
    needs: generate-tests
    environment: nim-env
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '75') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build tools and reviewer sandbox
        uses: ./.github/actions/testbot-setup
        with:
          build-tools: 'true'
          reviewer-sandbox: 'true'

      - name: Download generation handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testbot-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/testbot

      - name: Review, repair, and verify
        run: |
          stop_token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$stop_token"
          set +e
          PYTHONPATH=. python -m src.scripts.testbot.pipeline \
            --stage review --artifacts "$RUNNER_TEMP/testbot"
          status=$?
          echo "::$stop_token::"
          exit "$status"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_NIM_KEY }}

      - name: Summarize review
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          PYTHONPATH=. python -m src.scripts.testbot.run_summary \
            --artifacts "$RUNNER_TEMP/testbot" --stage review \
            --outcome "$JOB_OUTCOME"

      - name: Preserve review diagnostics and changes
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: testbot-review-${{ github.run_id }}
          path: ${{ runner.temp }}/testbot/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve publication inputs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: testbot-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/testbot/final.patch
            ${{ runner.temp }}/testbot/handoff.json
            ${{ runner.temp }}/testbot/verified_changes.json
            ${{ runner.temp }}/testbot/targets_meta.json
            ${{ runner.temp }}/testbot/generate_summary.md
            ${{ runner.temp }}/testbot/review_summary.md
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish PR or finish dry run
    needs: review-tests
    environment: nim-env
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.SVC_OSMO_CI_TOKEN }}

      - name: Set up publication runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'

      - name: Download review handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testbot-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/testbot

      - name: Restore and check the verified changes
        run: |
          PYTHONPATH=. python -m src.scripts.testbot.pipeline \
            --stage restore --artifacts "$RUNNER_TEMP/testbot"

      - name: Create PR
        id: create-pr
        if: inputs.dry_run != true
        run: |
          git config user.name "testbot[bot]"
          git config user.email "testbot[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          PYTHONPATH=. python -m src.scripts.testbot.create_pr \
            --targets-meta "$RUNNER_TEMP/testbot/targets_meta.json" \
            --generate-summary "$RUNNER_TEMP/testbot/generate_summary.md" \
            --review-summary "$RUNNER_TEMP/testbot/review_summary.md" \
            --verified-changes "$RUNNER_TEMP/testbot/verified_changes.json"
        env:
          GH_TOKEN: ${{ secrets.SVC_OSMO_CI_TOKEN }}
          FORCE_CREATE_PR: ${{ inputs.force_create_pr || 'false' }}
          # A flag avoids empty-string expressions falling back to the secret.
          SKIP_SLACK: ${{ inputs.skip_slack || 'false' }}
          TESTBOT_SLACK_BOT_TOKEN: ${{ secrets.TESTBOT_SLACK_BOT_TOKEN }}
          # Only null uses defaults; an empty channel disables notification.
          TESTBOT_SLACK_CHANNEL: ${{ inputs.slack_channel == null && (vars.TESTBOT_SLACK_CHANNEL || '#osmo-slack-test') || inputs.slack_channel }}

      - name: Summarize publish
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TESTBOT_PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          PYTHONPATH=. python -m src.scripts.testbot.run_summary \
            --artifacts "$RUNNER_TEMP/testbot" --stage publish \
            --outcome "$JOB_OUTCOME" --dry-run "$DRY_RUN" --pr-url "$TESTBOT_PR_URL"
