{{- if .Values.podDisruptionBudget.enabled }}
{{- $hasMin := ne .Values.podDisruptionBudget.minAvailable nil -}}
{{- $hasMax := ne .Values.podDisruptionBudget.maxUnavailable nil -}}
{{- if eq $hasMin $hasMax -}}
{{- fail "podDisruptionBudget requires exactly one of minAvailable or maxUnavailable" -}}
{{- end -}}
{{- if semverCompare ">=1.21-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: policy/v1
{{- else -}}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ template "dex.fullname" . }}
  namespace: {{ include "dex.namespace" . }}
  labels:
{{ include "dex.labels" . | indent 4 }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dex.selectorLabels" . | nindent 6 }}
{{- end }}
