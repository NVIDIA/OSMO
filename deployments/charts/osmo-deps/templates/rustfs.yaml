{{- $name := printf "%s-rustfs" (include "osmo-deps.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo-deps.componentLabels" (dict "root" . "component" "rustfs") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rustfs
  ports:
    - name: s3
      port: {{ .Values.rustfs.port }}
      targetPort: s3
    - name: console
      port: {{ .Values.rustfs.consolePort }}
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo-deps.componentLabels" (dict "root" . "component" "rustfs") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rustfs
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image | quote }}
          imagePullPolicy: {{ .Values.rustfs.pullPolicy }}
          args: ["/data"]
          env:
            - name: RUSTFS_ADDRESS
              value: ":{{ .Values.rustfs.port }}"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmo-deps.credentialsSecretName" . }}
                  key: access_key_id
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmo-deps.credentialsSecretName" . }}
                  key: access_key
          ports:
            - name: s3
              containerPort: {{ .Values.rustfs.port }}
            - name: console
              containerPort: {{ .Values.rustfs.consolePort }}
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
