nameOverride: ""
fullnameOverride: ""

credentials:
  secretName: ""
  postgresqlPassword: osmo
  valkeyPassword: osmo
  objectStorageAccessKeyId: osmo
  objectStorageAccessKey: osmo-local-secret
  adminPassword: "0123456789012345678901234567890123456789012"
  mek: |
    currentMek: key1
    meks:
      key1: eyJrIjoiTURFeU16UTFOamM0T1RBeE1qTTBOVFkzT0Rrd01USXpORFUyTnpnNU1ERT0iLCJraWQiOiJrZXkxIiwia3R5Ijoib2N0In0=

postgresql:
  image: postgres:15.13-alpine
  pullPolicy: IfNotPresent
  database: osmo
  username: postgres
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

valkey:
  image: valkey/valkey:8.1.3-alpine
  pullPolicy: IfNotPresent
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

rustfs:
  image: rustfs/rustfs:1.0.0-beta.11
  pullPolicy: IfNotPresent
  port: 9000
  consolePort: 9001
  region: us-east-1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

buckets:
  image: amazon/aws-cli:2.15.33
  pullPolicy: IfNotPresent
  names:
    - osmo-workflows
    - osmo-logs
    - osmo-apps
