exposure:
  mode: external
  baseUrl: http://osmo-gateway

externalDependencies:
  postgresql:
    host: external-postgresql
    port: 5432
    database: osmo
    username: postgres
  valkey:
    host: external-valkey
    port: 6379
    database: 0
  objectStorage:
    endpoint: https://s3.external.example.com
    region: us-east-1
    buckets:
      workflows: osmo-workflows
      logs: osmo-logs
      apps: osmo-apps

secrets:
  postgresql:
    existingSecret: external-control-secrets
  valkey:
    existingSecret: external-control-secrets
  objectStorage:
    existingSecret: external-control-secrets
  masterEncryptionKey:
    existingSecret: external-control-secrets

services:
  api:
    image:
      name: service
  mcp:
    enabled: false
