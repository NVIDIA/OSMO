# Save this content as self-contained-environment-values.yaml and update the
# URL and cluster CIDRs for the target environment. It inherits
# authentication.provider=embeddedDex from the base values. The chart creates
# credentials only in retained Kubernetes Secrets; do not put them in this
# file. See the split-plane deployment guide for the canonical Secret ownership
# and external OIDC contracts.

# Keep this value when using the guide's local port-forward. Replace it with the
# public HTTPS origin when OSMO is exposed through a managed edge.
externalUrl: http://127.0.0.1:8080

compute:
  workflowNetworkPolicy:
    # Replace with every IPv4 Pod and Service CIDR used by your cluster. Omit
    # duplicate entries when one CIDR covers both networks.
    clusterCIDRs:
    - 10.0.0.0/8
