# Compute-only example for a backend that connects to an externally managed
# OSMO control plane. Provision osmo-backend-token in the release namespace
# before installing this profile.
planes:
  control:
    enabled: false
  compute:
    enabled: true

embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false
  kaiScheduler:
    enabled: false

computePlane:
  global:
    osmoImageTag: "6.4.0"
    serviceUrl: https://osmo.example.com
    loginMethod: token
    accountTokenSecret: osmo-backend-token
    accountTokenSecretKey: token
    agentNamespace: ''
    backendName: default
    backendNamespace: ''
  podMonitor:
    enabled: false
  backendTestRunner:
    enabled: false
