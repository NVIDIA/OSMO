# Compute-only example for a backend that connects to an externally managed
# OSMO control plane. Provision osmo-backend-token in the release namespace
# before installing this profile.
planes:
  control:
    enabled: false
  compute:
    enabled: true

fullnameOverride: ''

embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false

externalUrl: https://osmo.example.com

secrets:
  valkey:
    generate: false
  objectStorage:
    generate: false
  backendApiTokens:
    enabled: false
    credentials: []
  masterEncryptionKey:
    managementMode: external
    existingSecret:
      name: ''
    bootstrap:
      enabled: false

compute:
  workloadNamespace:
    name: ''
    create: false
  backendTestNamespace: ''
  authentication:
    existingSecret: osmo-backend-token
    tokenKey: token

services:
  backendListener:
    resources:
      requests:
        cpu: '1'
        memory: 2Gi
      limits:
        memory: 2Gi
    pod:
      topologySpreadConstraints: null
  backendWorker:
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
    pod:
      topologySpreadConstraints: null
  backendTestRunner:
    enabled: false
