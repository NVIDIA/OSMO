# Compute-only example for a backend that connects to an externally managed
# OSMO control plane. Provision osmo-backend-token in the release namespace
# before installing this profile.
planes:
  control:
    enabled: false
  compute:
    enabled: true

embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false
  kaiScheduler:
    enabled: false

externalUrl: https://osmo.example.com

compute:
  backendName: default
  namespace: ''
  backendTestNamespace: ''
  loginMethod: token
  accountTokenSecret: osmo-backend-token
  accountTokenSecretKey: token

services:
  backendTestRunner:
    enabled: false
