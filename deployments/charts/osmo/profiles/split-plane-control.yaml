planes:
  control:
    enabled: true
  compute:
    enabled: false

embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false
  kaiScheduler:
    enabled: false

configuration:
  enabled: true
  workflow:
    # The public 6.3.1 image predates workflow label policies.
    labels_config: null

services:
  mcp:
    enabled: false
  ui:
    enabled: true
  worker:
    autoscaling:
      enabled: true
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      labels: {}
      annotations: {}
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
  api:
    autoscaling:
      enabled: true
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      labels: {}
      annotations: {}
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
  router:
    autoscaling:
      enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
    podDisruptionBudget:
      enabled: true
      labels: {}
      annotations: {}
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
  logger:
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
      labels: {}
      annotations: {}
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
  agent:
    autoscaling:
      enabled: true

gateway:
  envoy:
    enabled: true
    autoscaling:
      enabled: true
    podDisruptionBudget:
      enabled: true
      labels: {}
      annotations: {}
      maxUnavailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    service:
      # Keep the unauthenticated in-cluster gateway behind an operator-managed,
      # authenticating edge rather than provisioning a public load balancer.
      type: ClusterIP
  oauth2Proxy:
    enabled: false
  authz:
    enabled: false
  rateLimit:
    enabled: false

monitoring:
  podMonitor:
    enabled: false

secrets:
  postgresql:
    existingSecret: osmo-postgresql
  valkey:
    existingSecret: osmo-valkey
  objectStorage:
    existingSecret: osmo-object-storage
  masterEncryptionKey:
    existingSecret: osmo-master-encryption-key
