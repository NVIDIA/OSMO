planes:
  control:
    enabled: true
  compute:
    enabled: false

controlPlane:
  services:
    configFile:
      enabled: true
      secretName: osmo-control-secrets
      secretKey: mek.yaml
    postgres:
      enabled: false
      passwordSecretName: osmo-control-secrets
      passwordSecretKey: db-password
    redis:
      enabled: false
      passwordSecretName: osmo-control-secrets
      passwordSecretKey: redis-password
    localstackS3:
      enabled: false
    migration:
      enabled: false
    configs:
      enabled: true
      secretRefs:
        - secretName: osmo-control-secrets
      service:
        service_base_url: http://osmo-gateway
      workflow:
        # The public 6.3.1 service image predates workflow label policies.
        labels_config: null
    defaultAdmin:
      enabled: false
    ui:
      enabled: true

  podMonitor:
    enabled: false

  gateway:
    envoy:
      enabled: true
    oauth2Proxy:
      enabled: false
    authz:
      enabled: false
    rateLimit:
      enabled: false
