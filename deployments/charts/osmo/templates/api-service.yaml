{{- if .Values.services.api.enabled }}
{{- $name := include "osmo.api.fullname" . }}
{{- $protectedPodAnnotations := dict }}
{{- if .Values.secrets.serviceAccountTokens.enabled }}
{{- $_ := set $protectedPodAnnotations "osmo.nvidia.com/service-account-token-rollout" .Values.secrets.serviceAccountTokens.rolloutNonce }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.services.api.autoscaling.enabled }}
  replicas: {{ .Values.services.api.replicas }}
  {{- end }}
  {{- with .Values.services.api.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "osmo.component.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osmo.pod.labels" (dict "root" . "component" .Values.services.api "componentName" "api") | nindent 8 }}
      annotations:
        {{- include "osmo.pod.annotations" (dict "root" . "component" .Values.services.api "protectedAnnotations" $protectedPodAnnotations) | nindent 8 }}
        {{- include "osmo.gateway.tlsRolloutAnnotations" . | nindent 8 }}
        {{- include "osmo.secrets.rolloutAnnotations" . | nindent 8 }}
        {{- if .Values.services.api.tokenOidcProvider.enabled }}
        osmo.nvidia.com/oauth-client-secret-rollout: {{ .Values.secrets.oauthClientSecret.rolloutNonce | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.services.api.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- include "osmo.pod.securityContext" (dict "root" . "component" .Values.services.api) | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "osmo.pod.terminationGracePeriodSeconds" (dict "root" . "component" .Values.services.api) }}
      {{- with (include "osmo.pod.affinity" (dict "root" . "component" .Values.services.api)) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.api.pod.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.topologySpreadConstraints" (dict "root" . "component" .Values.services.api "componentName" "api")) }}
      topologySpreadConstraints:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.nodeSelector" (dict "root" . "component" .Values.services.api)) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "osmo.pod.tolerations" (dict "root" . "component" .Values.services.api) | nindent 8 }}
      {{- include "osmo.component.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "osmo.component.serviceAccountName" (dict "component" .Values.services.api "root" . "suffix" "api") }}
      {{- with .Values.services.api.pod.initContainers }}
      initContainers:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ $name }}
        image: {{ include "osmo.component.image" (dict "root" . "component" .Values.services.api) }}
        command:
        - service
        args:
        - --metrics_otel_collector_component
        - {{ $name }}
        - --metrics_otel_enable
        - "true"
        - --redis_host
        - {{ include "osmo.valkey.host" . }}
        - --redis_port
        - {{ include "osmo.valkey.port" . | quote }}
        - --redis_db_number
        - {{ include "osmo.valkey.database" . | quote }}
        {{- if eq (include "osmo.valkey.tlsEnabled" .) "true" }}
        - --redis_tls_enable
        - "true"
        {{- end}}
        - --postgres_host
        - {{ include "osmo.postgresql.host" . }}
        - --postgres_port
        - {{ include "osmo.postgresql.port" . | quote }}
        - --postgres_database_name
        - {{ include "osmo.postgresql.database" . }}
        {{- if .Values.secrets.masterEncryptionKey.existingSecret.name }}
        - --mek_file
        - {{ include "osmo.secrets.mekFile" . | quote }}
        {{- end }}
        {{- with (include "osmo.postgresql.username" .) }}
        - --postgres_user
        - {{ . }}
        {{- end }}
        {{- if .Values.services.api.auth.enabled }}
        - --device_endpoint
        - {{ .Values.services.api.auth.deviceEndpoint }}
        - --device_client_id
        - {{ .Values.services.api.auth.deviceClientId }}
        - --browser_endpoint
        - {{ .Values.services.api.auth.browserEndpoint }}
        - --browser_client_id
        - {{ .Values.services.api.auth.browserClientId }}
        - --token_endpoint
        - {{ .Values.services.api.auth.tokenEndpoint }}
        - --logout_endpoint
        - {{ .Values.services.api.auth.logoutEndpoint }}
        {{- end }}
        {{- if .Values.services.api.tokenOidcProvider.enabled }}
        - --token_oidc_provider_enabled
        - "true"
        - --token_oidc_issuer
        - {{ printf "%s/api/auth/oidc" (trimSuffix "/" .Values.externalUrl) | quote }}
        - --token_oidc_client_id
        - {{ .Values.services.api.tokenOidcProvider.clientId | quote }}
        - --token_oidc_client_secret_file
        - /etc/osmo/oauth/client-secret
        - --token_oidc_redirect_uri
        - {{ printf "%s/oauth2/callback" (trimSuffix "/" .Values.externalUrl) | quote }}
        - --token_oidc_login_page_url
        - {{ .Values.services.api.tokenOidcProvider.loginPagePath | quote }}
        - --token_oidc_cookie_secure
        - {{ .Values.gateway.oauth2Proxy.cookieSecure | quote }}
        {{- end }}
        {{- $serviceHostname := .Values.services.api.hostname | default (include "osmo.hostname" .) }}
        {{- if $serviceHostname }}
        - --service_hostname
        - {{ $serviceHostname }}
        {{- end }}
        {{- if .Values.services.api.clientInstallUrl }}
        - --client_install_url
        - {{ .Values.services.api.clientInstallUrl }}
        {{- end }}
        - --osmo_image_location
        - {{ include "osmo.component.imageRepository" . }}
        - --osmo_image_tag
        - {{ include "osmo.component.imageTag" . | quote }}
        {{- if .Values.logging.enabled }}
        - --log_level
        - {{ .Values.logging.logLevel }}
        - --k8s_log_level
        - {{ .Values.logging.k8sLogLevel }}
        - --log_format
        - {{ .Values.logging.logFormat | default "text" }}
        {{- end }}
        {{- if .Values.secrets.serviceAccountTokens.enabled }}
        - --service_account_token_directory
        - /etc/osmo/service-account-tokens
        {{- end }}
        {{- include "osmo.configuration.args" . | nindent 8 }}
        {{- include "osmo.secrets.serviceAuthArgs" . | nindent 8 }}
        {{- range $arg := .Values.services.api.extraArgs }}
        - {{ $arg | quote }}
        {{- end }}
        {{- include "osmo.gateway.upstreamTlsArgs" (dict "context" . "secretName" (include "osmo.gateway.tlsLeafSecretName" (dict "root" . "component" "api"))) | nindent 8 }}
        env:
        - name: OSMO_DISABLE_TASK_METRICS
          value: {{ .Values.services.api.disableTaskMetrics | quote }}
        {{- include "osmo.configuration.extraEnv" . | nindent 8 }}
        {{- include "osmo.component.extraEnv" .Values.services.api | nindent 8 }}
        {{- include "osmo.externalDependencies.connectionSecretEnv" . | nindent 8 }}
        imagePullPolicy: {{ include "osmo.component.imagePullPolicy" (dict "root" . "component" .Values.services.api) }}
        securityContext:
          {{- include "osmo.container.securityContext" (dict "root" . "component" .Values.services.api) | nindent 10 }}
        ports:
        - name: metrics
          containerPort: 9464
        volumeMounts:
        - name: osmo-runtime-tmp
          mountPath: /tmp
        {{- if .Values.secrets.masterEncryptionKey.existingSecret.name }}
        - mountPath: {{ include "osmo.secrets.mekMountPath" . | quote }}
          name: mek-volume
          readOnly: true
        {{- end }}
        {{- include "osmo.secrets.serviceAuthVolumeMount" . | nindent 8 }}
        {{- if .Values.services.api.tokenOidcProvider.enabled }}
        - name: oauth-client-secret
          mountPath: /etc/osmo/oauth/client-secret
          subPath: client-secret
          readOnly: true
        {{- end }}
        {{- if .Values.secrets.serviceAccountTokens.enabled }}
        {{- range .Values.secrets.serviceAccountTokens.credentials }}
        - name: service-account-token-{{ .name }}
          mountPath: /etc/osmo/service-account-tokens/{{ .name }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- include "osmo.configuration.volumeMounts" . | nindent 8 }}
        {{- include "osmo.externalDependencies.caVolumeMounts" . | nindent 8 }}
        {{- include "osmo.component.extraVolumeMounts" .Values.services.api | nindent 8 }}
        {{- include "osmo.gateway.upstreamTlsVolumeMount" (dict "context" . "secretName" (include "osmo.gateway.tlsLeafSecretName" (dict "root" . "component" "api"))) | nindent 8 }}
        resources:
        {{- toYaml .Values.services.api.resources | nindent 10 }}

        {{- with (include "osmo.gateway.upstreamProbeYaml" (dict "probe" .Values.services.api.livenessProbe "context" .)) }}
        livenessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with (include "osmo.gateway.upstreamProbeYaml" (dict "probe" .Values.services.api.startupProbe "context" .)) }}
        startupProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with (include "osmo.gateway.upstreamProbeYaml" (dict "probe" .Values.services.api.readinessProbe "context" .)) }}
        readinessProbe:
          {{- . | nindent 10 }}
        {{- end }}

      {{- include "osmo.pod.extraContainers" .Values.services.api | nindent 6 }}
      volumes:
        - name: osmo-runtime-tmp
          emptyDir: {}
        {{- include "osmo.pod.extraVolumes" .Values.services.api | nindent 8 }}
        {{- include "osmo.gateway.upstreamTlsVolume" (dict "context" . "secretName" (include "osmo.gateway.tlsLeafSecretName" (dict "root" . "component" "api"))) | nindent 8 }}
        {{- include "osmo.secrets.mekVolume" . | nindent 8 }}
        {{- include "osmo.secrets.serviceAuthVolume" . | nindent 8 }}
        {{- if .Values.services.api.tokenOidcProvider.enabled }}
        - name: oauth-client-secret
          secret:
            secretName: {{ .Values.secrets.oauthClientSecret.existingSecret | quote }}
            items:
            - key: {{ .Values.secrets.oauthClientSecret.keys.value | quote }}
              path: client-secret
        {{- end }}
        {{- include "osmo.configuration.volumes" . | nindent 8 }}
        {{- include "osmo.externalDependencies.caVolumes" . | nindent 8 }}
        {{- if .Values.secrets.serviceAccountTokens.enabled }}
        {{- range .Values.secrets.serviceAccountTokens.credentials }}
        - name: service-account-token-{{ .name }}
          secret:
            secretName: {{ include "osmo.serviceAccountTokenSecretName" . }}
        {{- end }}
        {{- end }}
---

apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo.service.labels" (dict "root" . "component" "api" "service" .Values.services.api.service) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" .Values.services.api.service.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "osmo.component.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}

---

{{- if .Values.services.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.services.api.autoscaling.minReplicas }}
  maxReplicas: {{ ternary .Values.services.api.autoscaling.minReplicas .Values.services.api.autoscaling.maxReplicas .Values.gateway.tls.generated.caRotation.freezeHpas }}
  {{- with .Values.services.api.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  metrics:
  {{- if .Values.services.api.autoscaling.hpaMemoryTarget }}
  - type: ContainerResource
    containerResource:
      name: memory
      container: {{ $name }}
      target:
        type: Utilization
        averageUtilization: {{ .Values.services.api.autoscaling.hpaMemoryTarget }}
  {{- end }}
  {{- if .Values.services.api.autoscaling.hpaCpuTarget }}
  - type: ContainerResource
    containerResource:
      name: cpu
      container: {{ $name }}
      target:
        type: Utilization
        averageUtilization: {{ .Values.services.api.autoscaling.hpaCpuTarget }}
  {{- end }}
  {{- with .Values.services.api.autoscaling.customMetrics }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
