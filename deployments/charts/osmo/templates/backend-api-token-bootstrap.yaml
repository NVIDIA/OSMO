{{- if .Values.secrets.backendApiTokens.enabled }}
{{- $managedCredentials := list }}
{{- range .Values.secrets.backendApiTokens.credentials }}
{{- if hasKey . "managedSecret" }}
{{- $managedCredentials = append $managedCredentials . }}
{{- end }}
{{- end }}
{{- if $managedCredentials }}
{{- $bootstrapName := include "osmo.component.fullname" (dict "root" . "suffix" "backend-token-bootstrap") }}
{{- $stateConfigMapName := include "osmo.component.fullname" (dict "root" . "suffix" "backend-token-bootstrap-state") }}
{{- $apiDeploymentName := include "osmo.api.fullname" . }}
{{- $hookResourceAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-20"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "backend-token-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $hookResourceAnnotations) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "backend-token-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $hookResourceAnnotations) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  {{- range $managedCredentials }}
  - {{ include "osmo.backendApiTokenSecretName" . | quote }}
  {{- end }}
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ $stateConfigMapName | quote }}]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: [{{ $apiDeploymentName | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "backend-token-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $hookResourceAnnotations) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $bootstrapName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "backend-token-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" (dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")) | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "osmo.component.selectorLabels" (dict "root" . "component" "backend-token-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $bootstrapName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- include "osmo.component.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podDefaults.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.podDefaults.tolerations | nindent 8 }}
      containers:
      - name: backend-token-bootstrap
        image: {{ include "osmo.image" (dict "root" . "image" .Values.secrets.backendApiTokens.bootstrap.image "useSharedRegistry" false "useSharedTag" false) | quote }}
        imagePullPolicy: {{ .Values.secrets.backendApiTokens.bootstrap.image.pullPolicy }}
        command:
        - /bin/ash
        args:
        - -c
        - |
{{ .Files.Get "files/backend-token-bootstrap.sh" | nindent 10 }}
        - backend-token-bootstrap
        - --namespace
        - {{ .Release.Namespace | quote }}
        - --release-name
        - {{ .Release.Name | quote }}
        - --state-config-map
        - {{ $stateConfigMapName | quote }}
        - --api-deployment-name
        - {{ $apiDeploymentName | quote }}
        {{- if .Release.IsUpgrade }}
        - --is-upgrade
        {{- end }}
        {{- range $managedCredentials }}
        - --secret-name
        - {{ include "osmo.backendApiTokenSecretName" . | quote }}
        {{- end }}
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - name: bootstrap-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: bootstrap-tmp
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $stateConfigMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "backend-token-bootstrap") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  managed-secrets: |-
    {{- range $managedCredentials }}
    {{ include "osmo.backendApiTokenSecretName" . }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
