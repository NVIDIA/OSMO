{{- $component := .Values.services.backendListener }}
{{- $componentName := "backend-listener" }}
{{- $name := include "osmo.compute.listenerName" . }}
{{- $clusterRoleName := include "osmo.compute.listenerClusterRoleName" . }}
{{- $clusterRoleBindingName := include "osmo.compute.clusterResourceName" (dict "root" . "suffix" "backend-listener-binding") }}
{{- if $component.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osmo.compute.listenerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" $component.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $component.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.compute.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-events
  namespace: {{ include "osmo.compute.backendNamespace" . }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list", "watch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-events
  namespace: {{ include "osmo.compute.backendNamespace" . }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.listenerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
roleRef:
  kind: Role
  name: {{ $name }}-events
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.compute.rbac.clusterRoles.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["list", "watch", "get"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
{{- if $component.enableNodeLabelUpdate }}
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["patch"]
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleBindingName }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.listenerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ $clusterRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
