{{- $component := .Values.services.backendListener }}
{{- $componentName := "backend-listener" }}
{{- $name := include "osmo.compute.listenerName" . }}
{{- $podLabels := include "osmo.pod.labels" (dict "root" . "component" $component "componentName" $componentName) | fromYaml }}
{{- $_ := set $podLabels "app" $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        {{- toYaml $podLabels | nindent 8 }}
      {{- with (include "osmo.pod.annotations" (dict "root" . "component" $component)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "osmo.compute.listenerServiceAccountName" . }}
      {{- include "osmo.component.imagePullSecrets" . | nindent 6 }}
      {{- with (include "osmo.pod.securityContext" (dict "root" . "component" $component)) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.nodeSelector" (dict "root" . "component" $component)) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.tolerations" (dict "root" . "component" $component)) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.affinity" (dict "root" . "component" $component)) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with $component.pod.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.pod.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ include "osmo.pod.terminationGracePeriodSeconds" (dict "root" . "component" $component) }}
      containers:
      - name: backend-listener
        image: {{ include "osmo.component.image" (dict "root" . "component" $component) }}
        imagePullPolicy: {{ include "osmo.component.imagePullPolicy" (dict "component" $component) }}
        {{- with (include "osmo.container.securityContext" (dict "root" . "component" $component)) }}
        securityContext:
          {{- . | nindent 10 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 9464
        command:
        - backend_listener
        args:
        - --host
        - {{ include "osmo.compute.serviceUrl" . | quote }}
        - --token_file
        - /opt/osmo/secrets/token.txt
        - --login_method
        - token
        - --backend
        - {{ .Values.compute.backendName | quote }}
        - --namespace
        - {{ include "osmo.compute.backendNamespace" . | quote }}
        - --log_level
        - {{ .Values.logging.logLevel | quote }}
        - --k8s_log_level
        - {{ .Values.logging.k8sLogLevel | quote }}
        - --log_format
        - {{ .Values.logging.logFormat | quote }}
        - --metrics_otel_collector_component
        - {{ $name | quote }}
        - --metrics_otel_enable
        - "true"
        - --enable_node_label_update
        - {{ $component.enableNodeLabelUpdate | quote }}
        - --node_condition_prefix
        - {{ .Values.compute.nodeConditionPrefix | quote }}
        - --max_unacked_messages
        - {{ $component.maxUnackedMessages | quote }}
        - --pod_event_cache_ttl
        - {{ $component.podCacheTtlSeconds | quote }}
        - --include_namespace_usage
        - {{ .Values.compute.includeNamespaceUsage | quote }}
        - --api_qps
        - {{ $component.apiQps | quote }}
        - --api_burst
        - {{ $component.apiBurst | quote }}
        {{- range $component.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        {{- with $component.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml $component.resources | nindent 10 }}
        volumeMounts:
        - name: osmo-secret
          mountPath: /opt/osmo/secrets
          readOnly: true
        - name: progress-files
          mountPath: /var/run/osmo
        {{- with $component.extraVolumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          {{- toYaml $component.livenessProbe | nindent 10 }}
        startupProbe:
          {{- toYaml $component.startupProbe | nindent 10 }}
      {{- with $component.pod.sidecars }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      volumes:
      - name: osmo-secret
        secret:
          secretName: {{ .Values.compute.accountTokenSecret }}
          items:
          - key: {{ .Values.compute.accountTokenSecretKey }}
            path: token.txt
      - name: progress-files
        emptyDir: {}
      {{- with $component.pod.extraVolumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
