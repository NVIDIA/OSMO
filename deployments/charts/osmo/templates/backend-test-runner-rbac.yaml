{{- $component := .Values.services.backendTestRunner }}
{{- $componentName := "backend-test-runner" }}
{{- $name := include "osmo.component.fullname" (dict "root" . "suffix" "backend-test-runner") }}
{{- $clusterRoleName := include "osmo.compute.testRunnerClusterRoleName" . }}
{{- $clusterRoleBindingName := include "osmo.compute.clusterResourceName" (dict "root" . "suffix" "backend-test-runner-binding") }}
{{- if $component.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osmo.compute.testRunnerServiceAccountName" . }}
  namespace: {{ .Values.compute.backendTestNamespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" $component.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $component.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.compute.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.compute.backendTestNamespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "delete", "create", "get", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Values.compute.backendTestNamespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.testRunnerServiceAccountName" . }}
  namespace: {{ .Values.compute.backendTestNamespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.compute.rbac.clusterRoles.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["patch", "get", "list"]
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch", "update"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleBindingName }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" $componentName) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.testRunnerServiceAccountName" . }}
  namespace: {{ .Values.compute.backendTestNamespace }}
roleRef:
  kind: ClusterRole
  name: {{ $clusterRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.compute.rbac.create }}
{{- range $component.extraRoles }}
---
{{ toYaml . }}
{{- end }}
{{- end }}
{{- end }}
