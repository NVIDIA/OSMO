{{- $component := .Values.services.backendWorker }}
{{- $name := include "osmo.compute.workerName" . }}
{{- if $component.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osmo.compute.workerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "backend-worker") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" $component.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $component.serviceAccount.automountServiceAccountToken }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "osmo.compute.backendNamespace" . }}
rules:
- apiGroups: [""]
  resources: ["secrets", "pods", "services"]
  verbs: ["list", "delete", "create", "patch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["scheduling.run.ai"]
  resources: ["podgroups"]
  verbs: ["list", "delete", "create"]
{{- with $component.extraRBACRules }}
{{ toYaml . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "osmo.compute.backendNamespace" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.workerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- if and .Values.services.backendTestRunner.enabled .Values.compute.backendTestNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-backend-tests
  namespace: {{ .Values.compute.backendTestNamespace }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["list", "delete", "create", "patch"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["list", "delete", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-backend-tests
  namespace: {{ .Values.compute.backendTestNamespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.workerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
roleRef:
  kind: Role
  name: {{ $name }}-backend-tests
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.compute.enableClusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
- apiGroups: ["scheduling.run.ai"]
  resources: ["queues"]
  verbs: ["list", "delete", "create", "update", "get"]
- apiGroups: ["kai.scheduler"]
  resources: ["topologies"]
  verbs: ["list", "delete", "create", "update", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ include "osmo.compute.workerServiceAccountName" . }}
  namespace: {{ include "osmo.compute.agentNamespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
