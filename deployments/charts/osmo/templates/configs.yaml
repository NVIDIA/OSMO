{{- if .Values.configuration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "osmo.api.fullname" . }}-config
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "configuration") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" .Values.configuration.extraAnnotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- $cfg := .Values.configuration }}
    {{- if ne .Values.configuration.snapshot nil }}
    {{- $cfg = .Values.configuration.snapshot }}
    {{- end }}
    service:
      {{- $service := deepCopy ($cfg.service | default dict) }}
      {{- if .Values.externalUrl }}
      {{- $_ := set $service "service_base_url" .Values.externalUrl }}
      {{- end }}
      {{- toYaml $service | nindent 6 }}
    {{- if $cfg.workflow }}
    workflow:
      {{- $workflow := deepCopy $cfg.workflow }}
      {{- $backendImages := index $workflow "backend_images" | default dict }}
      {{- if not (kindIs "map" $backendImages) }}
      {{- $backendImages = dict }}
      {{- end }}
      {{- $runtimeRepository := include "osmo.component.imageRepository" . }}
      {{- $runtimeTag := include "osmo.component.imageTag" . }}
      {{- if not (index $backendImages "init") }}
      {{- $_ := set $backendImages "init" (printf "%s/init-container:%s" $runtimeRepository $runtimeTag) }}
      {{- end }}
      {{- if not (index $backendImages "client") }}
      {{- $_ := set $backendImages "client" (printf "%s/client:%s" $runtimeRepository $runtimeTag) }}
      {{- end }}
      {{- $_ := set $workflow "backend_images" $backendImages }}
      {{- if eq .Values.configuration.snapshot nil }}
      {{- $overrideUrl := include "osmo.objectStorage.overrideUrl" . }}
      {{- $region := include "osmo.objectStorage.region" . }}
      {{- $workflowData := deepCopy (default (dict) $workflow.workflow_data) }}
      {{- $workflowDataLocation := include "osmo.objectStorage.location" (dict "root" . "name" "workflows") }}
      {{- $workflowDataCredential := dict }}
      {{- if $workflowDataLocation }}{{- $_ := set $workflowDataCredential "endpoint" $workflowDataLocation }}{{- end }}
      {{- $workflowDataSecret := include "osmo.objectStorage.credentialSecretRef" (dict "root" . "name" "workflows") | fromYaml }}
      {{- if $workflowDataSecret.name }}
      {{- $_ := set $workflowDataCredential "secretName" $workflowDataSecret.name }}
      {{- if $workflowDataSecret.key }}{{- $_ := set $workflowDataCredential "secretKey" $workflowDataSecret.key }}{{- end }}
      {{- end }}
      {{- if $overrideUrl }}{{- $_ := set $workflowDataCredential "override_url" $overrideUrl }}{{- end }}
      {{- if $region }}{{- $_ := set $workflowDataCredential "region" $region }}{{- end }}
      {{- $_ := set $workflowData "credential" $workflowDataCredential }}
      {{- $_ := set $workflow "workflow_data" $workflowData }}
      {{- $workflowLog := deepCopy (default (dict) $workflow.workflow_log) }}
      {{- $workflowLogLocation := include "osmo.objectStorage.location" (dict "root" . "name" "logs") }}
      {{- $workflowLogCredential := dict }}
      {{- if $workflowLogLocation }}{{- $_ := set $workflowLogCredential "endpoint" $workflowLogLocation }}{{- end }}
      {{- $workflowLogSecret := include "osmo.objectStorage.credentialSecretRef" (dict "root" . "name" "logs") | fromYaml }}
      {{- if $workflowLogSecret.name }}
      {{- $_ := set $workflowLogCredential "secretName" $workflowLogSecret.name }}
      {{- if $workflowLogSecret.key }}{{- $_ := set $workflowLogCredential "secretKey" $workflowLogSecret.key }}{{- end }}
      {{- end }}
      {{- if $overrideUrl }}{{- $_ := set $workflowLogCredential "override_url" $overrideUrl }}{{- end }}
      {{- if $region }}{{- $_ := set $workflowLogCredential "region" $region }}{{- end }}
      {{- $_ := set $workflowLog "credential" $workflowLogCredential }}
      {{- $_ := set $workflow "workflow_log" $workflowLog }}
      {{- $workflowApp := deepCopy (default (dict) $workflow.workflow_app) }}
      {{- $workflowAppLocation := include "osmo.objectStorage.location" (dict "root" . "name" "apps") }}
      {{- $workflowAppCredential := dict }}
      {{- if $workflowAppLocation }}{{- $_ := set $workflowAppCredential "endpoint" $workflowAppLocation }}{{- end }}
      {{- $workflowAppSecret := include "osmo.objectStorage.credentialSecretRef" (dict "root" . "name" "apps") | fromYaml }}
      {{- if $workflowAppSecret.name }}
      {{- $_ := set $workflowAppCredential "secretName" $workflowAppSecret.name }}
      {{- if $workflowAppSecret.key }}{{- $_ := set $workflowAppCredential "secretKey" $workflowAppSecret.key }}{{- end }}
      {{- end }}
      {{- if $overrideUrl }}{{- $_ := set $workflowAppCredential "override_url" $overrideUrl }}{{- end }}
      {{- if $region }}{{- $_ := set $workflowAppCredential "region" $region }}{{- end }}
      {{- $_ := set $workflowApp "credential" $workflowAppCredential }}
      {{- $_ := set $workflow "workflow_app" $workflowApp }}
      {{- end }}
      {{- toYaml $workflow | nindent 6 }}
    {{- else }}
    workflow: {}
    {{- end }}
    pools:
      {{- toYaml ($cfg.pools | default dict) | nindent 6 }}
    pod_templates:
      {{- toYaml ($cfg.podTemplates | default dict) | nindent 6 }}
    resource_validations:
      {{- toYaml ($cfg.resourceValidations | default dict) | nindent 6 }}
    {{- if $cfg.backends }}
    backends:
      {{- $backends := deepCopy $cfg.backends }}
      {{- range $name, $backend := $backends }}
      {{- if and (kindIs "map" $backend) (not (index $backend "k8s_namespace")) }}
      {{- $_ := set $backend "k8s_namespace" $.Release.Namespace }}
      {{- end }}
      {{- end }}
      {{- toYaml $backends | nindent 6 }}
    {{- else }}
    backends: {}
    {{- end }}
    backend_tests:
      {{- toYaml ($cfg.backendTests | default dict) | nindent 6 }}
    group_templates:
      {{- toYaml ($cfg.groupTemplates | default dict) | nindent 6 }}
    roles:
      {{- toYaml ($cfg.roles | default dict) | nindent 6 }}
{{- end }}
{{- end }}
