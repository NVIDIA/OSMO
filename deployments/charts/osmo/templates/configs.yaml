{{- if .Values.configuration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "osmo.api.fullname" . }}-config
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "configuration") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" .Values.configuration.extraAnnotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- $cfg := .Values.configuration }}
    {{- if or $cfg.service .Values.externalUrl }}
    service:
      {{- $service := deepCopy ($cfg.service | default dict) }}
      {{- if .Values.externalUrl }}
      {{- $_ := set $service "service_base_url" .Values.externalUrl }}
      {{- end }}
      {{- toYaml $service | nindent 6 }}
    {{- end }}
    {{- if $cfg.workflow }}
    workflow:
      {{- $workflow := deepCopy $cfg.workflow }}
      {{- $storage := .Values.externalDependencies.objectStorage }}
      {{- $secret := .Values.secrets.objectStorage }}
      {{- $_ := set $workflow "workflow_data" (dict "credential" (dict "secretName" $secret.existingSecret "secretKey" $secret.keys.credentials "endpoint" (printf "s3://%s/workflows" $storage.buckets.workflows) "override_url" $storage.endpoint "region" $storage.region)) }}
      {{- $_ := set $workflow "workflow_log" (dict "credential" (dict "secretName" $secret.existingSecret "secretKey" $secret.keys.credentials "endpoint" (printf "s3://%s/logs" $storage.buckets.logs) "override_url" $storage.endpoint "region" $storage.region)) }}
      {{- $_ := set $workflow "workflow_app" (dict "credential" (dict "secretName" $secret.existingSecret "secretKey" $secret.keys.credentials "endpoint" (printf "s3://%s/apps" $storage.buckets.apps) "override_url" $storage.endpoint "region" $storage.region)) }}
      {{- toYaml $workflow | nindent 6 }}
    {{- end }}
    {{- if $cfg.pools }}
    pools:
      {{- toYaml $cfg.pools | nindent 6 }}
    {{- end }}
    {{- if $cfg.podTemplates }}
    pod_templates:
      {{- toYaml $cfg.podTemplates | nindent 6 }}
    {{- end }}
    {{- if $cfg.resourceValidations }}
    resource_validations:
      {{- toYaml $cfg.resourceValidations | nindent 6 }}
    {{- end }}
    {{- if $cfg.backends }}
    backends:
      {{- $backends := deepCopy $cfg.backends }}
      {{- range $name, $backend := $backends }}
      {{- if and (kindIs "map" $backend) (not (index $backend "k8s_namespace")) }}
      {{- $_ := set $backend "k8s_namespace" $.Release.Namespace }}
      {{- end }}
      {{- end }}
      {{- toYaml $backends | nindent 6 }}
    {{- end }}
    {{- if $cfg.backendTests }}
    backend_tests:
      {{- toYaml $cfg.backendTests | nindent 6 }}
    {{- end }}
    {{- if $cfg.groupTemplates }}
    group_templates:
      {{- toYaml $cfg.groupTemplates | nindent 6 }}
    {{- end }}
    {{- if $cfg.roles }}
    roles:
      {{- toYaml $cfg.roles | nindent 6 }}
    {{- end }}
{{- end }}
