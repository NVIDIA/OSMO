{{- if and .Values.planes.control.enabled .Values.databaseMigration.enabled -}}
{{- $migration := .Values.databaseMigration -}}
{{- $component := "database-migration" -}}
{{- $jobName := include "osmo.component.fullname" (dict "root" . "suffix" "pgroll-migration") -}}
{{- $configMapName := include "osmo.component.fullname" (dict "root" . "suffix" "pgroll-migrations") -}}
{{- $configMapHookAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-26"
      "helm.sh/hook-delete-policy" "before-hook-creation"
      "argocd.argoproj.io/hook" "PreSync"
      "argocd.argoproj.io/sync-wave" "-26"
      "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation" -}}
{{- $jobHookAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-25"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded"
      "argocd.argoproj.io/hook" "PreSync"
      "argocd.argoproj.io/sync-wave" "-25"
      "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation,HookSucceeded" -}}
