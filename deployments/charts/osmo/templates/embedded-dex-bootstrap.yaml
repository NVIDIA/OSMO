{{- if and .Values.planes.control.enabled (eq .Values.authentication.provider "embeddedDex") }}
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
{{- $auth := .Values.authentication.embeddedDex }}
{{- $name := printf "%s-embedded-dex-bootstrap" (include "osmo.fullname" .) | trunc 58 | trimSuffix "-" }}
{{- $image := $auth.bootstrap.image | default (include "osmo.component.image" (dict "root" . "component" .Values.services.api)) }}
{{- $resourceHooks := dict "helm.sh/hook" "pre-install,pre-upgrade,post-install,post-upgrade" "helm.sh/hook-weight" "-20" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" }}
{{- $configRolloutIdentity := include "osmo.embeddedDex.config" . | sha256sum }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "embedded-dex-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $resourceHooks) | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "embedded-dex-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $resourceHooks) | nindent 4 }}
rules:
{{- if $auth.bootstrap.allowInitialGeneration }}
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
{{- end }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - {{ $auth.adminSecretName | quote }}
  - {{ $auth.oauthSecretName | quote }}
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "embedded-dex-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $resourceHooks) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- $phases := list
      (dict "name" "pre" "hooks" "pre-install,pre-upgrade" "includeConfigIdentity" false)
      (dict "name" "post" "hooks" "post-install,post-upgrade" "includeConfigIdentity" true) -}}
{{- range $phase := $phases }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $name $phase.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" $ "component" "embedded-dex-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" $ "protectedAnnotations" (dict "helm.sh/hook" $phase.hooks "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")) | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ $auth.bootstrap.activeDeadlineSeconds }}
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "osmo.component.selectorLabels" (dict "root" $ "component" "embedded-dex-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- include "osmo.component.imagePullSecrets" $ | nindent 6 }}
      containers:
      - name: embedded-dex-bootstrap
        image: {{ $image | quote }}
        imagePullPolicy: {{ $auth.bootstrap.imagePullPolicy }}
        command: ["embedded-dex-bootstrap"]
        args:
        - --namespace
        - {{ $.Release.Namespace | quote }}
        - --release-name
        - {{ $.Release.Name | quote }}
        - --admin-secret-name
        - {{ $auth.adminSecretName | quote }}
        - --oauth-secret-name
        - {{ $auth.oauthSecretName | quote }}
        {{- if $auth.bootstrap.allowInitialGeneration }}
        - --allow-initial-generation
        {{- else }}
        - --no-allow-initial-generation
        {{- end }}
        - --password-generation
        - {{ $auth.admin.passwordGeneration | quote }}
        - --client-generation
        - {{ $auth.browserClientSecretGeneration | quote }}
        - --cookie-generation
        - {{ $auth.cookieSecretGeneration | quote }}
        - --dex-pod-selector
        - {{ printf "app.kubernetes.io/name=dex,app.kubernetes.io/instance=%s" $.Release.Name | quote }}
        - --oauth-pod-selector
        - {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,app.kubernetes.io/component=gateway-oauth2-proxy" (include "osmo.name" $) $.Release.Name | quote }}
        - --restart-timeout-seconds
        - {{ max 1 (sub $auth.bootstrap.activeDeadlineSeconds 30) | quote }}
        {{- if $phase.includeConfigIdentity }}
        - --config-rollout-identity
        - {{ $configRolloutIdentity | quote }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
        resources:
          {{- toYaml $auth.bootstrap.resources | nindent 10 }}
{{- end }}
{{- end }}
