apiVersion: v1
kind: ServiceAccount
metadata:
  name: osmo-dex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "dex") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: osmo-dex-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "dex") | nindent 4 }}
  annotations:
    osmo.nvidia.com/config-rollout-identity: {{ include "osmo.embeddedDex.config" . | sha256sum | quote }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "osmo.embeddedDex.config" . | nindent 4 }}
{{- end }}
