{{- if eq .Values.secretManagement.mode "generated" }}
{{- $controlNamespace := .Values.namespaces.controlPlane }}
{{- $controlName := .Values.secretManagement.generated.controlSecretName }}
{{- $existingControl := lookup "v1" "Secret" $controlNamespace $controlName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $controlName }}
  namespace: {{ $controlNamespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: osmo
type: Opaque
{{- if $existingControl }}
data:
  {{- toYaml $existingControl.data | nindent 2 }}
{{- else }}
{{- $mekKey := randAlphaNum 43 }}
{{- $encodedJwk := printf "{\"k\":\"%s\",\"kid\":\"key1\",\"kty\":\"oct\"}" $mekKey | b64enc }}
stringData:
  db-password: {{ randAlphaNum 32 | quote }}
  redis-password: {{ randAlphaNum 32 | quote }}
  backend-token: {{ randAlphaNum 43 | quote }}
  mek.yaml: |
    currentMek: key1
    meks:
      key1: {{ $encodedJwk }}
{{- end }}
{{- if ne .Values.namespaces.computePlane $controlNamespace }}
{{- $computeNamespace := .Values.namespaces.computePlane }}
{{- $computeName := .Values.secretManagement.generated.computeSecretName }}
{{- $existingCompute := lookup "v1" "Secret" $computeNamespace $computeName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $computeName }}
  namespace: {{ $computeNamespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: osmo
type: Opaque
{{- if $existingCompute }}
data:
  {{- toYaml $existingCompute.data | nindent 2 }}
{{- else }}
stringData:
  backend-token: {{ randAlphaNum 43 | quote }}
{{- end }}
{{- end }}
{{- end }}
