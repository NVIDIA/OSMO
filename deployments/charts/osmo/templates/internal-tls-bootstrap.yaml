{{- include "osmo.gateway.tlsNormalize" . }}
{{- $tls := .Values.gateway.tls }}
{{- if and .Values.planes.control.enabled $tls.enabled $tls.generated.enabled (ne $tls.generated.caRotation.phase "stable") }}
{{- $bootstrapImage := $tls.generated.bootstrap.image | default (include "osmo.component.image" (dict "root" . "component" .Values.services.api)) }}
{{- $bootstrapName := printf "%s-internal-tls-bootstrap" (include "osmo.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $caSecret := include "osmo.gateway.tlsCaSecretName" . }}
{{- $trustSecret := include "osmo.gateway.tlsTrustSecretName" . }}
{{- $routerName := include "osmo.component.fullname" (dict "root" . "suffix" "router") }}
{{- $loggerName := include "osmo.component.fullname" (dict "root" . "suffix" "logger") }}
{{- $leaves := list
      (dict "component" "api" "dns" (.Values.gateway.upstreams.api.host | default (include "osmo.api.fullname" .)))
      (dict "component" "router" "dns" (.Values.gateway.upstreams.router.host | default (printf "%s-headless" $routerName)))
      (dict "component" "agent" "dns" (.Values.gateway.upstreams.agent.host | default (include "osmo.component.fullname" (dict "root" . "suffix" "agent"))))
      (dict "component" "logger" "dns" (.Values.gateway.upstreams.logger.host | default $loggerName)) -}}
{{- if .Values.services.mcp.enabled }}
{{- $leaves = append $leaves (dict "component" "mcp" "dns" (include "osmo.component.fullname" (dict "root" . "suffix" "mcp"))) -}}
{{- end }}
{{- $consumers := list -}}
{{- range $key, $suffix := dict "api" "api" "router" "router" "agent" "agent" "logger" "logger" "mcp" "mcp" -}}
{{- if (index $.Values.services $key).enabled -}}
{{- $consumer := include "osmo.component.fullname" (dict "root" $ "suffix" $suffix) -}}
{{- if eq $key "api" -}}{{- $consumer = include "osmo.api.fullname" $ -}}{{- end -}}
{{- $consumers = append $consumers $consumer -}}
{{- end -}}
{{- end -}}
{{- if .Values.gateway.envoy.enabled -}}{{- $consumers = append $consumers (printf "%s-envoy" (include "osmo.gateway.fullname" .)) -}}{{- end -}}
{{- $secretNames := list $caSecret $trustSecret -}}
{{- range $leaf := $leaves }}
{{- $secretName := include "osmo.gateway.tlsLeafSecretName" (dict "root" $ "component" $leaf.component) -}}
{{- $secretNames = append $secretNames $secretName -}}
{{- end }}
{{- $supportAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-30"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" -}}
{{- $jobAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-20"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "internal-tls-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $supportAnnotations) | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "internal-tls-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $supportAnnotations) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ include "osmo.bootstrap.tlsRecordName" . | quote }}]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  {{- range $secretName := $secretNames }}
  - {{ $secretName | quote }}
  {{- end }}
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames:
  {{- range $consumer := $consumers }}
  - {{ $consumer | quote }}
  {{- end }}
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "internal-tls-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $supportAnnotations) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $bootstrapName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "internal-tls-bootstrap") | nindent 4 }}
  annotations:
    {{- include "osmo.metadata.annotations" (dict "root" . "protectedAnnotations" $jobAnnotations) | nindent 4 }}
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "osmo.component.standardLabels" (dict "root" . "component" "internal-tls-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $bootstrapName }}
      {{- include "osmo.component.imagePullSecrets" . | nindent 6 }}
      nodeSelector:
        {{- toYaml .Values.podDefaults.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.podDefaults.tolerations | nindent 8 }}
      containers:
      - name: internal-tls-bootstrap
        image: {{ $bootstrapImage | quote }}
        imagePullPolicy: {{ $tls.generated.bootstrap.imagePullPolicy | quote }}
        command: ["internal-tls-bootstrap"]
        args:
        - --snapshot-record
        - {{ include "osmo.bootstrap.tlsRecordName" . | quote }}
        - --namespace
        - {{ .Release.Namespace | quote }}
        - --release-name
        - {{ .Release.Name | quote }}
        - --ca-secret
        - {{ $caSecret | quote }}
        - --trust-secret
        - {{ $trustSecret | quote }}
        - --leaf-rotation-nonce
        - {{ $tls.generated.leafRotationNonce | quote }}
        - --ca-rotation-id
        - {{ $tls.generated.caRotation.id | quote }}
        - --ca-rotation-phase
        - {{ $tls.generated.caRotation.phase | quote }}
        {{- range $leaf := $leaves }}
        - --leaf
        - {{ printf "%s=%s" (include "osmo.gateway.tlsLeafSecretName" (dict "root" $ "component" $leaf.component)) $leaf.dns | quote }}
        {{- end }}
        {{- range $consumer := $consumers }}
        - --consumer-deployment
        - {{ $consumer | quote }}
        {{- end }}
        {{- if $tls.generated.bootstrap.allowInitialGeneration }}
        - --allow-initial-generation
        {{- end }}
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: bootstrap-tmp
          mountPath: /tmp
      volumes:
      - name: bootstrap-tmp
        emptyDir: {}
{{- end }}
