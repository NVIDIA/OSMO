{{- if and .Values.planes.control.enabled .Values.services.mcp.enabled }}
{{- $mcp := .Values.services.mcp }}
{{- $name := include "osmo.component.fullname" (dict "root" . "suffix" "mcp") }}
{{- $mcpResourceUrl := include "osmo.mcp.resourceUrl" . }}
{{- $gatewayUrl := trimSuffix "/mcp" $mcpResourceUrl }}
{{- $requestTimeoutSeconds := toString $mcp.requestTimeoutSeconds }}
{{- $oidcProxy := $mcp.oidcProxy }}
{{- $oidcConfigUrl := required "services.mcp.oidcProxy.oidc.configUrl is required when MCP is enabled" $oidcProxy.oidc.configUrl }}
{{- $oidcClientId := required "services.mcp.oidcProxy.oidc.clientId is required when MCP is enabled" $oidcProxy.oidc.clientId }}
{{- $secretName := $oidcProxy.existingSecret.name }}
{{- $secretMountPath := trimSuffix "/" $oidcProxy.existingSecret.mountPath }}
{{- $oidcClientSecretFile := $oidcProxy.oidc.clientSecretFile }}
{{- $redisPasswordFile := "" }}
{{- $redisPasswordSecretName := "" }}
{{- $redisPasswordKey := "" }}
{{- $redisPasswordMountPath := "/etc/osmo/mcp-valkey" }}
{{- if $secretName }}
{{- $oidcClientSecretFile = printf "%s/%s" $secretMountPath (required "services.mcp.oidcProxy.existingSecret.clientSecretKey is required" $oidcProxy.existingSecret.clientSecretKey) }}
{{- if $oidcProxy.existingSecret.redisPasswordKey }}
{{- $redisPasswordFile = printf "%s/%s" $secretMountPath $oidcProxy.existingSecret.redisPasswordKey }}
{{- end }}
{{- end }}
{{- if not $oidcClientSecretFile }}
{{- fail "services.mcp.oidcProxy needs existingSecret.name, or oidc.clientSecretFile when the secret arrives another way" }}
{{- end }}
{{- if not $redisPasswordFile }}
{{- $redisPasswordSecretName = required "an effective Valkey Secret is required when MCP is enabled" (include "osmo.valkey.secretName" .) }}
{{- $redisPasswordKey = required "secrets.valkey.keys.password is required when MCP is enabled" .Values.secrets.valkey.keys.password }}
{{- $redisPasswordFile = printf "%s/%s" $redisPasswordMountPath $redisPasswordKey }}
{{- end }}
{{- /* Redis host, port and TLS come from the same valkey the rest of the chart
uses; only the logical database is chosen here, to isolate proxy state. */ -}}
{{- $redisHost := required "a valkey host is required when MCP is enabled" (include "osmo.valkey.host" .) }}
{{- $redisScheme := ternary "rediss" "redis" (eq (include "osmo.valkey.tlsEnabled" .) "true") }}
{{- $redisUrl := printf "%s://%s:%v/%v" $redisScheme $redisHost (include "osmo.valkey.port" .) $oidcProxy.redis.dbNumber }}
{{- $reservedEnvNames := list "OSMO_MCP_HOST" "OSMO_MCP_PORT" "OSMO_GATEWAY_URL" "OSMO_MCP_REQUEST_TIMEOUT_SECONDS" "OSMO_MCP_ALLOWED_ORIGINS" "OSMO_MCP_AUTH_RESOURCE_URL" "OSMO_MCP_AUTH_REDIS_URL" "OSMO_MCP_AUTH_REDIS_PASSWORD_FILE" "OSMO_MCP_AUTH_REDIS_KEY_PREFIX" "OSMO_MCP_AUTH_OIDC_CONFIG_URL" "OSMO_MCP_AUTH_OIDC_CLIENT_ID" "OSMO_MCP_AUTH_OIDC_CLIENT_SECRET_FILE" "OSMO_MCP_AUTH_OIDC_ACCESS_TOKEN_ISSUER" "OSMO_MCP_AUTH_OIDC_ACCESS_TOKEN_REQUIRED_SCOPE" "OSMO_MCP_AUTH_ACCESS_TOKEN_TTL_SECONDS" "OSMO_MCP_AUTH_REFRESH_TOKEN_TTL_SECONDS" "OSMO_MCP_AUTH_UPSTREAM_TIMEOUT_SECONDS" "OSMO_MCP_AUTH_REDIS_CONNECT_TIMEOUT_SECONDS" "OSMO_MCP_AUTH_REDIS_OPERATION_TIMEOUT_SECONDS" }}
{{- range $env := $mcp.extraEnv }}
{{- if has (toString (default "" $env.name)) $reservedEnvNames }}
{{- fail (printf "services.mcp.extraEnv must not override managed variable %s" $env.name) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "mcp") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $mcp.replicas }}
  {{- with $mcp.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "osmo.component.selectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osmo.pod.labels" (dict "root" . "component" $mcp "componentName" "mcp") | nindent 8 }}
      annotations:
        {{- $secretRolloutAnnotations := dict
              "osmo.nvidia.com/oauth-client-secret-rollout" .Values.secrets.oauthClientSecret.rolloutNonce
              "osmo.nvidia.com/valkey-secret-rollout" .Values.secrets.valkey.rolloutNonce -}}
        {{- include "osmo.pod.annotations" (dict "root" . "component" $mcp "protectedAnnotations" $secretRolloutAnnotations) | nindent 8 }}
        {{- include "osmo.gateway.tlsRolloutAnnotations" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ $mcp.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- include "osmo.pod.securityContext" (dict "root" . "component" $mcp) | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "osmo.pod.terminationGracePeriodSeconds" (dict "root" . "component" $mcp) }}
      {{- with (include "osmo.pod.affinity" (dict "root" . "component" $mcp)) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.topologySpreadConstraints" (dict "root" . "component" $mcp "componentName" "mcp")) }}
      topologySpreadConstraints:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "osmo.pod.nodeSelector" (dict "root" . "component" $mcp)) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "osmo.pod.tolerations" (dict "root" . "component" $mcp) | nindent 8 }}
      {{- include "osmo.component.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "osmo.component.serviceAccountName" (dict "component" $mcp "root" . "suffix" "mcp") }}
      containers:
      - name: {{ $name }}
        image: {{ include "osmo.component.image" (dict "root" . "component" $mcp) }}
        imagePullPolicy: {{ include "osmo.component.imagePullPolicy" (dict "root" . "component" $mcp) }}
        command:
        - mcp
        {{- if .Values.gateway.tls.enabled }}
        args:
        {{- include "osmo.gateway.upstreamTlsArgs" (dict "context" . "secretName" (include "osmo.gateway.tlsLeafSecretName" (dict "root" . "component" "mcp"))) | nindent 8 }}
        {{- end }}
        securityContext:
          {{- include "osmo.container.securityContext" (dict "root" . "component" $mcp) | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ $mcp.port }}
          protocol: TCP
        env:
        - name: OSMO_MCP_HOST
          value: "0.0.0.0"
        - name: OSMO_MCP_PORT
          value: {{ $mcp.port | quote }}
        - name: OSMO_GATEWAY_URL
          value: {{ $gatewayUrl | quote }}
        - name: OSMO_MCP_REQUEST_TIMEOUT_SECONDS
          value: {{ $requestTimeoutSeconds | quote }}
        {{- with $mcp.allowedOrigins }}
        - name: OSMO_MCP_ALLOWED_ORIGINS
          value: {{ join "," . | quote }}
        {{- end }}
        - name: OSMO_MCP_AUTH_RESOURCE_URL
          value: {{ $mcpResourceUrl | quote }}
        - name: OSMO_MCP_AUTH_REDIS_URL
          value: {{ $redisUrl | quote }}
        {{- if $redisPasswordFile }}
        - name: OSMO_MCP_AUTH_REDIS_PASSWORD_FILE
          value: {{ $redisPasswordFile | quote }}
        {{- end }}
        - name: OSMO_MCP_AUTH_REDIS_KEY_PREFIX
          value: {{ $oidcProxy.redis.keyPrefix | quote }}
        - name: OSMO_MCP_AUTH_OIDC_CONFIG_URL
          value: {{ $oidcConfigUrl | quote }}
        - name: OSMO_MCP_AUTH_OIDC_CLIENT_ID
          value: {{ $oidcClientId | quote }}
        - name: OSMO_MCP_AUTH_OIDC_CLIENT_SECRET_FILE
          value: {{ $oidcClientSecretFile | quote }}
        {{- with $oidcProxy.oidc.accessTokenIssuer }}
        - name: OSMO_MCP_AUTH_OIDC_ACCESS_TOKEN_ISSUER
          value: {{ . | quote }}
        {{- end }}
        - name: OSMO_MCP_AUTH_OIDC_ACCESS_TOKEN_REQUIRED_SCOPE
          value: {{ $oidcProxy.oidc.accessTokenRequiredScope | quote }}
        - name: OSMO_MCP_AUTH_ACCESS_TOKEN_TTL_SECONDS
          value: {{ $oidcProxy.accessTokenTtlSeconds | int | quote }}
        - name: OSMO_MCP_AUTH_REFRESH_TOKEN_TTL_SECONDS
          value: {{ $oidcProxy.refreshTokenTtlSeconds | int | quote }}
        - name: OSMO_MCP_AUTH_UPSTREAM_TIMEOUT_SECONDS
          value: {{ $oidcProxy.upstreamTimeoutSeconds | int | quote }}
        - name: OSMO_MCP_AUTH_REDIS_CONNECT_TIMEOUT_SECONDS
          value: {{ $oidcProxy.redis.connectTimeoutSeconds | int | quote }}
        - name: OSMO_MCP_AUTH_REDIS_OPERATION_TIMEOUT_SECONDS
          value: {{ $oidcProxy.redis.operationTimeoutSeconds | int | quote }}
        {{- with $mcp.extraEnv }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml $mcp.resources | nindent 10 }}
        {{- if or .Values.gateway.tls.enabled $secretName $redisPasswordSecretName }}
        volumeMounts:
        {{- if .Values.gateway.tls.enabled }}
        {{- include "osmo.gateway.upstreamTlsVolumeMount" (dict "context" . "secretName" (include "osmo.gateway.tlsLeafSecretName" (dict "root" . "component" "mcp"))) | nindent 8 }}
        {{- end }}
        {{- if $secretName }}
        - name: mcp-oidc-proxy
          mountPath: {{ $secretMountPath }}
          readOnly: true
        {{- end }}
        {{- if $redisPasswordSecretName }}
        - name: mcp-valkey
          mountPath: {{ $redisPasswordMountPath }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with (include "osmo.gateway.upstreamProbeYaml" (dict "probe" $mcp.livenessProbe "context" .)) }}
        livenessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with (include "osmo.gateway.upstreamProbeYaml" (dict "probe" $mcp.readinessProbe "context" .)) }}
        readinessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with (include "osmo.gateway.upstreamProbeYaml" (dict "probe" $mcp.startupProbe "context" .)) }}
        startupProbe:
          {{- . | nindent 10 }}
        {{- end }}
      {{- include "osmo.pod.extraContainers" $mcp | nindent 6 }}
      {{- if or .Values.gateway.tls.enabled $mcp.pod.extraVolumes $secretName $redisPasswordSecretName }}
      volumes:
      {{- include "osmo.gateway.upstreamTlsVolume" (dict "context" . "secretName" (include "osmo.gateway.tlsLeafSecretName" (dict "root" . "component" "mcp"))) | nindent 6 }}
      {{- if $secretName }}
      - name: mcp-oidc-proxy
        secret:
          secretName: {{ $secretName }}
          items:
          - key: {{ $oidcProxy.existingSecret.clientSecretKey }}
            path: {{ $oidcProxy.existingSecret.clientSecretKey }}
          {{- with $oidcProxy.existingSecret.redisPasswordKey }}
          - key: {{ . }}
            path: {{ . }}
          {{- end }}
      {{- end }}
      {{- if $redisPasswordSecretName }}
      - name: mcp-valkey
        secret:
          secretName: {{ $redisPasswordSecretName | quote }}
          items:
          - key: {{ $redisPasswordKey | quote }}
            path: {{ $redisPasswordKey | quote }}
      {{- end }}
      {{- include "osmo.pod.extraVolumes" $mcp | nindent 6 }}
      {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "osmo.service.labels" (dict "root" . "component" "mcp" "service" $mcp.service) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" . "annotations" $mcp.service.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ $mcp.port }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "osmo.component.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-allow-gateway-envoy
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "mcp") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "osmo.component.selectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "osmo.gateway.componentSelectorLabels" (dict "component" "envoy" "context" .) | nindent 10 }}
    ports:
    - port: {{ $mcp.port }}
      protocol: TCP
{{- end }}
{{- end }}
