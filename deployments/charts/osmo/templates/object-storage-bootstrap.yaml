{{- if .Values.embeddedDependencies.objectStorage.enabled }}
{{- $bootstrapName := printf "%s-object-storage-bootstrap" (include "osmo.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $jobIdentity := printf "%s/%s/%d/object-storage" .Release.Namespace .Release.Name .Release.Revision | sha256sum | trunc 10 }}
{{- $bootstrapJobName := printf "%s-object-storage-bootstrap-%s" ((include "osmo.fullname" .) | trunc 27 | trimSuffix "-") $jobIdentity }}
{{- $secretName := include "osmo.objectStorage.secretName" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "object-storage-bootstrap") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  object-storage-bootstrap.sh: |-
{{ .Files.Get "files/object-storage-bootstrap.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bootstrapJobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osmo.component.labels" (dict "root" . "component" "object-storage-bootstrap") | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.embeddedDependencies.objectStorage.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "osmo.component.selectorLabels" (dict "root" . "component" "object-storage-bootstrap") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "osmo.component.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podDefaults.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: object-storage-bootstrap
        image: {{ include "osmo.image" (dict "root" . "image" .Values.embeddedDependencies.objectStorage.bootstrap.image "useSharedRegistry" false "useSharedTag" false) | quote }}
        imagePullPolicy: {{ .Values.embeddedDependencies.objectStorage.bootstrap.image.pullPolicy }}
        command:
        - /bin/sh
        - /scripts/object-storage-bootstrap.sh
        env:
        - name: HOME
          value: /tmp
        - name: AWS_ENDPOINT_URL
          value: {{ include "osmo.objectStorage.endpoint" . | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: RUSTFS_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: RUSTFS_SECRET_KEY
        - name: AWS_DEFAULT_REGION
          value: {{ include "osmo.objectStorage.region" . | quote }}
        - name: OSMO_WORKFLOW_BUCKET
          value: {{ include "osmo.objectStorage.bucket" (dict "root" . "name" "workflows") | quote }}
        - name: OSMO_LOG_BUCKET
          value: {{ include "osmo.objectStorage.bucket" (dict "root" . "name" "logs") | quote }}
        - name: OSMO_APP_BUCKET
          value: {{ include "osmo.objectStorage.bucket" (dict "root" . "name" "apps") | quote }}
        - name: OSMO_STORAGE_BOOTSTRAP_ATTEMPTS
          value: {{ .Values.embeddedDependencies.objectStorage.bootstrap.attempts | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - name: bootstrap-script
          mountPath: /scripts
          readOnly: true
        - name: bootstrap-tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.embeddedDependencies.objectStorage.bootstrap.resources | nindent 10 }}
      volumes:
      - name: bootstrap-script
        configMap:
          name: {{ $bootstrapName }}
          defaultMode: 0555
      - name: bootstrap-tmp
        emptyDir: {}
{{- end }}
{{- end }}
