{{- if .Values.checks.enabled }}
{{- $name := include "osmo-install.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-postflight
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,test
    "helm.sh/hook-weight": "10"
    {{- include "osmo-install.hook-job-annotations" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 660
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postflight
        app.kubernetes.io/part-of: osmo
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}-check
      containers:
        - name: osmo-check
          image: {{ .Values.checks.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if eq .Values.secretManagement.mode "external-secrets" }}
              echo "Waiting for External Secrets"
              {{- range .Values.secretManagement.externalSecrets.items }}
              kubectl wait --for=condition=Ready externalsecret/{{ .name }} \
                --namespace {{ .namespace }} --timeout={{ $.Values.checks.timeout }}
              kubectl get secret {{ .targetSecretName }} --namespace {{ .namespace }}
              {{- end }}
              {{- end }}
              {{- if .Values.controlPlane.enabled }}
              echo "Waiting for the OSMO control plane"
              {{- range $deployment := list "osmo-service" "osmo-agent" "osmo-worker" "osmo-logger" "osmo-router" "osmo-delayed-job-monitor" }}
              kubectl wait --for=condition=Available deployment/{{ $deployment }} \
                --namespace {{ $.Values.namespaces.controlPlane }} \
                --timeout={{ $.Values.checks.timeout }}
              {{- end }}
              {{- if .Values.controlPlane.services.ui.enabled }}
              kubectl wait --for=condition=Available deployment/osmo-ui \
                --namespace {{ .Values.namespaces.controlPlane }} \
                --timeout={{ .Values.checks.timeout }}
              {{- end }}
              {{- if .Values.controlPlane.gateway.envoy.enabled }}
              kubectl wait --for=condition=Available deployment/osmo-gateway-envoy \
                --namespace {{ .Values.namespaces.controlPlane }} \
                --timeout={{ .Values.checks.timeout }}
              {{- end }}
              kubectl get service osmo-gateway \
                --namespace {{ .Values.namespaces.controlPlane }}
              {{- if .Values.controlPlane.services.configs.enabled }}
              echo "Checking workflow runtime service URL"
              if ! kubectl get configmap \
                  {{ .Values.controlPlane.services.service.serviceName }}-configs \
                  --namespace {{ .Values.namespaces.controlPlane }} \
                  -o jsonpath='{.data.config\.yaml}' | \
                  grep -Eq '^[[:space:]]+service_base_url: https?://'; then
                echo "OSMO workflow service_base_url is missing or invalid"
                exit 1
              fi
              {{- end }}
              {{- end }}
              {{- if .Values.computePlane.enabled }}
              echo "Waiting for the OSMO compute plane"
              kubectl wait --for=condition=Available \
                deployment/{{ .Release.Name }}-{{ .Values.computePlane.services.backendListener.serviceName }} \
                --namespace {{ .Values.namespaces.computePlane }} \
                --timeout={{ .Values.checks.timeout }}
              kubectl wait --for=condition=Available \
                deployment/{{ .Release.Name }}-{{ .Values.computePlane.services.backendWorker.serviceName }} \
                --namespace {{ .Values.namespaces.computePlane }} \
                --timeout={{ .Values.checks.timeout }}
              {{- end }}
              {{- if or .Values.checks.apiVersion (and .Values.checks.backendOnline .Values.computePlane.enabled) }}
              {{- if .Values.computePlane.enabled }}
              service_url={{ .Values.computePlane.global.serviceUrl | quote }}
              {{- else }}
              service_url={{ printf "http://osmo-gateway.%s.svc.cluster.local" .Values.namespaces.controlPlane | quote }}
              {{- end }}
              service_url="${service_url%/}"
              {{- end }}
              {{- if .Values.checks.apiVersion }}
              echo "Checking the OSMO API"
              api_version="$(wget -qO- "${service_url}/api/version" 2>/dev/null || true)"
              if ! printf '%s' "${api_version}" | grep -q '"major"'; then
                echo "OSMO API version check failed"
                exit 1
              fi
              {{- end }}
              {{- if and .Values.checks.backendOnline .Values.computePlane.enabled }}
              echo "Waiting for backend {{ .Values.computePlane.global.backendName }} to report online"
              backend_token_encoded="$(kubectl get secret \
                {{ .Values.computePlane.global.accountTokenSecret }} \
                --namespace {{ .Values.namespaces.computePlane }} \
                -o jsonpath='{.data.{{ .Values.computePlane.global.accountTokenSecretKey }}}')"
              backend_token="$(printf '%s' "${backend_token_encoded}" | base64 -d)"
              attempt=1
              while [ "${attempt}" -le {{ .Values.checks.backendAttempts }} ]; do
                jwt_response="$(wget -qO- \
                  --header='Content-Type: application/json' \
                  --post-data="$(printf '{"token":"%s"}' "${backend_token}")" \
                  "${service_url}/api/auth/jwt/access_token" 2>/dev/null || true)"
                jwt_token="$(printf '%s' "${jwt_response}" | \
                  sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
                backend_status=""
                if [ -n "${jwt_token}" ]; then
                  backend_status="$(wget -qO- \
                    --header="Authorization: Bearer ${jwt_token}" \
                    "${service_url}/api/configs/backend/{{ .Values.computePlane.global.backendName }}" \
                    2>/dev/null || true)"
                fi
                if printf '%s' "${backend_status}" | \
                    grep -q '"online"[[:space:]]*:[[:space:]]*true'; then
                  echo "Backend {{ .Values.computePlane.global.backendName }} is online"
                  break
                fi
                if [ "${attempt}" -eq {{ .Values.checks.backendAttempts }} ]; then
                  echo "Backend {{ .Values.computePlane.global.backendName }} did not report online"
                  exit 1
                fi
                attempt=$((attempt + 1))
                sleep {{ .Values.checks.backendRetryIntervalSeconds }}
              done
              unset backend_token backend_token_encoded jwt_response jwt_token
              {{- end }}
              echo "OSMO postflight checks passed"
{{- end }}
