{{- $root := . }}
{{- $components := list
  (dict "suffix" "api" "component" .Values.services.api)
  (dict "suffix" "ui" "component" .Values.services.ui)
  (dict "suffix" "router" "component" .Values.services.router)
  (dict "suffix" "worker" "component" .Values.services.worker)
  (dict "suffix" "logger" "component" .Values.services.logger)
  (dict "suffix" "agent" "component" .Values.services.agent)
  (dict "suffix" "delayed-job-monitor" "component" .Values.services.delayedJobMonitor)
  (dict "suffix" "mcp" "component" .Values.services.mcp)
  (dict "suffix" "gateway-envoy" "component" .Values.gateway.envoy)
  (dict "suffix" "gateway-oauth2-proxy" "component" .Values.gateway.oauth2Proxy)
  (dict "suffix" "gateway-authz" "component" .Values.gateway.authz)
  (dict "suffix" "gateway-ratelimit" "component" .Values.gateway.rateLimit)
-}}
{{- range $item := $components }}
{{- $component := $item.component }}
{{- if and $component.enabled $component.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osmo.component.serviceAccountName" (dict "component" $component "root" $root "suffix" $item.suffix) }}
  labels:
    {{- include "osmo.component.labels" (dict "root" $root "component" $item.suffix) | nindent 4 }}
  {{- with (include "osmo.metadata.annotations" (dict "root" $root "annotations" $component.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $component.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
