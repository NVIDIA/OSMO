{{- include "osmo.gateway.tlsNormalize" . }}
{{- if and (not .Values.planes.control.enabled) (not .Values.planes.compute.enabled) -}}
{{- fail "at least one of planes.control.enabled or planes.compute.enabled must be true" -}}
{{- end -}}
{{- if .Values.planes.compute.enabled -}}
{{- if and (not .Values.planes.control.enabled) (not .Values.compute.backendName) -}}
{{- fail "compute.backendName is required for compute-only installations; set it explicitly with --set-string compute.backendName=<backend-name>" -}}
{{- end -}}
{{- if not .Values.compute.authentication.existingSecret -}}
{{- fail "compute.authentication.existingSecret is required when planes.compute.enabled=true" -}}
{{- end -}}
{{- if and .Values.compute.workloadNamespace.create (not .Values.compute.workloadNamespace.name) -}}
{{- fail "compute.workloadNamespace.name is required when compute.workloadNamespace.create=true" -}}
{{- end -}}
{{- if and .Values.compute.workloadNamespace.create (eq .Values.compute.workloadNamespace.name .Release.Namespace) -}}
{{- fail "compute.workloadNamespace.create must be false when the workload namespace is the Helm release namespace; use --create-namespace for the release namespace" -}}
{{- end -}}
{{- if and (not .Values.planes.control.enabled) (not .Values.externalUrl) -}}
{{- fail "externalUrl is required when the compute plane connects to an external control plane" -}}
{{- end -}}
{{- if and .Values.services.backendTestRunner.enabled (not .Values.compute.backendTestNamespace) -}}
{{- fail "compute.backendTestNamespace is required when services.backendTestRunner.enabled=true" -}}
{{- end -}}
{{- if and
  (not .Values.compute.rbac.clusterRoles.create)
  .Values.services.backendListener.enabled
  (not .Values.compute.rbac.clusterRoles.listenerName) -}}
{{- fail "compute.rbac.clusterRoles.listenerName is required when cluster role creation is disabled" -}}
{{- end -}}
{{- if and
  (not .Values.compute.rbac.clusterRoles.create)
  .Values.services.backendWorker.enabled
  (not .Values.compute.rbac.clusterRoles.workerName) -}}
{{- fail "compute.rbac.clusterRoles.workerName is required when cluster role creation is disabled" -}}
{{- end -}}
{{- if and
  (not .Values.compute.rbac.clusterRoles.create)
  .Values.services.backendTestRunner.enabled
  (not .Values.compute.rbac.clusterRoles.testRunnerName) -}}
{{- fail "compute.rbac.clusterRoles.testRunnerName is required when cluster role creation is disabled and services.backendTestRunner.enabled=true" -}}
{{- end -}}
{{- if and
  .Values.compute.workflowNetworkPolicy.enabled
  (not .Values.compute.workflowNetworkPolicy.clusterCIDRs)
  (not .Values.compute.workflowNetworkPolicy.allowAllClusterEgress) -}}
{{- fail "compute.workflowNetworkPolicy.clusterCIDRs must not be empty when the workflow network policy is enabled unless allowAllClusterEgress=true" -}}
{{- end -}}
{{- end -}}
{{- if and
  (not .Values.planes.control.enabled)
  (or
    .Values.embeddedDependencies.postgresql.enabled
    .Values.embeddedDependencies.valkey.enabled
    .Values.embeddedDependencies.objectStorage.enabled) -}}
{{- fail "embedded dependencies require planes.control.enabled=true" -}}
{{- end -}}
{{- if and .Values.databaseMigration.enabled (not .Values.planes.control.enabled) -}}
{{- fail "databaseMigration.enabled requires planes.control.enabled=true" -}}
{{- end -}}
{{- if .Values.planes.control.enabled -}}
{{- $runtimeConfiguration := .Values.configuration -}}
{{- if ne .Values.configuration.snapshot nil -}}
{{- $runtimeConfiguration = .Values.configuration.snapshot -}}
{{- end -}}
{{- $runtimeRoles := get $runtimeConfiguration "roles" -}}
{{- if or (not (kindIs "map" $runtimeRoles)) (eq (len $runtimeRoles) 0) -}}
{{- fail "configuration roles must be a non-empty map in the 6.4 runtime snapshot" -}}
{{- end -}}
{{- range $roleName, $roleDefinition := $runtimeRoles -}}
{{- if or (not $roleName) (not (kindIs "map" $roleDefinition)) -}}
{{- fail "every configuration role must have a non-empty name and mapping definition" -}}
{{- end -}}
{{- if hasKey $roleDefinition "sync_mode" -}}
{{- fail (printf "configuration role %q must not set sync_mode; role definitions are ConfigMap-owned" $roleName) -}}
{{- end -}}
{{- if or (not (hasKey $roleDefinition "description")) (not (hasKey $roleDefinition "policies")) -}}
{{- fail (printf "configuration role %q requires description and policies" $roleName) -}}
{{- end -}}
{{- end -}}
{{- if and
  .Values.secrets.serviceAuth.bootstrap.enabled
  .Values.secrets.serviceAuth.migration.enabled -}}
{{- fail "secrets.serviceAuth.bootstrap.enabled and migration.enabled are mutually exclusive" -}}
{{- end -}}
{{- if and
  .Values.secrets.serviceAuth.migration.enabled
  .Values.services.api.enabled -}}
{{- fail "services.api.enabled must be false during service-auth migration so the 6.4 ConfigMap rollout remains quiesced" -}}
{{- end -}}
{{- if and
  .Values.services.api.enabled
  (ne (dig "type" "" .Values.services.api.deploymentStrategy) "Recreate") -}}
{{- fail "services.api.deploymentStrategy.type must be Recreate so ConfigMap authority changes cannot race workflow submission" -}}
{{- end -}}
{{- if and .Values.planes.compute.enabled (not .Values.secrets.backendApiTokens.enabled) -}}
{{- fail "secrets.backendApiTokens.enabled must be true when both planes are enabled" -}}
{{- end -}}
{{- if .Values.secrets.backendApiTokens.enabled -}}
{{- if not .Values.secrets.backendApiTokens.credentials -}}
{{- fail "secrets.backendApiTokens.credentials must not be empty when backend API tokens are enabled" -}}
{{- end -}}
{{- $backendTokenCredentialNames := dict -}}
{{- $backendTokenSecretNames := dict -}}
{{- range .Values.secrets.backendApiTokens.credentials -}}
{{- $credentialName := required "backend API token credential name is required" .name -}}
{{- if or
  (gt (len $credentialName) 49)
  (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $credentialName)) -}}
{{- fail (printf "invalid backend API token credential name %q" $credentialName) -}}
{{- end -}}
{{- if hasKey $backendTokenCredentialNames $credentialName -}}
{{- fail (printf "duplicate backend API token credential name %q" $credentialName) -}}
{{- end -}}
{{- $_ := set $backendTokenCredentialNames $credentialName true -}}
{{- $secretName := include "osmo.backendApiTokenSecretName" . -}}
{{- if or
  (gt (len $secretName) 253)
  (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $secretName)) -}}
{{- fail (printf "invalid backend API token Secret name %q" $secretName) -}}
{{- end -}}
{{- if hasKey $backendTokenSecretNames $secretName -}}
{{- fail (printf "duplicate backend API token Secret name %q" $secretName) -}}
{{- end -}}
{{- $_ := set $backendTokenSecretNames $secretName true -}}
{{- end -}}
{{- if and
  .Values.planes.compute.enabled
  (not (hasKey $backendTokenSecretNames .Values.compute.authentication.existingSecret)) -}}
{{- fail "compute.authentication.existingSecret must match a configured backend API token Secret in a converged release" -}}
{{- end -}}
{{- end -}}
{{- $objectStorageCredentialsKey := .Values.secrets.objectStorage.keys.credentials -}}
{{- if or
  (not $objectStorageCredentialsKey)
  (gt (len $objectStorageCredentialsKey) 253)
  (not (regexMatch "^[A-Za-z0-9._-]+$" $objectStorageCredentialsKey)) -}}
{{- fail "secrets.objectStorage.keys.credentials must be a non-empty valid Kubernetes Secret data key" -}}
{{- end -}}
{{- if and .Values.embeddedDependencies.postgresql.enabled (not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1")) -}}
{{- fail "embeddedDependencies.postgresql.enabled: install a compatible CloudNativePG operator before enabling embedded PostgreSQL" -}}
{{- end -}}
{{- if .Values.embeddedDependencies.postgresql.enabled -}}
{{- $synchronousInstances := int (dig "cluster" "postgresql" "synchronous" "number" 0 .Values.postgresql) -}}
{{- $dataDurability := dig "cluster" "postgresql" "synchronous" "dataDurability" "" .Values.postgresql -}}
{{- $serverTLSSecret := dig "cluster" "certificates" "serverTLSSecret" "" .Values.postgresql -}}
{{- $serverCASecret := dig "cluster" "certificates" "serverCASecret" "" .Values.postgresql -}}
{{- $clusterName := include "osmo.postgresql.clusterName" . -}}
{{- if gt (len $clusterName) 60 -}}
{{- fail "embedded PostgreSQL cluster name must be at most 60 characters so the CloudNativePG -rw Service name is valid" -}}
{{- end -}}
{{- if .Values.postgresql.namespaceOverride -}}
{{- fail "postgresql.namespaceOverride must be empty because embedded PostgreSQL and OSMO must share a namespace" -}}
{{- end -}}
{{- if .Values.externalDependencies.postgresql.host -}}
{{- fail "externalDependencies.postgresql.host must be empty when embedded PostgreSQL is enabled" -}}
{{- end -}}
{{- if ne .Values.postgresql.mode "standalone" -}}
{{- fail "postgresql.mode: standalone is the only supported embedded mode" -}}
{{- end -}}
{{- if and $serverTLSSecret (not $serverCASecret) -}}
{{- fail "postgresql.cluster.certificates.serverCASecret is required when serverTLSSecret is set" -}}
{{- end -}}
{{- if and
  (eq $dataDurability "required")
  (or
    (lt (int .Values.postgresql.cluster.instances) 2)
    (le (int .Values.postgresql.cluster.instances) $synchronousInstances)) -}}
{{- fail "postgresql.cluster: required synchronous replication needs at least 2 instances and more instances than synchronous standbys" -}}
{{- end -}}
{{- if .Values.secrets.postgresql.existingSecret -}}
{{- fail "secrets.postgresql.existingSecret must be empty when embedded PostgreSQL is enabled; use postgresql.cluster.initdb.secret.name for an existing Secret" -}}
{{- end -}}
{{- if .Values.postgresql.backups.enabled -}}
{{- fail "postgresql.backups.enabled: embedded backup and restore are not supported" -}}
{{- end -}}
{{- range $plugin := .Values.postgresql.cluster.plugins -}}
{{- if and (dig "enabled" false $plugin) (dig "isWALArchiver" false $plugin) -}}
{{- fail "postgresql.cluster.plugins: embedded WAL archiver plugins are not supported" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.embeddedDependencies.objectStorage.enabled -}}
{{- $externalLocations := .Values.externalDependencies.objectStorage.locations -}}
{{- $externalS3 := .Values.externalDependencies.objectStorage.s3 -}}
{{- $embeddedBuckets := .Values.embeddedDependencies.objectStorage.buckets -}}
{{- if ne .Values.externalDependencies.objectStorage.authentication.type "static" -}}
{{- fail "embedded object storage requires static authentication" -}}
{{- end -}}
{{- if $externalLocations.workflows -}}
{{- fail "externalDependencies.objectStorage.locations.workflows must be empty when embedded object storage is enabled" -}}
{{- end -}}
{{- if $externalLocations.logs -}}
{{- fail "externalDependencies.objectStorage.locations.logs must be empty when embedded object storage is enabled" -}}
{{- end -}}
{{- if $externalLocations.apps -}}
{{- fail "externalDependencies.objectStorage.locations.apps must be empty when embedded object storage is enabled" -}}
{{- end -}}
{{- if $externalS3.region -}}
{{- fail "externalDependencies.objectStorage.s3.region must be empty when embedded object storage is enabled" -}}
{{- end -}}
{{- if $externalS3.overrideUrl -}}
{{- fail "externalDependencies.objectStorage.s3.overrideUrl must be empty when embedded object storage is enabled" -}}
{{- end -}}
{{- if and .Values.secrets.objectStorage.generate .Values.secrets.objectStorage.existingSecret -}}
{{- fail "secrets.objectStorage.generate and existingSecret are mutually exclusive" -}}
{{- end -}}
{{- if has $objectStorageCredentialsKey (list "RUSTFS_ACCESS_KEY" "RUSTFS_SECRET_KEY") -}}
{{- fail "secrets.objectStorage.keys.credentials must not use a reserved RustFS key name" -}}
{{- end -}}
{{- if and (not .Values.secrets.objectStorage.generate) (not .Values.secrets.objectStorage.existingSecret) -}}
{{- fail "embedded object storage requires generated or existing credentials" -}}
{{- end -}}
{{- if not .Values.rustfs.secret.existingSecret -}}
{{- fail "rustfs.secret.existingSecret is required for embedded object storage" -}}
{{- end -}}
{{- if and
  (not .Values.secrets.objectStorage.generate)
  (ne .Values.rustfs.secret.existingSecret .Values.secrets.objectStorage.existingSecret) -}}
{{- fail "rustfs.secret.existingSecret must match the effective object-storage Secret" -}}
{{- end -}}
{{- if or .Values.rustfs.secret.rustfs.access_key .Values.rustfs.secret.rustfs.secret_key -}}
{{- fail "inline RustFS credentials are not supported; use the effective object-storage Secret" -}}
{{- end -}}
{{- if .Values.rustfs.secret.allowInsecureDefaults -}}
{{- fail "rustfs.secret.allowInsecureDefaults must be false for embedded object storage" -}}
{{- end -}}
{{- if eq .Values.rustfs.mode.standalone.enabled .Values.rustfs.mode.distributed.enabled -}}
{{- fail "exactly one RustFS topology mode must be enabled" -}}
{{- end -}}
{{- $rustfsFullname := include "osmo.rustfs.fullname" . -}}
{{- if and .Values.rustfs.mode.standalone.enabled (gt (len $rustfsFullname) 59) -}}
{{- fail "standalone embedded RustFS fullname must be at most 59 characters so the -svc Service name is valid; shorten the release name or rustfs.fullnameOverride" -}}
{{- end -}}
{{- if and .Values.rustfs.mode.distributed.enabled (gt (len $rustfsFullname) 54) -}}
{{- fail "distributed embedded RustFS fullname must be at most 54 characters so the -headless Service name is valid; shorten the release name or rustfs.fullnameOverride" -}}
{{- end -}}
{{- if ne (int .Values.rustfs.service.endpoint.port) 9000 -}}
{{- fail "embedded RustFS requires endpoint service port 9000" -}}
{{- end -}}
{{- if .Values.rustfs.ingress.enabled -}}
{{- fail "rustfs.ingress.enabled must be false for embedded object storage" -}}
{{- end -}}
{{- if eq .Values.rustfs.ingress.className "contour" -}}
{{- fail "rustfs.ingress.className must not be contour because the upstream chart exposes an HTTPProxy even when ingress is disabled" -}}
{{- end -}}
{{- if .Values.rustfs.gatewayApi.enabled -}}
{{- fail "rustfs.gatewayApi.enabled must be false for embedded object storage" -}}
{{- end -}}
{{- if .Values.rustfs.mtls.enabled -}}
{{- fail "rustfs.mtls.enabled must be false because OSMO uses the embedded RustFS HTTP endpoint" -}}
{{- end -}}
{{- if ne .Values.rustfs.service.type "ClusterIP" -}}
{{- fail "rustfs.service.type must be ClusterIP for embedded object storage" -}}
{{- end -}}
{{- if .Values.rustfs.service.externalIPs -}}
{{- fail "rustfs.service.externalIPs must be empty for embedded object storage" -}}
{{- end -}}
{{- if .Values.rustfs.service.loadBalancerIP -}}
{{- fail "rustfs.service.loadBalancerIP must be empty for embedded object storage" -}}
{{- end -}}
{{- if .Values.rustfs.service.loadBalancerClass -}}
{{- fail "rustfs.service.loadBalancerClass must be empty for embedded object storage" -}}
{{- end -}}
{{- if .Values.rustfs.service.loadBalancerSourceRanges -}}
{{- fail "rustfs.service.loadBalancerSourceRanges must be empty for embedded object storage" -}}
{{- end -}}
{{- if not .Values.embeddedDependencies.objectStorage.region -}}
{{- fail "embeddedDependencies.objectStorage.region is required when embedded object storage is enabled" -}}
{{- end -}}
{{- if ne .Values.embeddedDependencies.objectStorage.region .Values.rustfs.config.rustfs.region -}}
{{- fail "embeddedDependencies.objectStorage.region must match rustfs.config.rustfs.region; set both values to the same region" -}}
{{- end -}}
{{- if or (not $embeddedBuckets.workflows) (not $embeddedBuckets.logs) (not $embeddedBuckets.apps) -}}
{{- fail "embedded object-storage bucket names must be non-empty" -}}
{{- end -}}
{{- if or
  (eq $embeddedBuckets.workflows $embeddedBuckets.logs)
  (eq $embeddedBuckets.workflows $embeddedBuckets.apps)
  (eq $embeddedBuckets.logs $embeddedBuckets.apps) -}}
{{- fail "embedded object-storage bucket names must be unique" -}}
{{- end -}}
{{- range $bucket := list $embeddedBuckets.workflows $embeddedBuckets.logs $embeddedBuckets.apps -}}
{{- if or
  (not (regexMatch "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" $bucket))
  (contains ".." $bucket)
  (contains ".-" $bucket)
  (contains "-." $bucket)
  (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $bucket) -}}
{{- fail "embedded object-storage bucket names must use valid S3 syntax" -}}
{{- end -}}
{{- end -}}
{{- else if and
  .Values.secrets.objectStorage.generate
  (eq .Values.externalDependencies.objectStorage.authentication.type "static") -}}
{{- fail "secrets.objectStorage.generate is supported only when embedded object storage is enabled" -}}
{{- end -}}
{{- if .Values.embeddedDependencies.valkey.enabled -}}
{{- if .Values.externalDependencies.valkey.host -}}
{{- fail "externalDependencies.valkey.host must be empty when embedded Valkey is enabled" -}}
{{- end -}}
{{- if .Values.externalDependencies.valkey.tls.enabled -}}
{{- fail "externalDependencies.valkey.tls must be disabled when embedded Valkey is enabled" -}}
{{- end -}}
{{- if ne (int .Values.externalDependencies.valkey.database) 0 -}}
{{- fail "externalDependencies.valkey.database must be 0 when embedded Valkey is enabled" -}}
{{- end -}}
{{- if and .Values.secrets.valkey.generate .Values.secrets.valkey.existingSecret -}}
{{- fail "secrets.valkey.generate and existingSecret are mutually exclusive" -}}
{{- end -}}
{{- if and (not .Values.secrets.valkey.generate) (not .Values.secrets.valkey.existingSecret) -}}
{{- fail "embedded Valkey requires generated or existing credentials" -}}
{{- end -}}
{{- if not .Values.valkey.auth.enabled -}}
{{- fail "valkey.auth.enabled must be true for embedded Valkey" -}}
{{- end -}}
{{- if ne (int .Values.valkey.service.port) 6379 -}}
{{- fail "embedded Valkey requires service port 6379" -}}
{{- end -}}
{{- if .Values.valkey.tls.enabled -}}
{{- fail "embedded Valkey TLS is not supported; use an external TLS endpoint" -}}
{{- end -}}
{{- if .Values.valkey.auth.aclConfig -}}
{{- fail "valkey.auth.aclConfig is not supported because credentials must come from a Kubernetes Secret" -}}
{{- end -}}
{{- range $username, $user := .Values.valkey.auth.aclUsers -}}
{{- if $user.password -}}
{{- fail (printf "inline Valkey passwords are not supported for ACL user %s" $username) -}}
{{- end -}}
{{- end -}}
{{- if not (hasKey .Values.valkey.auth.aclUsers "default") -}}
{{- fail "valkey.auth.aclUsers.default is required for OSMO clients" -}}
{{- end -}}
{{- $effectiveSecret := include "osmo.valkey.secretName" . -}}
{{- $configuredSecretValue := required "valkey.auth.usersExistingSecret is required" .Values.valkey.auth.usersExistingSecret -}}
{{- $configuredSecret := $configuredSecretValue -}}
{{- if .Values.secrets.valkey.generate -}}
{{- $configuredSecret = tpl $configuredSecretValue . -}}
{{- else if or (contains "{{" $configuredSecretValue) (contains "}}" $configuredSecretValue) -}}
{{- fail "valkey.auth.usersExistingSecret must not contain templates when using an existing Secret" -}}
{{- end -}}
{{- if ne $configuredSecret $effectiveSecret -}}
{{- fail "valkey.auth.usersExistingSecret must match the effective Valkey Secret" -}}
{{- end -}}
{{- $defaultUser := index .Values.valkey.auth.aclUsers "default" -}}
{{- $passwordKey := dig "passwordKey" "default" $defaultUser -}}
{{- if ne $passwordKey .Values.secrets.valkey.keys.password -}}
{{- fail "valkey.auth.aclUsers.default.passwordKey must match secrets.valkey.keys.password" -}}
{{- end -}}
{{- else if .Values.secrets.valkey.generate -}}
{{- fail "secrets.valkey.generate is supported only when embedded Valkey is enabled" -}}
{{- end -}}
{{- if not .Values.externalUrl -}}
{{- fail "externalUrl is required for the control plane" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (not .Values.gateway.envoy.enabled) -}}
{{- fail "ingress.enabled=true requires gateway.envoy.enabled=true" -}}
{{- end -}}
{{- if and .Values.httproute.enabled (not .Values.gateway.envoy.enabled) -}}
{{- fail "httproute.enabled=true requires gateway.envoy.enabled=true" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (not .Values.ingress.hostname) -}}
{{- fail "ingress.hostname is required when ingress.enabled=true" -}}
{{- end -}}
{{- if and .Values.httproute.enabled (eq (len .Values.httproute.parentRefs) 0) -}}
{{- fail "httproute.parentRefs requires at least one entry when httproute.enabled=true" -}}
{{- end -}}
{{- if and .Values.gateway.tls.enabled .Values.gateway.tls.generated.enabled -}}
{{- if or .Values.gateway.tls.caSecret .Values.gateway.tls.upstreamCerts.api .Values.gateway.tls.upstreamCerts.router .Values.gateway.tls.upstreamCerts.agent .Values.gateway.tls.upstreamCerts.logger .Values.gateway.tls.upstreamCerts.mcp -}}
{{- fail "gateway.tls.generated.enabled cannot be combined with caSecret or upstreamCerts" -}}
{{- end -}}
{{- if and (ne .Values.gateway.tls.generated.caRotation.phase "stable") (not .Values.gateway.tls.generated.caRotation.id) -}}
{{- fail "gateway.tls.generated.caRotation.id is required outside the stable phase" -}}
{{- end -}}
{{- if and (ne .Values.gateway.tls.generated.caRotation.phase "stable") (not .Values.gateway.tls.generated.caRotation.freezeHpas) -}}
{{- fail "gateway.tls.generated.caRotation.freezeHpas must be true during CA rotation" -}}
{{- end -}}
{{- end -}}
{{- if .Values.secrets.defaultAdmin.generate -}}
{{- fail "secrets: generated Secrets are not implemented; configure existingSecret" -}}
{{- end -}}
{{- if and .Values.secrets.oauthCookieSecret.generate .Values.secrets.oauthCookieSecret.existingSecret -}}
{{- fail "secrets.oauthCookieSecret.generate and existingSecret are mutually exclusive" -}}
{{- end -}}
{{- $autoscaledComponents := list
  (dict "path" "services.ui" "component" .Values.services.ui)
  (dict "path" "services.worker" "component" .Values.services.worker)
  (dict "path" "services.api" "component" .Values.services.api)
  (dict "path" "services.router" "component" .Values.services.router)
  (dict "path" "services.logger" "component" .Values.services.logger)
  (dict "path" "services.agent" "component" .Values.services.agent)
  (dict "path" "gateway.envoy" "component" .Values.gateway.envoy)
  (dict "path" "gateway.oauth2Proxy" "component" .Values.gateway.oauth2Proxy)
  (dict "path" "gateway.authz" "component" .Values.gateway.authz) -}}
{{- range $item := $autoscaledComponents -}}
{{- $component := $item.component -}}
{{- if and $component.enabled $component.autoscaling.enabled -}}
{{- $requests := dig "requests" dict $component.resources -}}
{{- if and $component.autoscaling.hpaCpuTarget (not (get $requests "cpu")) -}}
{{- fail (printf "%s autoscaling CPU target requires resources.requests.cpu" $item.path) -}}
{{- end -}}
{{- if and $component.autoscaling.hpaMemoryTarget (not (get $requests "memory")) -}}
{{- fail (printf "%s autoscaling memory target requires resources.requests.memory" $item.path) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $pdbComponents := list
  (dict "path" "services.mcp" "component" .Values.services.mcp)
  (dict "path" "services.ui" "component" .Values.services.ui)
  (dict "path" "services.delayedJobMonitor" "component" .Values.services.delayedJobMonitor)
  (dict "path" "services.worker" "component" .Values.services.worker)
  (dict "path" "services.api" "component" .Values.services.api)
  (dict "path" "services.router" "component" .Values.services.router)
  (dict "path" "services.logger" "component" .Values.services.logger)
  (dict "path" "services.agent" "component" .Values.services.agent)
  (dict "path" "gateway.envoy" "component" .Values.gateway.envoy)
  (dict "path" "gateway.oauth2Proxy" "component" .Values.gateway.oauth2Proxy)
  (dict "path" "gateway.authz" "component" .Values.gateway.authz)
  (dict "path" "gateway.rateLimit" "component" .Values.gateway.rateLimit) -}}
{{- range $item := $pdbComponents -}}
{{- $pdb := dig "podDisruptionBudget" dict $item.component -}}
{{- if dig "enabled" false $pdb -}}
{{- if and (hasKey $pdb "minAvailable") (hasKey $pdb "maxUnavailable") -}}
{{- fail (printf "%s.podDisruptionBudget cannot set both minAvailable and maxUnavailable" $item.path) -}}
{{- end -}}
{{- if and (not (hasKey $pdb "minAvailable")) (not (hasKey $pdb "maxUnavailable")) -}}
{{- fail (printf "%s.podDisruptionBudget requires minAvailable or maxUnavailable when enabled" $item.path) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values "controlPlane" -}}
{{- fail "controlPlane is not a supported value; configure services and gateway directly" -}}
{{- end -}}
{{- if hasKey .Values "components" -}}
{{- fail "components is not a supported value; configure services and gateway" -}}
{{- end -}}
{{- if or (hasKey .Values.gateway.oauth2Proxy "useKubernetesSecrets") (hasKey .Values.gateway.oauth2Proxy "secretName") (hasKey .Values.gateway.oauth2Proxy "clientSecretKey") (hasKey .Values.gateway.oauth2Proxy "cookieSecretKey") (hasKey .Values.gateway.oauth2Proxy "secretPaths") -}}
{{- fail "gateway.oauth2Proxy legacy Secret values are not supported; configure secrets.oauthClientSecret and secrets.oauthCookieSecret" -}}
{{- end -}}
{{- if and (not .Values.embeddedDependencies.postgresql.enabled) (not .Values.externalDependencies.postgresql.host) -}}
{{- fail "externalDependencies.postgresql.host is required for the control plane" -}}
{{- end -}}
{{- if and (not .Values.embeddedDependencies.valkey.enabled) (not .Values.externalDependencies.valkey.host) -}}
{{- fail "externalDependencies.valkey.host is required for the control plane" -}}
{{- end -}}
{{- $credentialSecretRefs := .Values.secrets.objectStorage.credentialSecretRefs -}}
{{- $hasWorkflowCredentialSecretRef := ne $credentialSecretRefs.workflows.name "" -}}
{{- $hasLogCredentialSecretRef := ne $credentialSecretRefs.logs.name "" -}}
{{- $hasAppCredentialSecretRef := ne $credentialSecretRefs.apps.name "" -}}
{{- $hasAnyCredentialSecretRef := or $hasWorkflowCredentialSecretRef $hasLogCredentialSecretRef $hasAppCredentialSecretRef -}}
{{- $hasAllCredentialSecretRefs := and $hasWorkflowCredentialSecretRef $hasLogCredentialSecretRef $hasAppCredentialSecretRef -}}
{{- if not .Values.embeddedDependencies.objectStorage.enabled -}}
{{- $externalLocations := .Values.externalDependencies.objectStorage.locations -}}
{{- $externalS3 := .Values.externalDependencies.objectStorage.s3 -}}
{{- $hasAnyExternalLocation := or $externalLocations.workflows $externalLocations.logs $externalLocations.apps -}}
{{- $hasAllExternalLocations := and $externalLocations.workflows $externalLocations.logs $externalLocations.apps -}}
{{- if and (not $externalLocations.workflows) (not $hasAllCredentialSecretRefs) -}}
{{- fail "externalDependencies.objectStorage.locations.workflows is required for the control plane" -}}
{{- end -}}
{{- if and (not $externalLocations.logs) (not $hasAllCredentialSecretRefs) -}}
{{- fail "externalDependencies.objectStorage.locations.logs is required for the control plane" -}}
{{- end -}}
{{- if and (not $externalLocations.apps) (not $hasAllCredentialSecretRefs) -}}
{{- fail "externalDependencies.objectStorage.locations.apps is required for the control plane" -}}
{{- end -}}
{{- if and $hasAllCredentialSecretRefs $hasAnyExternalLocation (not $hasAllExternalLocations) -}}
{{- fail "externalDependencies.objectStorage.locations must configure workflows, logs, and apps together or leave all three empty for credentialSecretRefs" -}}
{{- end -}}
{{- if $hasAllExternalLocations -}}
{{- $azureLocations := and (hasPrefix "azure://" $externalLocations.workflows) (hasPrefix "azure://" $externalLocations.logs) (hasPrefix "azure://" $externalLocations.apps) -}}
{{- $s3Locations := and (hasPrefix "s3://" $externalLocations.workflows) (hasPrefix "s3://" $externalLocations.logs) (hasPrefix "s3://" $externalLocations.apps) -}}
{{- $swiftLocations := and (hasPrefix "swift://" $externalLocations.workflows) (hasPrefix "swift://" $externalLocations.logs) (hasPrefix "swift://" $externalLocations.apps) -}}
{{- if not (or $azureLocations $s3Locations $swiftLocations) -}}
{{- fail "externalDependencies.objectStorage locations must use one storage URI scheme" -}}
{{- end -}}
{{- if and (not $s3Locations) (or $externalS3.region $externalS3.overrideUrl) -}}
{{- fail "externalDependencies.objectStorage.s3 must be empty for non-S3 locations" -}}
{{- end -}}
{{- else if or $externalS3.region $externalS3.overrideUrl -}}
{{- fail "externalDependencies.objectStorage.s3 must be empty when locations are supplied by credentialSecretRefs" -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.embeddedDependencies.postgresql.enabled) (not .Values.secrets.postgresql.existingSecret) -}}
{{- fail "secrets.postgresql.existingSecret is required for the control plane" -}}
{{- end -}}
{{- if and .Values.databaseMigration.enabled .Values.embeddedDependencies.postgresql.enabled -}}
{{- fail "databaseMigration.enabled requires external PostgreSQL because pre-install hooks run before an embedded PostgreSQL cluster exists" -}}
{{- end -}}
{{- if and (not .Values.embeddedDependencies.valkey.enabled) (not .Values.secrets.valkey.existingSecret) -}}
{{- fail "secrets.valkey.existingSecret is required for the control plane" -}}
{{- end -}}
{{- if and .Values.embeddedDependencies.objectStorage.enabled $hasAnyCredentialSecretRef -}}
{{- fail "secrets.objectStorage.credentialSecretRefs is supported only for external object storage" -}}
{{- end -}}
{{- if and .Values.secrets.objectStorage.existingSecret $hasAnyCredentialSecretRef -}}
{{- fail "configure either secrets.objectStorage.existingSecret or credentialSecretRefs, not both" -}}
{{- end -}}
{{- if and $hasAnyCredentialSecretRef (not $hasAllCredentialSecretRefs) -}}
{{- fail "secrets.objectStorage.credentialSecretRefs must configure workflows, logs, and apps together" -}}
{{- end -}}
{{- if and
  (not .Values.embeddedDependencies.objectStorage.enabled)
  (eq .Values.externalDependencies.objectStorage.authentication.type "sdkDefault")
  (or .Values.secrets.objectStorage.generate .Values.secrets.objectStorage.existingSecret $hasAnyCredentialSecretRef) -}}
{{- fail "sdkDefault authentication must not configure an object-storage Secret" -}}
{{- end -}}
{{- if and
  (not .Values.embeddedDependencies.objectStorage.enabled)
  (eq .Values.externalDependencies.objectStorage.authentication.type "static")
  (not (or .Values.secrets.objectStorage.existingSecret $hasAllCredentialSecretRefs)) -}}
{{- fail "static object storage requires secrets.objectStorage.existingSecret or all credentialSecretRefs" -}}
{{- end -}}
{{- if not .Values.secrets.masterEncryptionKey.existingSecret.name -}}
{{- fail "secrets.masterEncryptionKey.existingSecret.name is required for the control plane" -}}
{{- end -}}
{{- if not .Values.secrets.masterEncryptionKey.existingSecret.key -}}
{{- fail "secrets.masterEncryptionKey.existingSecret.key is required for the control plane" -}}
{{- end -}}
{{- if and .Values.gateway.oauth2Proxy.enabled (not .Values.secrets.oauthClientSecret.existingSecret) -}}
{{- fail "secrets.oauthClientSecret.existingSecret is required when the OAuth2 proxy is enabled" -}}
{{- end -}}
{{- if and .Values.gateway.oauth2Proxy.enabled (not .Values.secrets.oauthCookieSecret.generate) (not .Values.secrets.oauthCookieSecret.existingSecret) -}}
{{- fail "secrets.oauthCookieSecret requires generate=true or existingSecret when the OAuth2 proxy is enabled" -}}
{{- end -}}
{{- if and (not .Values.embeddedDependencies.postgresql.enabled) .Values.externalDependencies.postgresql.tls.enabled (not .Values.externalDependencies.postgresql.tls.caExistingSecret) -}}
{{- fail "externalDependencies.postgresql.tls.caExistingSecret is required when TLS is enabled" -}}
{{- end -}}

{{- $configurationSecretNames := dict -}}
{{- if not .Values.configuration.enabled -}}
{{- fail "configuration.enabled must be true; OSMO 6.4 service configuration is ConfigMap-only" -}}
{{- end -}}
{{- range $index, $secretRef := .Values.configuration.secretRefs -}}
{{- $secretName := required (printf "configuration.secretRefs[%d].secretName is required" $index) $secretRef.secretName -}}
{{- if or (gt (len $secretName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $secretName)) -}}
{{- fail (printf "configuration.secretRefs[%d].secretName must be a valid Kubernetes Secret name" $index) -}}
{{- end -}}
{{- range $label := splitList "." $secretName -}}
{{- if gt (len $label) 63 -}}
{{- fail (printf "configuration.secretRefs[%d].secretName contains a DNS label longer than 63 characters" $index) -}}
{{- end -}}
{{- end -}}
{{- if hasKey $configurationSecretNames $secretName -}}
{{- fail (printf "configuration.secretRefs contains duplicate Secret %q" $secretName) -}}
{{- end -}}
{{- $_ := set $configurationSecretNames $secretName true -}}
{{- end -}}
{{- end -}}
