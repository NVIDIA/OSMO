# Preserve the original generic control-plane defaults for tests that exercise
# an environment fixture without selecting a deployment profile.
planes:
  control:
    enabled: true
  compute:
    enabled: false

fullnameOverride: ''

configuration:
  enabled: false

services:
  ui:
    resources:
      requests:
        cpu: null
        memory: null
      limits:
        memory: null
    pod:
      topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
  api:
    replicas: 3
    resources:
      requests:
        cpu: null
        memory: null
      limits:
        memory: null
    pod:
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
  worker:
    replicas: 2
    resources:
      requests:
        cpu: null
        memory: null
      limits:
        memory: null
    pod:
      topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
  router:
    replicas: 3
    resources:
      requests:
        cpu: null
        memory: null
      limits:
        memory: null
    pod:
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
  logger:
    replicas: 3
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
    pod:
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
  agent:
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
    pod:
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
  delayedJobMonitor:
    resources:
      requests:
        cpu: null
        memory: null
      limits:
        memory: null

gateway:
  envoy:
    replicas: 2
    defaultIdentity:
      user: ''
      roles: ''
      allowedPools: ''
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        memory: 256Mi
  oauth2Proxy:
    enabled: true
  authz:
    enabled: true
  tls:
    enabled: true
