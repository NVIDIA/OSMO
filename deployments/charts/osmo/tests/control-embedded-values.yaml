planes:
  control:
    enabled: true
  compute:
    enabled: false

fullnameOverride: ''

embeddedDependencies:
  postgresql:
    enabled: true
  valkey:
    enabled: false
  objectStorage:
    enabled: false

externalUrl: http://osmo-gateway

externalDependencies:
  postgresql:
    host: ''
  valkey:
    host: external-valkey
    port: 6379
    database: 0
  objectStorage:
    endpoint: https://s3.external.example.com
    region: us-east-1
    buckets:
      workflows: osmo-workflows
      logs: osmo-logs
      apps: osmo-apps

postgresql:
  fullnameOverride: null
  cluster:
    instances: 3
    storage:
      size: 20Gi
    affinity:
      podAntiAffinityType: required
    enablePDB: true
    postgresql:
      synchronous:
        method: any
        number: 1
        dataDurability: required

secrets:
  postgresql:
    existingSecret: ''
  valkey:
    generate: false
    existingSecret: external-control-secrets
  objectStorage:
    generate: false
    existingSecret: external-control-secrets
  backendApiTokens:
    enabled: false
    credentials: []
  masterEncryptionKey:
    managementMode: external
    existingSecret:
      name: external-control-secrets
      key: mek.yaml
    bootstrap:
      enabled: false

configuration:
  enabled: false

gateway:
  envoy:
    defaultIdentity:
      user: ''
      roles: ''
      allowedPools: ''
  oauth2Proxy:
    enabled: true
  authz:
    enabled: true
  tls:
    enabled: true

services:
  api:
    image:
      repository: nvidia/osmo/service
