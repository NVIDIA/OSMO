embeddedDependencies:
  postgresql:
    enabled: true

externalUrl: http://osmo-gateway

externalDependencies:
  postgresql:
    host: ''
  valkey:
    host: external-valkey
    port: 6379
    database: 0
  objectStorage:
    locations:
      workflows: s3://osmo-workflows/workflows
      logs: s3://osmo-logs/logs
      apps: s3://osmo-apps/apps
    s3:
      region: us-east-1
      overrideUrl: https://s3.external.example.com

secrets:
  postgresql:
    existingSecret: ''
  valkey:
    existingSecret: external-control-secrets
  objectStorage:
    existingSecret: external-control-secrets
  masterEncryptionKey:
    existingSecret:
      name: external-control-secrets
      key: mek.yaml

services:
  api:
    image:
      repository: nvidia/osmo/service
