planes:
  control:
    enabled: true
  compute:
    enabled: false

fullnameOverride: ''

embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false

externalUrl: http://osmo-gateway

externalDependencies:
  postgresql:
    host: external-postgresql
    port: 5432
    database: osmo
    username: postgres
  valkey:
    host: external-valkey
    port: 6379
    database: 0
  objectStorage:
    locations:
      workflows: s3://osmo-workflows/workflows
      logs: s3://osmo-logs/logs
      apps: s3://osmo-apps/apps
    s3:
      region: us-east-1
      overrideUrl: https://s3.external.example.com

secrets:
  postgresql:
    existingSecret: external-postgresql-secret
    keys:
      password: external-db-password
  valkey:
    generate: false
    existingSecret: external-valkey-secret
  objectStorage:
    generate: false
    existingSecret: external-object-storage-secret
  serviceAccountTokens:
    enabled: false
    credentials: []
  masterEncryptionKey:
    managementMode: external
    existingSecret:
      name: external-master-encryption-key-secret
      key: keyring.yaml
    bootstrap:
      enabled: false

services:
  api:
    image:
      repository: nvidia/osmo/service
  mcp:
    enabled: false
