services:
  mcp:
    enabled: true
    resourceUrl: https://osmo.example.com/mcp
    oidcProxy:
      oidc:
        configUrl: https://issuer.example.com/.well-known/openid-configuration
        clientId: example-mcp-client
      existingSecret:
        name: mcp-oidc-proxy-secrets

gateway:
  authz:
    enabled: true
