commonAnnotations:
  platform.example.com/owner: common
  checksum/envoy-config: wrong

podDefaults:
  annotations:
    platform.example.com/owner: pod

ingress:
  enabled: true
  hostname: osmo.example.com
  annotations:
    platform.example.com/owner: edge

httproute:
  enabled: true
  parentRefs:
  - name: shared-gateway

monitoring:
  podMonitor:
    enabled: true
    labels:
      prometheus: platform
    annotations:
      platform.example.com/owner: monitor
    interval: 99s
    scrapeTimeout: 88s
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
    honorLabels: true
    podTargetLabels:
    - app.kubernetes.io/component
    relabelings:
    - action: replace
      targetLabel: cluster
      replacement: osmo-test
    metricRelabelings:
    - action: drop
      sourceLabels:
      - __name__
      regex: unwanted_metric
