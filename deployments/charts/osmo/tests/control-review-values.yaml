externalUrl: https://osmo.example.com

configuration:
  service: null

externalDependencies:
  valkey:
    tls:
      enabled: false

monitoring:
  podMonitor:
    enabled: true

services:
  api: {}
  ui:
    docsBaseUrl: "*docs"
    cliInstallScriptUrl: "&install"
  worker:
    pod:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: worker-zone
        whenUnsatisfiable: ScheduleAnyway
  delayedJobMonitor:
    resources:
      requests:
        cpu: 321m
        memory: 512Mi
  router:
    env:
    - name: EMPTY_VALUE
      value: ""
  agent:
    readinessProbe:
      httpGet:
        port: 8000
        path: /review-ready
      periodSeconds: 17
      failureThreshold: 2
      timeoutSeconds: 4
    serviceAccount:
      name: ""
      create: true
      annotations: {}

gateway:
  envoy:
    ssl:
      enabled: true
      secretName: gateway-tls
  oauth2Proxy:
    enabled: true
    useKubernetesSecrets: true
    oidcIssuerUrl: https://issuer.example.com
    clientId: osmo
  authz:
    enabled: true
  rateLimit:
    enabled: true
  networkPolicies:
    enabled: true

ingress:
  enabled: true
  hostname: osmo.example.com
  annotations:
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
  tls:
    enabled: true
    secretName: osmo-ingress-tls
