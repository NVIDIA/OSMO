externalUrl: http://127.0.0.1:18080

secrets:
  serviceAccountTokens:
    enabled: true
    credentials:
    - name: admin
      username: admin
      roles:
      - osmo-admin
      managedSecret:
        name: token-oidc-admin
  oauthClientSecret:
    existingSecret: token-oidc-oauth
    rolloutNonce: test-client-secret
  oauthCookieSecret:
    generate: false
    existingSecret: token-oidc-oauth
    rolloutNonce: test-cookie-secret

services:
  api:
    tokenOidcProvider:
      enabled: true

gateway:
  oauth2Proxy:
    enabled: true
    cookieSecure: false
  envoy:
    internalJwks:
      enabled: true
  networkPolicies:
    enabled: true
  tls:
    enabled: false
