services:
  api:
    extraVolumeMounts:
    - name: api-extension
      mountPath: /var/lib/osmo-extension
    pod:
      extraVolumes:
      - name: api-extension
        emptyDir: {}
  worker:
    extraVolumeMounts:
    - name: worker-extension
      mountPath: /var/lib/osmo-worker-extension
    pod:
      extraVolumes:
      - name: worker-extension
        emptyDir: {}
