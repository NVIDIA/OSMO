services:
  mcp:
    enabled: false
  ui:
    enabled: false
  delayedJobMonitor:
    enabled: false
  worker:
    enabled: false
  api:
    enabled: false
  router:
    enabled: false
  logger:
    enabled: false
  agent:
    enabled: false

gateway:
  envoy:
    enabled: true
  oauth2Proxy:
    enabled: true
  authz:
    enabled: true
  rateLimit:
    enabled: false

embeddedDependencies:
  objectStorage:
    enabled: true

externalDependencies:
  objectStorage:
    locations:
      workflows: ''
      logs: ''
      apps: ''
    s3:
      region: ''
      overrideUrl: ''

secrets:
  objectStorage:
    generate: true
    existingSecret: ''
