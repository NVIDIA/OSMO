externalUrl: http://osmo-gateway

compute:
  backendName: default

externalDependencies:
  postgresql:
    host: azure-postgresql.internal
    port: 5432
    database: osmo
    username: postgres
    tls:
      enabled: false
  valkey:
    host: azure-redis.internal
    port: 10000
    database: 0
    tls:
      enabled: true
  objectStorage:
    authentication:
      type: sdkDefault
    locations:
      workflows: azure://osmoazure/osmo-workflows/workflows
      logs: azure://osmoazure/osmo-workflows/logs
      apps: azure://osmoazure/osmo-workflows/apps

secrets:
  objectStorage:
    existingSecret: ''
