planes:
  control:
    enabled: true
  compute:
    enabled: false
embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false
  gateway:
    enabled: false
  kaiScheduler:
    enabled: false
nameOverride: ''
fullnameOverride: ''
image:
  registry: nvcr.io
  repositoryPrefix: nvidia/osmo
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
commonLabels: {}
commonAnnotations: {}
podDefaults:
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1001
logging:
  enabled: true
  logLevel: DEBUG
  k8sLogLevel: WARNING
  logFormat: text
exposure:
  mode: external
  baseUrl: ''
external:
  postgresql:
    host: ''
    port: 5432
    database: osmo
    username: postgres
    tls:
      enabled: false
      caExistingSecret: ''
      caKey: ca.crt
  valkey:
    host: ''
    port: 6379
    database: 0
    tls:
      enabled: false
      caExistingSecret: ''
      caKey: ca.crt
  objectStorage:
    endpoint: ''
    region: us-east-1
    buckets:
      workflows: ''
      logs: ''
      apps: ''
secrets:
  postgresql:
    generate: false
    existingSecret: ''
    keys:
      password: db-password
  valkey:
    generate: false
    existingSecret: ''
    keys:
      password: redis-password
  objectStorage:
    generate: false
    existingSecret: ''
    keys:
      credentials: object-storage.yaml
  masterEncryptionKey:
    generate: false
    existingSecret: ''
    mountPath: /opt/osmo/config.yaml
    keys:
      config: mek.yaml
  defaultAdmin:
    generate: false
    existingSecret: ''
    username: admin
    keys:
      password: password
configuration:
  enabled: false
  extraConfigMaps: []
  extraAnnotations: {}
  service: {}
  workflow:
    max_num_tasks: 100
    max_exec_timeout: 30d
    default_exec_timeout: 7d
    labels_config:
      policy: []
  podTemplates:
    default_ctrl:
      spec:
        containers:
        - name: osmo-ctrl
          resources:
            limits:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              ephemeral-storage: '{{USER_STORAGE}}'
            requests:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 1Gi
    default_user:
      spec:
        containers:
        - name: '{{USER_CONTAINER_NAME}}'
          resources:
            limits:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              nvidia.com/gpu: '{{USER_GPU}}'
              ephemeral-storage: '{{USER_STORAGE}}'
            requests:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              nvidia.com/gpu: '{{USER_GPU}}'
              ephemeral-storage: '{{USER_STORAGE}}'
  resourceValidations:
    default_cpu:
    - operator: LE
      left_operand: '{{USER_CPU}}'
      right_operand: '{{K8_CPU}}'
      assert_message: Value {{USER_CPU}} too high for CPU
    - operator: GT
      left_operand: '{{USER_CPU}}'
      right_operand: '0'
      assert_message: Value {{USER_CPU}} needs to be greater than 0 for CPU
    default_memory:
    - operator: LE
      left_operand: '{{USER_MEMORY}}'
      right_operand: '{{K8_MEMORY}}'
      assert_message: Value {{USER_MEMORY}} too high for memory
    - operator: GT
      left_operand: '{{USER_MEMORY}}'
      right_operand: '0'
      assert_message: Value {{USER_MEMORY}} needs to be greater than 0 for memory
    default_gpu:
    - operator: LE
      left_operand: '{{USER_GPU}}'
      right_operand: '{{K8_GPU}}'
      assert_message: GPU value {{USER_GPU}} too high for GPU
    - operator: GE
      left_operand: '{{USER_GPU}}'
      right_operand: '0'
      assert_message: GPU value {{USER_GPU}} cannot be negative
    default_storage:
    - operator: LT
      left_operand: '{{USER_STORAGE}}'
      right_operand: '{{K8_STORAGE}}'
      assert_message: Value {{USER_STORAGE}} too high for storage
    - operator: GT
      left_operand: '{{USER_STORAGE}}'
      right_operand: '0'
      assert_message: Value {{USER_STORAGE}} needs to be greater than 0 for storage
  roles:
    osmo-admin:
      description: "Admin role \u2014 full access to all resources"
      policies:
      - effect: Allow
        actions:
        - '*:*'
        resources:
        - '*'
      external_roles:
      - osmo-admin
    osmo-user:
      description: "User role \u2014 standard workflow and data operations"
      policies:
      - effect: Allow
        actions:
        - app:*
        - auth:Token
        - credentials:*
        - mcp:Access
        - pool:List
        - profile:Read
        - profile:Update
        - resources:Read
        - user:List
        - workflow:List
        - workflow:Read
        resources:
        - '*'
      - effect: Allow
        actions:
        - workflow:*
        resources:
        - pool/default
      external_roles:
      - osmo-user
    osmo-default:
      description: "Default role \u2014 login, profile, health check"
      policies:
      - effect: Allow
        actions:
        - auth:Login
        - auth:Refresh
        - auth:Token
        - profile:*
        - system:Health
        resources:
        - '*'
      external_roles: []
    osmo-ctrl:
      description: "Controller role \u2014 internal container communication"
      policies:
      - effect: Allow
        actions:
        - internal:Logger
        - internal:Router
        resources:
        - '*'
      external_roles:
      - osmo-ctrl
    osmo-backend:
      description: "Backend role \u2014 internal operator communication"
      policies:
      - effect: Allow
        actions:
        - internal:Operator
        - config:Read
        - pool:List
        resources:
        - '*'
      external_roles:
      - osmo-backend
  backends:
    default:
      description: Default backend
      scheduler_settings:
        scheduler_type: kai
        scheduler_name: kai-scheduler
        scheduler_timeout: 30
  pools:
    default:
      description: Default pool
      backend: default
      default_platform: default
      common_pod_template:
      - default_ctrl
      - default_user
      common_resource_validations:
      - default_cpu
      - default_memory
      - default_storage
      - default_gpu
      common_default_variables:
        USER_CPU: 1
        USER_GPU: 0
        USER_MEMORY: 1Gi
        USER_STORAGE: 1Gi
      platforms:
        default: {}
  backendTests: {}
  groupTemplates: {}
services:
  mcp:
    enabled: false
    replicas: 1
    image:
      name: mcp-self-hosted
      tag: ''
      pullPolicy: Always
    port: 8000
    resourceUrl: ''
    requestTimeoutSeconds: 10
    authorizationServers: []
    scopes: []
    allowedOrigins: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    livenessProbe:
      httpGet:
        port: http
        path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        port: http
        path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    startupProbe:
      httpGet:
        port: http
        path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    env: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
  ui:
    enabled: true
    replicas: 1
    image:
      name: web-ui
      tag: ''
      pullPolicy: Always
    apiHostname: osmo-gateway:80
    portForwardEnabled: false
    nextjsSslEnabled: false
    containerPort: 8000
    serviceAccount:
      name: osmo
      create: false
      annotations: {}
    maxHttpHeaderSizeKb: 128
    command: []
    args: []
    docsBaseUrl: https://nvidia.github.io/OSMO/main/user_guide/
    cliInstallScriptUrl: https://raw.githubusercontent.com/NVIDIA/OSMO/refs/heads/main/install.sh
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaTarget: 85
      customMetrics: []
    service:
      type: ''
      port: 80
      portName: http
      protocol: TCP
      labels: {}
      annotations: {}
      extraPorts: []
      selector: {}
    resources: {}
    extraPorts: []
    envFrom: []
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 2
      periodSeconds: 5
      timeoutSeconds: 3
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 3
      initialDelaySeconds: 5
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 2
      timeoutSeconds: 3
      periodSeconds: 5
    env: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      hostAliases: []
      initContainers: []
  delayedJobMonitor:
    enabled: true
    replicas: 1
    image:
      name: delayed-job-monitor
      tag: ''
      pullPolicy: Always
    startupProbe:
      exec:
        command:
        - progress_check
        - --progress_interval
        - '30'
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 15
      initialDelaySeconds: 10
    resources: {}
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    volumeMounts:
    - name: progress-files
      mountPath: /var/run/osmo
    env: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      initContainers: []
      volumes:
      - name: progress-files
        emptyDir: {}
  worker:
    enabled: true
    autoscaling:
      minReplicas: 2
      maxReplicas: 10
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
    image:
      name: worker
      tag: ''
      pullPolicy: Always
    startupProbe:
      exec:
        command:
        - progress_check
        - --progress_interval
        - '300'
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 15
      initialDelaySeconds: 10
    resources: {}
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    env: []
    replicas: 2
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      initContainers: []
  api:
    enabled: true
    monitoring:
      podMonitor:
        enabled: false
        interval: 30s
        scrapeTimeout: 10s
        scheme: http
        tlsConfig: {}
    autoscaling:
      minReplicas: 3
      maxReplicas: 9
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
    image:
      name: service
      tag: ''
      pullPolicy: Always
    hostname: ''
    clientInstallUrl: https://raw.githubusercontent.com/NVIDIA/OSMO/refs/heads/main/install.sh
    disableTaskMetrics: false
    auth:
      enabled: false
      device_endpoint: ''
      device_client_id: ''
