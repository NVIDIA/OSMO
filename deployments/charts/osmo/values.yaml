# Internal API gateway and optional gateway-adjacent services. This block is
# independent of the Kubernetes edge mechanism: `gateway.envoy` routes traffic
# inside the release even when an external edge owns the public URL.
gateway:
  # Envoy proxy that provides the single in-cluster OSMO entry point.
  envoy:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: docker.io
      repository: envoyproxy/envoy
      tag: v1.38.1
      digest: ''
      pullPolicy: IfNotPresent
    logLevel: info
    listenerPort: 8080
    maxHeadersSizeKb: 128
    blockedIPs: []
    hostname: ''
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    defaultIdentity:
      user: testuser
      roles: osmo-admin
      allowedPools: default
    service:
      type: NodePort
      port: 80
      nodePort: 30080
      labels: {}
      annotations: {}
      loadBalancerClass: ''
      loadBalancerSourceRanges: []
      externalTrafficPolicy: Cluster
    ssl:
      enabled: false
      secretName: envoy-ssl-cert
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
    livenessProbe:
      enabled: true
      spec:
        httpGet:
          path: /ready
          port: 9901
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
    readinessProbe:
      enabled: true
      spec:
        httpGet:
          path: /ready
          port: 9901
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
    startupProbe:
      enabled: true
      spec:
        httpGet:
          path: /ready
          port: 9901
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
    idp:
      host: ''
    internalJwks:
      enabled: true
      cluster: osmo-api-jwks
      host: ''
      port: ''
    jwt:
      userHeader: x-osmo-user
      # WARNING: Enabling this permits requests without a JWT. Use it only for
      # trusted, non-public development access with an intentional fallback
      # identity; never expose such a gateway to untrusted networks.
      allowMissing: false
      providers: []
      additionalProviders: []
    skipAuthPaths:
    - /api/version
    - /api/auth/login
    - /api/auth/keys
    - /api/auth/refresh_token
    - /api/auth/jwt/refresh_token
    - /api/auth/jwt/access_token
    - /api/router/version
    - /client/version
    extraSkipAuthPaths: []
    routerRoute:
      prefix: /api/router
      timeout: 0s
      cookie:
        name: _osmo_router_affinity
        ttl: 0s
    serviceRoutes: []
    extraRoutes: []
    extraClusters: []
    maxRequests: 100
    extraVolumeMounts: []
    replicas: 1
    pod:
      nodeSelector: {}
      affinity: {}
      podSecurityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
      extraVolumes: []
      hostAliases: []
      initContainers: []
      extraContainers: []
      labels: {}
      annotations: {}
      topologySpreadConstraints: []

  # Internal destinations used by Envoy routes. Empty hosts resolve to this
  # release's Services; set a host only to route outside the release.
  upstreams:
    api:
      host: ''
      port: 80
    router:
      enabled: true
      host: ''
      port: 8000
    ui:
      enabled: true
      host: ''
      port: 80
    agent:
      enabled: true
      host: ''
      port: 80
    logger:
      enabled: true
      host: ''
      port: 8000

  # Optional OIDC login/session proxy. Enable it only after configuring an
  # identity provider and the required existing Secrets.
  oauth2Proxy:
    enabled: false
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: quay.io
      repository: oauth2-proxy/oauth2-proxy
      tag: v7.14.2
      digest: ''
      pullPolicy: IfNotPresent
    httpPort: 4180
    metricsPort: 44180
    provider: oidc
    oidcIssuerUrl: ''
    clientId: ''
    cookieName: _osmo_session
    cookieSecure: true
    cookieDomain: ''
    cookieExpire: 168h
    cookieRefresh: 1h
    scope: openid email profile
    passAccessToken: false
    redisSessionStore: true
    extraArgs: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    service:
      labels: {}
      annotations: {}
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    extraEnv: []
    replicas: 1
    pod:
      annotations: {}
      nodeSelector: {}
      affinity: {}
      podSecurityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
      extraVolumes: []
      hostAliases: []
      initContainers: []
      extraContainers: []
      labels: {}

  # Optional external-authorization service backed by OSMO role policies.
  authz:
    enabled: false
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: ''
      repository: ''
      name: authz-sidecar
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    grpcPort: 50052
    postgres:
      maxConns: 10
      minConns: 2
      maxConnLifetimeMin: 5
    cache:
      ttl: 300
      maxSize: 1000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      labels: {}
      annotations: {}
    livenessProbe:
      enabled: true
      spec:
        grpc:
          port: 50052
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
    readinessProbe:
      enabled: true
      spec:
        grpc:
          port: 50052
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    extraEnv: []
    replicas: 1
    pod:
      annotations: {}
      nodeSelector: {}
      affinity: {}
      podSecurityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 10001
      extraVolumes: []
      hostAliases: []
      initContainers: []
      extraContainers: []
      labels: {}

  # Optional Envoy-compatible global rate-limit service backed by Valkey.
  rateLimit:
    enabled: false
    replicas: 1
    image:
      registry: docker.io
      repository: envoyproxy/ratelimit
      tag: 875d418c
      digest: ''
      pullPolicy: IfNotPresent
    grpcPort: 8091
    httpPort: 8090
    config:
      domain: ratelimit
      descriptors: []
    resources:
      requests:
        cpu: '0.1'
        memory: 200Mi
      limits:
        memory: 200Mi
    service:
      labels: {}
      annotations: {}
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    extraEnv: []
    pod:
      annotations: {}
      nodeSelector: {}
      affinity: {}
      podSecurityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
      extraVolumes: []
      hostAliases: []
      initContainers: []
      extraContainers: []
      labels: {}

  # Optional ingress policies limiting gateway traffic to known upstream pods.
  networkPolicies:
    enabled: false
    # Release-relative component suffixes prevent policies from selecting pods
    # owned by another OSMO release in the same namespace.
    upstreams:
    - name: api
      component: api
      port: 8000
    - name: router
      component: router
      port: 8000
    - name: ui
      component: ui
      port: 8000

  # TLS for traffic from Envoy to OSMO upstream services. Development mode
  # generates stable Kubernetes Secrets; production uses operator-provided or
  # cert-manager-owned existing Secrets. This does not configure edge TLS.
  tls:
    enabled: false
    # Non-secret rollout trigger after operator-owned TLS Secrets change.
    rolloutNonce: ''
    generated:
      enabled: true
      bootstrap:
        # Empty uses the OSMO API service image.
        image: ''
        imagePullPolicy: IfNotPresent
        # One-time gate for the first upgrade from process-local TLS.
        allowInitialGeneration: false
      leafRotationNonce: ''
      caRotation:
        id: ''
        phase: stable
        # Set in a stable preflight upgrade and keep true through retirement.
        freezeHpas: false
    upstreamCerts:
      api: ''
      router: ''
      agent: ''
      logger: ''
      mcp: ''
    caSecret: ''

# OSMO domain configuration rendered into the service ConfigMap.
configuration:
  enabled: true
  extraConfigMaps: []
  extraAnnotations: {}
  service: {}
  workflow:
    max_num_tasks: 100
    max_exec_timeout: 30d
    default_exec_timeout: 7d
    labels_config:
      policy: []
  podTemplates:
    default_ctrl:
      spec:
        containers:
        - name: osmo-ctrl
          resources:
            limits:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              ephemeral-storage: '{{USER_STORAGE}}'
            requests:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 1Gi
    default_user:
      spec:
        containers:
        - name: '{{USER_CONTAINER_NAME}}'
          resources:
            limits:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              ephemeral-storage: '{{USER_STORAGE}}'
            requests:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              ephemeral-storage: '{{USER_STORAGE}}'
  resourceValidations:
    default_cpu:
    - operator: LE
      left_operand: '{{USER_CPU}}'
      right_operand: '{{K8_CPU}}'
      assert_message: Value {{USER_CPU}} too high for CPU
    - operator: GT
      left_operand: '{{USER_CPU}}'
      right_operand: '0'
      assert_message: Value {{USER_CPU}} needs to be greater than 0 for CPU
    default_memory:
    - operator: LE
      left_operand: '{{USER_MEMORY}}'
      right_operand: '{{K8_MEMORY}}'
      assert_message: Value {{USER_MEMORY}} too high for memory
    - operator: GT
      left_operand: '{{USER_MEMORY}}'
      right_operand: '0'
      assert_message: Value {{USER_MEMORY}} needs to be greater than 0 for memory
    default_gpu:
    - operator: LE
      left_operand: '{{USER_GPU}}'
      right_operand: '{{K8_GPU}}'
      assert_message: GPU value {{USER_GPU}} too high for GPU
    - operator: GE
      left_operand: '{{USER_GPU}}'
      right_operand: '0'
      assert_message: GPU value {{USER_GPU}} cannot be negative
    default_storage:
    - operator: LT
      left_operand: '{{USER_STORAGE}}'
      right_operand: '{{K8_STORAGE}}'
      assert_message: Value {{USER_STORAGE}} too high for storage
    - operator: GT
      left_operand: '{{USER_STORAGE}}'
      right_operand: '0'
      assert_message: Value {{USER_STORAGE}} needs to be greater than 0 for storage
  roles:
    osmo-admin:
      description: "Admin role \u2014 full access to all resources"
      policies:
      - effect: Allow
        actions:
        - '*:*'
        resources:
        - '*'
      external_roles:
      - osmo-admin
    osmo-user:
      description: "User role \u2014 standard workflow and data operations"
      policies:
      - effect: Allow
        actions:
        - app:*
        - auth:Token
        - credentials:*
        - mcp:Access
        - pool:List
        - profile:Read
        - profile:Update
        - resources:Read
        - user:List
        - workflow:List
        - workflow:Read
        resources:
        - '*'
      - effect: Allow
        actions:
        - workflow:*
        resources:
        - pool/default
      external_roles:
      - osmo-user
    osmo-default:
      description: "Default role \u2014 login, profile, health check"
      policies:
      - effect: Allow
        actions:
        - auth:Login
        - auth:Refresh
        - auth:Token
        - profile:*
        - system:Health
        resources:
        - '*'
      external_roles: []
    osmo-ctrl:
      description: "Controller role \u2014 internal container communication"
      policies:
      - effect: Allow
        actions:
        - internal:Logger
        - internal:Router
        resources:
        - '*'
      external_roles:
      - osmo-ctrl
    osmo-backend:
      description: "Backend role \u2014 internal operator communication"
      policies:
      - effect: Allow
        actions:
        - internal:Operator
        - config:Read
        - pool:List
        resources:
        - '*'
      external_roles:
      - osmo-backend
  backends:
    default:
      description: Default backend
      scheduler_settings:
        scheduler_type: kai
        scheduler_name: kai-scheduler
        scheduler_timeout: 30
  pools:
    default:
      description: Default pool
      backend: default
      default_platform: default
      common_pod_template:
      - default_ctrl
      - default_user
      common_resource_validations:
      - default_cpu
      - default_memory
      - default_storage
      - default_gpu
      common_default_variables:
        USER_CPU: 1
        USER_GPU: 0
        USER_MEMORY: 1Gi
        USER_STORAGE: 1Gi
      platforms:
        default: {}
  backendTests: {}
  groupTemplates: {}

# CloudNativePG cluster chart values. These settings are used only when
# embeddedDependencies.postgresql.enabled is true.
postgresql:
  fullnameOverride: osmo-pg
  nameOverride: pg
  type: postgresql
  version:
    postgresql: "16"
  mode: standalone
  cluster:
    instances: 1
    storage:
      size: 1Gi
      storageClass: ''
    walStorage:
      enabled: false
      size: 5Gi
      storageClass: ''
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    affinity:
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: ""
    enableSuperuserAccess: false
    enablePDB: false
    postgresql:
      synchronous: null
    initdb:
      database: osmo
      owner: osmo
  backups:
    enabled: false

# Official Valkey dependency configuration. These defaults provide an
# authenticated, persistent standalone primary when embedded Valkey is enabled.
# The dependency also supports fixed-primary replication for read scaling and
# data redundancy, but it does not provide Sentinel or automatic promotion.
valkey:
  fullnameOverride: osmo-valkey
  networkPolicy:
    ingress:
    - from:
      - podSelector: {}
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  initResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  readinessProbe:
    enabled: true
  dataStorage:
    enabled: true
    requestedSize: 512Mi
    keepPvc: true
  auth:
    enabled: true
    usersExistingSecret: '{{ printf "%s-valkey-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}'
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: redis-password
  valkeyConfig: |
    appendonly yes
    appendfsync everysec
    maxmemory 1gb
    maxmemory-policy noeviction
  deploymentStrategy: Recreate
  replica:
    enabled: false
    minReplicasToWrite: 0
    persistence:
      size: 8Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
  podDisruptionBudget:
    enabled: false

# Official RustFS dependency configuration. These defaults provide a hardened,
# persistent standalone server when embedded object storage is enabled.
rustfs:
  fullnameOverride: osmo-rustfs
  replicaCount: 1
  mode:
    standalone:
      enabled: true
      strategy:
        type: Recreate
    distributed:
      enabled: false
  secret:
    existingSecret: osmo-rustfs-credentials
    allowInsecureDefaults: false
    rustfs:
      access_key: ""
      secret_key: ""
  ingress:
    enabled: false
  gatewayApi:
    enabled: false
  serviceAccount:
    create: true
    automount: false
  image:
    rustfs:
      repository: rustfs/rustfs
      tag: "1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0"
    initImage:
      repository: busybox
      tag: "stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  config:
    rustfs:
      console_enable: "false"
      obs_environment: production
      obs_log_directory: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  podSecurityContext:
    fsGroup: 10001
    runAsUser: 10001
    runAsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
  affinity:
    podAntiAffinity:
      enabled: false
  storageclass:
    name: ""
    dataStorageSize: 1Gi
