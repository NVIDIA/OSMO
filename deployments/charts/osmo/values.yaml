      periodSeconds: 5
      timeoutSeconds: 3
      initialDelaySeconds: 5
    resources: {}
    extraArgs: []
    serviceAccount:
      name: ''
      create: true
      annotations: {}
    env: []
    replicas: 3
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      hostAliases: []
      initContainers: []
  router:
    enabled: true
    autoscaling:
      minReplicas: 3
      maxReplicas: 5
