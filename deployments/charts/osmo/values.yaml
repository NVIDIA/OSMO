    enabled: true
    autoscaling:
      minReplicas: 2
      maxReplicas: 6
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
    image:
      repository: envoyproxy/envoy:v1.38.1
      pullPolicy: IfNotPresent
    logLevel: info
    listenerPort: 8080
    maxHeadersSizeKb: 128
    blockedIPs: []
    hostname: ''
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    defaultIdentity:
      user: ''
      roles: ''
      allowedPools: ''
    service:
      type: LoadBalancer
      httpsPort: 443
      nodePort: null
      annotations: {}
    ingress:
      enabled: false
      ingressClass: alb
      albAnnotations:
        enabled: false
        groupName: osmo
        groupOrder: '10'
        sslCertArn: ''
      sslEnabled: false
