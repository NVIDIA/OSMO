      enabled: true
      host: osmo-service
      port: 80
    router:
      enabled: true
      host: osmo-router-headless
      port: 8000
    ui:
      enabled: true
      host: osmo-ui
      port: 80
    agent:
      enabled: true
      host: osmo-agent
      port: 80
    logger:
      enabled: true
      host: osmo-logger-headless
      port: 8000
  oauth2Proxy:
    enabled: true
    autoscaling:
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
      pullPolicy: IfNotPresent
    httpPort: 4180
    metricsPort: 44180
    provider: oidc
    oidcIssuerUrl: ''
    clientId: ''
    cookieName: _osmo_session
    cookieSecure: true
    cookieDomain: ''
    cookieExpire: 168h
    cookieRefresh: 1h
    scope: openid email profile
    passAccessToken: false
    redisSessionStore: true
    useKubernetesSecrets: false
    secretName: oauth2-proxy-secrets
    clientSecretKey: client_secret
    cookieSecretKey: cookie_secret
    secretPaths:
      clientSecret: /etc/oauth2-proxy/client-secret
      cookieSecret: /etc/oauth2-proxy/cookie-secret
    extraArgs: []
    redis:
      port: 6379
      tlsEnabled: true
      dbNumber: 0
    resources:
