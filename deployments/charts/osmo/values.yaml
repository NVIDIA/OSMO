        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    livenessProbe:
      grpc:
        port: 50052
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      grpc:
        port: 50052
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    volumeMounts: []
    env: []
    replicas: 1
    pod:
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 10001
      volumes: []
      labels: {}
  rateLimit:
    enabled: false
    replicas: 1
    image:
      repository: envoyproxy/ratelimit:875d418c
      pullPolicy: IfNotPresent
    grpcPort: 8091
    httpPort: 8090
    redis:
      port: 6379
      tlsEnabled: true
    config:
      domain: ratelimit
      descriptors: []
    resources:
      requests:
        cpu: '0.1'
        memory: 200Mi
      limits:
        memory: 200Mi
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    volumeMounts: []
    env: []
    pod:
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
      volumes: []
      labels: {}
  networkPolicies:
    enabled: false
    upstreams:
    - name: osmo-service
      podSelector:
        app: osmo-service
      port: 8000
    - name: osmo-router
      podSelector:
        app: osmo-router
      port: 8000
    - name: osmo-ui
      podSelector:
        app: osmo-ui
      port: 8000
  tls:
    enabled: true
    upstreamCerts:
      service: ''
      router: ''
      agent: ''
      logger: ''
      mcp: ''
    caSecret: ''
