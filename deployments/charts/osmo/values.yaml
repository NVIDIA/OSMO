# Select which OSMO planes this release owns.
planes:
  # Deploy the API, UI, router, workers, logging services, and gateway. This
  # must remain true while the chart supports only control-plane releases.
  control:
    enabled: true
  # TODO: Allow this switch after compute-plane templates are added.
  # Reserved for backend-operator workloads. Enabling it is currently rejected.
  compute:
    enabled: false

# Select supporting systems managed by this Helm release. Embedded PostgreSQL
# requires a compatible CloudNativePG operator to be installed first. Embedded
# Valkey is managed directly by this release.
embeddedDependencies:
  postgresql:
    enabled: false
  valkey:
    enabled: false
  objectStorage:
    enabled: false
    # Must match rustfs.config.rustfs.region when enabled. Override both values
    # together for a non-default region.
    region: us-east-1
    buckets:
      workflows: osmo-workflows
      logs: osmo-logs
      apps: osmo-apps
    bootstrap:
      image: amazon/aws-cli:2.31.13@sha256:e14216fb361cce909ce199616711ad103182d5937f851cda9bebf25867d7180a
      attempts: 30
      backoffLimit: 3
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  kaiScheduler:
    enabled: false

# Connection details for dependencies owned outside this release. Each
# endpoint is required only when its embedded dependency is disabled.
externalDependencies:
  # PostgreSQL stores OSMO control-plane state. Set caExistingSecret when the
  # server certificate is signed by a private CA.
  postgresql:
    host: ''
    port: 5432
    database: osmo
    username: postgres
    tls:
      enabled: false
      caExistingSecret: ''
      caKey: ca.crt
  # Valkey provides queues, caches, events, and distributed coordination. TLS
  # uses the system trust store unless caExistingSecret selects a custom bundle.
  # When set, caKey must contain the complete trust bundle because clients use
  # it through SSL_CERT_FILE.
  valkey:
    host: ''
    port: 6379
    database: 0
    tls:
      enabled: false
      caExistingSecret: ''
      caKey: ca-bundle.crt
  # S3-compatible storage for workflow data, logs, and application bundles.
  objectStorage:
    endpoint: ''
    region: us-east-1
    buckets:
      workflows: ''
      logs: ''
      apps: ''

# Override the names Helm derives from the chart and release. Leave empty for
# conventional names such as `osmo-api` and `osmo-gateway`.
nameOverride: ''
fullnameOverride: ''

# A non-empty registry overrides OSMO-owned component and runtime image
# registries. Configure dependency registries in their native values blocks.
imageRegistry: ''

# Pull credential Secret references for OSMO-owned pods. Configure dependency
# pull credentials in the dependency's native values block.
imagePullSecrets: []

# Runtime images referenced by submitted workflows.
runtimeImage:
  registry: nvcr.io
  repository: nvidia/osmo
  tag: ''

# Metadata and scheduling defaults shared by OSMO-owned workloads. Labels,
# annotations, and node selectors merge with service-specific pod values;
# service-specific tolerations replace this list.
commonLabels: {}
commonAnnotations: {}
podDefaults:
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1001
  terminationGracePeriodSeconds: 30

# Shared Python service logging settings.
logging:
  enabled: true
  logLevel: INFO
  k8sLogLevel: WARNING
  logFormat: text

# Public OSMO URL used in generated service configuration and redirects.
# Include the scheme, for example `https://osmo.example.com`.
externalUrl: ''

# Optional Kubernetes Ingress for the OSMO gateway Service.
ingress:
  enabled: false
  labels: {}
  annotations: {}
  ingressClassName: ''
  hostname: ''
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ''
  extraHosts: []
  extraPaths: []
  extraRules: []
  extraTls: []

# Optional Gateway API HTTPRoute. Parent references must target a Gateway
# managed outside this chart.
httproute:
  enabled: false
  labels: {}
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

# Optional Prometheus Operator PodMonitors for OSMO metrics endpoints.
monitoring:
  podMonitor:
    enabled: false
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
    tlsConfig: {}
    honorLabels: false
    podTargetLabels: []
    relabelings: []
    metricRelabelings: []

# References to Kubernetes Secrets. Inline credentials are not accepted.
# Embedded PostgreSQL credentials are owned by
# postgresql.cluster.initdb.secret.name. These Secret settings are external-only
# for PostgreSQL. Retained generated credentials are supported by embedded
# Valkey and embedded object storage; other credential sources remain external.
secrets:
  # Credentials for external PostgreSQL. Embedded PostgreSQL credentials are
  # created by CloudNativePG or configured with
  # postgresql.cluster.initdb.secret.name.
  postgresql:
    existingSecret: ''
    keys:
      username: username
      password: db-password
  # Password used for the effective Valkey connection. Embedded mode supports
  # either a retained generated Secret or an existing Secret; external mode
  # requires an existing Secret.
  valkey:
    generate: false
    existingSecret: ''
    keys:
      password: redis-password
  # Storage SDK configuration file mounted for all three object-storage uses.
  objectStorage:
    generate: false
    existingSecret: ''
    keys:
      credentials: object-storage.yaml
  # Master encryption key configuration mounted into OSMO services.
  masterEncryptionKey:
    generate: false
    existingSecret: ''
    mountPath: /opt/osmo/config.yaml
    keys:
      config: mek.yaml
  # Optional password used to bootstrap the named administrator account.
  defaultAdmin:
    generate: false
    existingSecret: ''
    username: admin
    keys:
      password: password


# Control-plane application services. Each service owns its image, scaling,
# probes, resources, environment overrides, and pod-level settings. Internal
# commands, ports, Service names, and required connection arguments remain
# chart-managed implementation details.
services:
  # Optional Model Context Protocol endpoint exposed through the gateway.
  mcp:
    enabled: false
    replicas: 1
    image:
      registry: nvcr.io
      repository: nvidia/osmo/mcp-self-hosted
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    port: 8000
    resourceUrl: ''
    requestTimeoutSeconds: 10
    authorizationServers: []
    scopes: []
    allowedOrigins: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    livenessProbe:
      httpGet:
        port: http
        path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        port: http
        path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    startupProbe:
      httpGet:
        port: http
        path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    env: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001

  # Browser-based OSMO user interface.
  ui:
    enabled: true
    replicas: 1
    image:
      registry: nvcr.io
      repository: nvidia/osmo/web-ui
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    # Leave empty to use this release's gateway Service and configured port.
    apiHostname: ''
    portForwardEnabled: false
    nextjsSslEnabled: false
    containerPort: 8000
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    maxHttpHeaderSizeKb: 128
    command: []
    args: []
    docsBaseUrl: https://nvidia.github.io/OSMO/main/user_guide/
    cliInstallScriptUrl: https://raw.githubusercontent.com/NVIDIA/OSMO/refs/heads/main/install.sh
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 85
      hpaMemoryTarget: null
      customMetrics: []
      behavior: {}
    service:
      type: ''
      port: 80
      portName: http
      protocol: TCP
      labels: {}
      annotations: {}
      extraPorts: []
    resources: {}
    extraPorts: []
    envFrom: []
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 2
      periodSeconds: 5
      timeoutSeconds: 3
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 3
      initialDelaySeconds: 5
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 2
      timeoutSeconds: 3
      periodSeconds: 5
    env: []
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
        runAsUser: 1000
      topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      hostAliases: []
      initContainers: []
      extraVolumes: []

  # Promotes scheduled Redis jobs when their delay expires.
  delayedJobMonitor:
    enabled: true
    replicas: 1
    image:
      registry: nvcr.io
      repository: nvidia/osmo/delayed-job-monitor
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    startupProbe:
      exec:
        command:
        - progress_check
        - --progress_interval
        - '30'
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 15
      initialDelaySeconds: 10
    resources: {}
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    env: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      initContainers: []
      extraVolumes: []

  # Executes asynchronous control-plane jobs from the Valkey queue.
  worker:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: nvcr.io
      repository: nvidia/osmo/worker
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    startupProbe:
      exec:
        command:
        - progress_check
        - --progress_interval
        - '300'
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 15
      initialDelaySeconds: 10
    resources: {}
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    env: []
    replicas: 2
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints:
      - topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      initContainers: []
      extraVolumes: []

  # Main OSMO REST API and control-plane service.
  api:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 9
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: nvcr.io
      repository: nvidia/osmo/service
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    hostname: ''
    clientInstallUrl: https://raw.githubusercontent.com/NVIDIA/OSMO/refs/heads/main/install.sh
    disableTaskMetrics: false
    auth:
      enabled: false
      deviceEndpoint: ''
      deviceClientId: ''
      browserEndpoint: ''
      browserClientId: ''
      tokenEndpoint: ''
      logoutEndpoint: ''
    livenessProbe:
      httpGet:
        port: 8000
        path: /api/version
      timeoutSeconds: 20
      failureThreshold: 3
      periodSeconds: 45
    startupProbe:
      httpGet:
        port: 8000
        path: /api/version
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 3
      initialDelaySeconds: 5
    # Keep readiness authorization-neutral: this endpoint only confirms that
    # the API process is ready to receive traffic.
    readinessProbe:
      httpGet:
        port: 8000
        path: /health
      failureThreshold: 3
      periodSeconds: 45
      timeoutSeconds: 20
    resources: {}
    extraArgs: []
    serviceAccount:
      name: ''
      create: true
      annotations: {}
      automountServiceAccountToken: true
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    env: []
    replicas: 3
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      hostAliases: []
      initContainers: []
      extraVolumes: []

  # Routes sticky HTTP and WebSocket sessions to connected backends.
  router:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 5
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: nvcr.io
      repository: nvidia/osmo/router
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    hostname: ''
    webserverEnabled: false
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraPorts: []
    resources: {}
    livenessProbe:
      httpGet:
        port: 8000
        path: /api/router/version
      failureThreshold: 2
      periodSeconds: 5
      timeoutSeconds: 30
    startupProbe:
      httpGet:
        port: 8000
        path: /api/router/version
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 3
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        port: 8000
        path: /api/router/version
      periodSeconds: 5
      failureThreshold: 2
      timeoutSeconds: 30
    env: []
    replicas: 3
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      hostAliases: []
      initContainers: []
      extraVolumes: []

  # Receives workflow logs and task metrics from runtime containers.
  logger:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 9
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: nvcr.io
      repository: nvidia/osmo/logger
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    startupProbe:
      exec:
        command:
        - progress_check
        - --progress_interval
        - '60'
        - --progress_file
        - /var/run/osmo/last_progress
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 15
      initialDelaySeconds: 10
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        memory: 1Gi
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    envoy: {}
    env: []
    replicas: 3
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      initContainers: []
      extraVolumes: []

  # Receives backend-cluster events and heartbeat streams.
  agent:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 9
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: nvcr.io
      repository: nvidia/osmo/agent
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    startupProbe:
      exec:
        command:
        - progress_check
        - --progress_interval
        - '60'
        - --progress_file
        - /var/run/osmo/last_progress
      failureThreshold: 24
      periodSeconds: 5
      timeoutSeconds: 15
      initialDelaySeconds: 10
    readinessProbe:
      httpGet:
        port: 8000
        path: /health
      periodSeconds: 45
      failureThreshold: 3
      timeoutSeconds: 20
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        memory: 1Gi
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    envoy: {}
    env: []
    replicas: 1
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      initContainers: []
      extraVolumes: []

# Internal API gateway and optional gateway-adjacent services. This block is
# independent of the Kubernetes edge mechanism: `gateway.envoy` routes traffic
# inside the release even when an external edge owns the public URL.
gateway:
  # Envoy proxy that provides the single in-cluster OSMO entry point.
  envoy:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: docker.io
      repository: envoyproxy/envoy
      tag: v1.38.1
      digest: ''
      pullPolicy: IfNotPresent
    logLevel: info
    listenerPort: 8080
    maxHeadersSizeKb: 128
    blockedIPs: []
    hostname: ''
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    defaultIdentity:
      user: ''
      roles: ''
      allowedPools: ''
    service:
      type: ClusterIP
      port: 80
      nodePort: null
      labels: {}
      annotations: {}
      loadBalancerClass: ''
      loadBalancerSourceRanges: []
      externalTrafficPolicy: Cluster
    ssl:
      enabled: false
      secretName: envoy-ssl-cert
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /ready
        port: 9901
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 9901
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
    startupProbe:
      httpGet:
        path: /ready
        port: 9901
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 3
    idp:
      host: ''
    internalJwks:
      enabled: true
      cluster: osmo-api-jwks
      host: ''
      port: ''
    jwt:
      userHeader: x-osmo-user
      providers: []
    skipAuthPaths:
    - /api/version
    - /api/auth/login
    - /api/auth/keys
    - /api/auth/refresh_token
    - /api/auth/jwt/refresh_token
    - /api/auth/jwt/access_token
    - /api/router/version
    - /client/version
    extraSkipAuthPaths: []
    routerRoute:
      prefix: /api/router
      timeout: 0s
      cookie:
        name: _osmo_router_affinity
        ttl: 0s
    serviceRoutes: []
    extraRoutes: []
    extraClusters: []
    maxRequests: 100
    extraVolumeMounts: []
    replicas: 2
    pod:
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
      extraVolumes: []
      labels: {}
      annotations: {}

  # Internal destinations used by Envoy routes. Empty hosts resolve to this
  # release's Services; set a host only to route outside the release.
  upstreams:
    api:
      host: ''
      port: 80
    router:
      enabled: true
      host: ''
      port: 8000
    ui:
      enabled: true
      host: ''
      port: 80
    agent:
      enabled: true
      host: ''
      port: 80
    logger:
      enabled: true
      host: ''
      port: 8000

  # Optional OIDC login/session proxy. The split-plane control profile keeps
  # it disabled unless an identity provider and existing Secret are supplied.
  oauth2Proxy:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: quay.io
      repository: oauth2-proxy/oauth2-proxy
      tag: v7.14.2
      digest: ''
      pullPolicy: IfNotPresent
    httpPort: 4180
    metricsPort: 44180
    provider: oidc
    oidcIssuerUrl: ''
    clientId: ''
    cookieName: _osmo_session
    cookieSecure: true
    cookieDomain: ''
    cookieExpire: 168h
    cookieRefresh: 1h
    scope: openid email profile
    passAccessToken: false
    redisSessionStore: true
    useKubernetesSecrets: false
    secretName: oauth2-proxy-secrets
    clientSecretKey: client_secret
    cookieSecretKey: cookie_secret
    secretPaths:
      clientSecret: /etc/oauth2-proxy/client-secret
      cookieSecret: /etc/oauth2-proxy/cookie-secret
    extraArgs: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    env: []
    replicas: 1
    pod:
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
      extraVolumes: []
      labels: {}

  # Optional external-authorization service backed by OSMO role policies.
  authz:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 80
      hpaMemoryTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: nvcr.io
      repository: nvidia/osmo/authz-sidecar
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    grpcPort: 50052
    postgres:
      maxConns: 10
      minConns: 2
      maxConnLifetimeMin: 5
    cache:
      ttl: 300
      maxSize: 1000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    livenessProbe:
      grpc:
        port: 50052
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      grpc:
        port: 50052
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    env: []
    replicas: 1
    pod:
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 10001
      extraVolumes: []
      labels: {}

  # Optional Envoy-compatible global rate-limit service backed by Valkey.
  rateLimit:
    enabled: false
    replicas: 1
    image:
      registry: docker.io
      repository: envoyproxy/ratelimit
      tag: 875d418c
      digest: ''
      pullPolicy: IfNotPresent
    grpcPort: 8091
    httpPort: 8090
    config:
      domain: ratelimit
      descriptors: []
    resources:
      requests:
        cpu: '0.1'
        memory: 200Mi
      limits:
        memory: 200Mi
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    env: []
    pod:
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
      extraVolumes: []
      labels: {}

  # Optional ingress policies limiting gateway traffic to known upstream pods.
  networkPolicies:
    enabled: false
    # Release-relative component suffixes prevent policies from selecting pods
    # owned by another OSMO release in the same namespace.
    upstreams:
    - name: api
      component: api
      port: 8000
    - name: router
      component: router
      port: 8000
    - name: ui
      component: ui
      port: 8000

  # TLS for traffic from Envoy to OSMO upstream services. Existing Secret
  # names provide fixed certificates; empty entries use each service's
  # chart-managed self-signed mode. This does not configure public edge TLS.
  tls:
    enabled: true
    upstreamCerts:
      api: ''
      router: ''
      agent: ''
      logger: ''
      mcp: ''
    caSecret: ''

# OSMO domain configuration rendered into the service ConfigMap. Enable this
# in a profile to manage workflows, pod templates, validation rules, roles,
# backends, and pools with the release.
configuration:
  # When false, the chart does not render or mount the OSMO configuration
  # ConfigMap. The split-plane control profile enables it.
  enabled: false
  extraConfigMaps: []
  extraAnnotations: {}
  service: {}
  workflow:
    max_num_tasks: 100
    max_exec_timeout: 30d
    default_exec_timeout: 7d
    labels_config:
      policy: []
  podTemplates:
    default_ctrl:
      spec:
        containers:
        - name: osmo-ctrl
          resources:
            limits:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              ephemeral-storage: '{{USER_STORAGE}}'
            requests:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 1Gi
    default_user:
      spec:
        containers:
        - name: '{{USER_CONTAINER_NAME}}'
          resources:
            limits:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              nvidia.com/gpu: '{{USER_GPU}}'
              ephemeral-storage: '{{USER_STORAGE}}'
            requests:
              cpu: '{{USER_CPU}}'
              memory: '{{USER_MEMORY}}'
              nvidia.com/gpu: '{{USER_GPU}}'
              ephemeral-storage: '{{USER_STORAGE}}'
  resourceValidations:
    default_cpu:
    - operator: LE
      left_operand: '{{USER_CPU}}'
      right_operand: '{{K8_CPU}}'
      assert_message: Value {{USER_CPU}} too high for CPU
    - operator: GT
      left_operand: '{{USER_CPU}}'
      right_operand: '0'
      assert_message: Value {{USER_CPU}} needs to be greater than 0 for CPU
    default_memory:
    - operator: LE
      left_operand: '{{USER_MEMORY}}'
      right_operand: '{{K8_MEMORY}}'
      assert_message: Value {{USER_MEMORY}} too high for memory
    - operator: GT
      left_operand: '{{USER_MEMORY}}'
      right_operand: '0'
      assert_message: Value {{USER_MEMORY}} needs to be greater than 0 for memory
    default_gpu:
    - operator: LE
      left_operand: '{{USER_GPU}}'
      right_operand: '{{K8_GPU}}'
      assert_message: GPU value {{USER_GPU}} too high for GPU
    - operator: GE
      left_operand: '{{USER_GPU}}'
      right_operand: '0'
      assert_message: GPU value {{USER_GPU}} cannot be negative
    default_storage:
    - operator: LT
      left_operand: '{{USER_STORAGE}}'
      right_operand: '{{K8_STORAGE}}'
      assert_message: Value {{USER_STORAGE}} too high for storage
    - operator: GT
      left_operand: '{{USER_STORAGE}}'
      right_operand: '0'
      assert_message: Value {{USER_STORAGE}} needs to be greater than 0 for storage
  roles:
    osmo-admin:
      description: "Admin role \u2014 full access to all resources"
      policies:
      - effect: Allow
        actions:
        - '*:*'
        resources:
        - '*'
      external_roles:
      - osmo-admin
    osmo-user:
      description: "User role \u2014 standard workflow and data operations"
      policies:
      - effect: Allow
        actions:
        - app:*
        - auth:Token
        - credentials:*
        - mcp:Access
        - pool:List
        - profile:Read
        - profile:Update
        - resources:Read
        - user:List
        - workflow:List
        - workflow:Read
        resources:
        - '*'
      - effect: Allow
        actions:
        - workflow:*
        resources:
        - pool/default
      external_roles:
      - osmo-user
    osmo-default:
      description: "Default role \u2014 login, profile, health check"
      policies:
      - effect: Allow
        actions:
        - auth:Login
        - auth:Refresh
        - auth:Token
        - profile:*
        - system:Health
        resources:
        - '*'
      external_roles: []
    osmo-ctrl:
      description: "Controller role \u2014 internal container communication"
      policies:
      - effect: Allow
        actions:
        - internal:Logger
        - internal:Router
        resources:
        - '*'
      external_roles:
      - osmo-ctrl
    osmo-backend:
      description: "Backend role \u2014 internal operator communication"
      policies:
      - effect: Allow
        actions:
        - internal:Operator
        - config:Read
        - pool:List
        resources:
        - '*'
      external_roles:
      - osmo-backend
  backends:
    default:
      description: Default backend
      scheduler_settings:
        scheduler_type: kai
        scheduler_name: kai-scheduler
        scheduler_timeout: 30
  pools:
    default:
      description: Default pool
      backend: default
      default_platform: default
      common_pod_template:
      - default_ctrl
      - default_user
      common_resource_validations:
      - default_cpu
      - default_memory
      - default_storage
      - default_gpu
      common_default_variables:
        USER_CPU: 1
        USER_GPU: 0
        USER_MEMORY: 1Gi
        USER_STORAGE: 1Gi
      platforms:
        default: {}
  backendTests: {}
  groupTemplates: {}

# CloudNativePG cluster chart values. These settings are used only when
# embeddedDependencies.postgresql.enabled is true.
postgresql:
  nameOverride: pg
  type: postgresql
  version:
    postgresql: "16"
  mode: standalone
  cluster:
    instances: 3
    storage:
      size: 20Gi
      storageClass: ''
    walStorage:
      enabled: false
      size: 5Gi
      storageClass: ''
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    affinity:
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: required
    enableSuperuserAccess: false
    enablePDB: true
    postgresql:
      synchronous:
        method: any
        number: 1
        dataDurability: required
    initdb:
      database: osmo
      owner: osmo
  backups:
    enabled: false

# Official Valkey dependency configuration. These defaults provide an
# authenticated, persistent standalone primary when embedded Valkey is enabled.
# The dependency also supports fixed-primary replication for read scaling and
# data redundancy, but it does not provide Sentinel or automatic promotion.
valkey:
  networkPolicy:
    ingress:
    - from:
      - podSelector: {}
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  initResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  readinessProbe:
    enabled: true
  dataStorage:
    enabled: true
    requestedSize: 8Gi
    keepPvc: true
  auth:
    enabled: true
    usersExistingSecret: '{{ printf "%s-valkey-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}'
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: redis-password
  valkeyConfig: |
    appendonly yes
    appendfsync everysec
    maxmemory 1gb
    maxmemory-policy noeviction
  deploymentStrategy: Recreate
  replica:
    minReplicasToWrite: 1
    persistence:
      size: 8Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
  podDisruptionBudget:
    enabled: true

# Official RustFS dependency configuration. These defaults provide a hardened,
# persistent standalone server when embedded object storage is enabled.
rustfs:
  replicaCount: 1
  mode:
    standalone:
      enabled: true
      strategy:
        type: Recreate
    distributed:
      enabled: false
  secret:
    existingSecret: osmo-rustfs-credentials
    allowInsecureDefaults: false
    rustfs:
      access_key: ""
      secret_key: ""
  ingress:
    enabled: false
  gatewayApi:
    enabled: false
  serviceAccount:
    create: true
    automount: false
  image:
    rustfs:
      repository: rustfs/rustfs
      tag: "1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0"
    initImage:
      repository: busybox
      tag: "stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  config:
    rustfs:
      console_enable: "false"
      obs_environment: production
      obs_log_directory: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  podSecurityContext:
    fsGroup: 10001
    runAsUser: 10001
    runAsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
  storageclass:
    name: ""
    dataStorageSize: 10Gi
