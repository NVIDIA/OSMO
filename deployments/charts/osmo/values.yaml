      limits:
        memory: 128Mi
    serviceAccount:
      name: ''
      create: false
      annotations: {}
    volumeMounts: []
    env: []
    replicas: 1
    pod:
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001
