# The chart defaults provide the development quickstart composition. Production
# and split-plane profiles override these values explicitly.
planes:
  # Deploy the API, UI, router, workers, logging services, and gateway. This
  # can be disabled for a compute-only release.
  control:
    enabled: true
  # Deploy backend listener, worker, RBAC, and optional compute policy resources.
  compute:
    enabled: true

# Compute-plane settings shared by the directly owned backend services.
compute:
  # Required for compute-only releases. Converged control-and-compute releases
  # use "default" when this is not supplied.
  # backendName: custom-backend
  # Workflow resources are created in this namespace. Empty uses the Helm
  # release namespace.
  workloadNamespace:
    name: ''
    create: false
  # Empty disables backend-test synchronization and test-namespace RBAC.
  # Enabling services.backendTestRunner requires this namespace to be non-empty.
  backendTestNamespace: ''
  authentication:
    existingSecret: osmo-backend-token
    tokenKey: token
  nodeConditionPrefix: ''
  rbac:
    create: true
    clusterRoles:
      create: true
      listenerName: ''
      workerName: ''
      testRunnerName: ''
  workflowNetworkPolicy:
    enabled: false
    allowAllClusterEgress: false
    clusterCIDRs: []
    dnsNamespace: kube-system
    allowedNamespaces: []
    additionalEgressRules: []
  priorityClasses:
    create: true
    classes:
    - name: osmo-high
      value: 125
      description: Schedule as soon as possible. Non-preemptible.
    - name: osmo-normal
      value: 100
      description: Standard priority. Non-preemptible.
    - name: osmo-low
      value: 50
      description: Schedule last. Preemptible.
  extraConfigMaps: {}

# Select supporting systems managed by this Helm release. Embedded PostgreSQL
# requires a compatible CloudNativePG operator to be installed first. Embedded
# Valkey is managed directly by this release.
embeddedDependencies:
  postgresql:
    enabled: true
  valkey:
    enabled: true
  objectStorage:
    enabled: true
    # Must match rustfs.config.rustfs.region when enabled. Override both values
    # together for a non-default region.
    region: us-east-1
    buckets:
      workflows: osmo-workflows
      logs: osmo-logs
      apps: osmo-apps
    bootstrap:
      image:
        registry: ''
        repository: amazon/aws-cli
        tag: 2.31.13
        digest: sha256:e14216fb361cce909ce199616711ad103182d5937f851cda9bebf25867d7180a
        pullPolicy: IfNotPresent
      attempts: 30
      backoffLimit: 5
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi

# Connection details for dependencies owned outside this release. Each
# endpoint is required only when its embedded dependency is disabled.
externalDependencies:
  # PostgreSQL stores OSMO control-plane state. Set caExistingSecret when the
  # server certificate is signed by a private CA.
  postgresql:
    host: ''
    port: 5432
    database: osmo
    username: postgres
    tls:
      enabled: false
      caExistingSecret: ''
      caKey: ca.crt
  # Valkey provides queues, caches, events, and distributed coordination. TLS
  # uses the system trust store unless caExistingSecret selects a custom bundle.
  # When set, caKey must contain the complete trust bundle because clients use
  # it through SSL_CERT_FILE.
  valkey:
    host: ''
    port: 6379
    database: 0
    tls:
      enabled: false
      caExistingSecret: ''
      caKey: ca-bundle.crt
  # Object storage for workflow data, logs, and application bundles.
  objectStorage:
    authentication:
      # static loads SDK credentials from secrets.objectStorage.existingSecret.
      # sdkDefault delegates credential discovery to the provider SDK, such as
      # Azure DefaultAzureCredential, the AWS default credential provider
      # chain, or Google Application Default Credentials.
      type: static
    locations:
      workflows: ''
      logs: ''
      apps: ''
    s3:
      region: ''
      overrideUrl: ''

# Override the names Helm derives from the chart and release. Leave empty for
# conventional names such as `osmo-api` and `osmo-gateway`.
nameOverride: ''
fullnameOverride: osmo

# Registry default for OSMO-owned component and runtime images. A non-empty
# service-specific image.registry or runtimeImage.registry takes precedence.
imageRegistry: nvcr.io

# Base repository default for OSMO-owned component and runtime images. A
# non-empty service-specific image.repository or runtimeImage.repository takes
# precedence; component names are added only when the service repository is
# left at its default empty value.
imageRepository: nvidia/osmo

# Shared tag default for OSMO-owned component and runtime images. A non-empty
# service-specific image.tag or runtimeImage.tag takes precedence.
imageTag: latest

# Pull credential Secret references for OSMO-owned pods. Configure third-party
# dependency pull credentials in the dependency's native values block.
imagePullSecrets: []

# Runtime image overrides for submitted workflows. Leave a field empty to
# inherit the corresponding top-level image default.
runtimeImage:
  registry: ''
  repository: ''
  tag: ''

# Metadata and scheduling defaults shared by OSMO-owned workloads. Labels,
# annotations, and node selectors merge with service-specific pod values;
# service-specific tolerations replace this list.
commonLabels: {}
commonAnnotations: {}
podDefaults:
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1001
  terminationGracePeriodSeconds: 30

# Shared Python service logging settings.
logging:
  enabled: true
  logLevel: INFO
  k8sLogLevel: WARNING
  logFormat: text

# Public OSMO URL used in generated service configuration and redirects.
# Include the scheme, for example `https://osmo.example.com`.
externalUrl: http://osmo-gateway

# Optional Kubernetes Ingress for the OSMO gateway Service.
ingress:
  enabled: false
  labels: {}
  annotations: {}
  ingressClassName: ''
  hostname: ''
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ''
  extraHosts: []
  extraPaths: []
  extraRules: []
  extraTls: []

# Optional Gateway API HTTPRoute. Parent references must target a Gateway
# managed outside this chart.
httproute:
  enabled: false
  labels: {}
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

# Optional Prometheus Operator PodMonitors for OSMO metrics endpoints.
monitoring:
  podMonitor:
    control:
      enabled: false
    compute:
      enabled: false
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
    tlsConfig: {}
    honorLabels: false
    podTargetLabels: []
    relabelings: []
    metricRelabelings: []

# References to Kubernetes Secrets. Inline credentials are not accepted.
# Embedded PostgreSQL credentials are owned by
# postgresql.cluster.initdb.secret.name. These Secret settings are external-only
# for PostgreSQL. Retained generated credentials are supported by embedded
# Valkey and embedded object storage; other credential sources remain external.
secrets:
  # Credentials for external PostgreSQL. Embedded PostgreSQL credentials are
  # created by CloudNativePG or configured with
  # postgresql.cluster.initdb.secret.name.
  postgresql:
    existingSecret: ''
    rolloutNonce: ''
    keys:
      username: username
      password: db-password
  # Password used for the effective Valkey connection. Embedded mode supports
  # either a retained generated Secret or an existing Secret; external mode
  # requires an existing Secret.
  valkey:
    generate: true
    existingSecret: ''
    rolloutNonce: ''
    keys:
      password: redis-password
  # Storage SDK configuration file mounted for all three object-storage uses.
  objectStorage:
    generate: true
    existingSecret: ''
    rolloutNonce: ''
    keys:
      credentials: object-storage.yaml
  # Backend compute-plane authentication. Each credential selects exactly one
  # Kubernetes Secret source. Managed Secrets are generated and retained by a
  # short-lived Helm hook without placing token material in rendered manifests
  # or Helm release state; existing Secrets remain externally managed.
  # Every Secret contains `token` and may contain `previous-token` for rotation.
  backendApiTokens:
    enabled: true
    bootstrap:
      image:
        registry: ''
        repository: alpine/k8s
        tag: 1.30.14
        digest: ''
        pullPolicy: IfNotPresent
    # Change this non-secret value to roll the API after an externally managed
    # token Secret changes.
    rolloutNonce: ''
    credentials:
    - name: default
      managedSecret:
        name: osmo-backend-token
    # - name: default
    #   existingSecret:
    #     name: osmo-backend-token
    # - name: local
    #   managedSecret:
    #     name: osmo-backend-token-local
  # Master encryption key configuration mounted into OSMO services.
  masterEncryptionKey:
    # OSMO-managed lifecycle Jobs create and rotate the referenced Secret.
    # External ownership mounts the reference without Secret mutation.
    managementMode: osmo
    existingSecret:
      name: osmo-master-encryption-key
      key: mek.yaml
    bootstrap:
      # Must be set back to false immediately after a successful bootstrap.
      enabled: true
      # Increment after a failed GitOps attempt or credential correction.
      attempt: "1"
      imagePullPolicy: IfNotPresent
      activeDeadlineSeconds: 900
    rotation:
      requestId: ''
      # Explicit operation: prepare, activate, or rewrap. Leave empty to
      # perform the lifecycle manually without a chart Job.
      phase: ''
      attempt: "1"
      # Change this only after PREPARE and again after ACTIVATE. It is copied
      # to every MEK consumer Pod template to produce startup-only rollouts.
      rolloutRevision: ''
      imagePullPolicy: IfNotPresent
      activeDeadlineSeconds: 900
  # Stable JWT signing identity. External ownership provisions the referenced
  # Secret before installation. OSMO ownership can bootstrap it for a fresh
  # database without putting private key material in Helm release state.
  serviceAuth:
    managementMode: external
    existingSecret:
      name: osmo-service-auth
      key: authentication-config.json
    # Change after intentionally updating the externally managed Secret.
    rolloutNonce: ''
    bootstrap:
      # Fresh installations only. Disable after successful bootstrap to remove
      # the one-time Secret-creation RBAC and Job from desired state.
      enabled: false
      # Increment after a failed GitOps attempt or credential correction.
      attempt: "1"
      imagePullPolicy: IfNotPresent
      activeDeadlineSeconds: 900
      nodeSelector: {}
      tolerations: []
      resources: {}
    migration:
      # Transitional compatibility hook for upgrades from DB-backed releases.
      # It performs a one-time pre-upgrade export from the legacy configs row
      # into the pre-provisioned existingSecret. The hook has read-only DB
      # access and target-scoped Secret update permission. Disable after
      # migration. Remove only when DB-backed upgrades are no longer supported.
      enabled: false
      nodeSelector: {}
      tolerations: []
      resources: {}
  # Optional password used to bootstrap the named administrator account.
  defaultAdmin:
    generate: false
    existingSecret: ''
    rolloutNonce: ''
    username: admin
    keys:
      password: password
  # OAuth client Secret consumed only when the OAuth2 proxy is enabled.
  oauthClientSecret:
    existingSecret: oauth2-proxy-secrets
    rolloutNonce: ''
    keys:
      value: client_secret
  # OAuth cookie encryption Secret. This may be owned and rotated separately
  # from the OAuth client Secret.
  oauthCookieSecret:
    # Helm generation is for direct-Helm development/test installs only.
    generate: false
    existingSecret: oauth2-proxy-secrets
    rolloutNonce: ''
    keys:
      value: cookie_secret


# Directly owned OSMO services and workload components. Each component owns its
# image, scaling, probes, resources, environment overrides, and pod-level settings. Internal
# commands, ports, Service names, and required connection arguments remain
# chart-managed implementation details.
services:
  # Compute-plane listener that streams cluster state to the control plane.
  backendListener:
    enabled: true
    replicas: 1
    image:
      registry: ''
      repository: ''
      name: backend-listener
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    enableNodeLabelUpdate: false
    serviceAccount:
      name: ''
      create: true
      annotations: {}
      automountServiceAccountToken: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    livenessProbe:
      enabled: true
      spec:
        exec:
          command:
          - progress_check
          - --progress_interval
          - "300:300:300:300"
          - --progress_file
          - /var/run/osmo/last_progress_websocket:/var/run/osmo/last_progress_pod:/var/run/osmo/last_progress_node:/var/run/osmo/last_progress_event
        failureThreshold: 1
        periodSeconds: 30
        timeoutSeconds: 15
    startupProbe:
      enabled: true
      spec:
        exec:
          command:
          - progress_check
          - --progress_interval
          - "300:300:300:300"
          - --progress_file
          - /var/run/osmo/last_progress_websocket:/var/run/osmo/last_progress_pod:/var/run/osmo/last_progress_node:/var/run/osmo/last_progress_event
        failureThreshold: 30
        periodSeconds: 5
        timeoutSeconds: 60
        initialDelaySeconds: 10
    extraArgs: []
    extraEnv: []
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      affinity: {}
      podSecurityContext: {}
      containerSecurityContext: {}
      initContainers: []
      extraContainers: []
      extraVolumes: []
      hostAliases: []
      topologySpreadConstraints: []

  # Compute-plane worker that materializes workflow resources in Kubernetes.
  backendWorker:
    enabled: true
    replicas: 1
    image:
      registry: ''
      repository: ''
      name: backend-worker
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    extraRBACRules: []
    serviceAccount:
      name: ''
      create: true
      annotations: {}
      automountServiceAccountToken: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    livenessProbe:
      enabled: true
      spec:
        exec:
          command:
          - progress_check
          - --progress_interval
          - "300:300"
          - --progress_file
          - /var/run/osmo/last_progress_worker_job:/var/run/osmo/last_progress_worker_heartbeat
        failureThreshold: 1
        periodSeconds: 30
        timeoutSeconds: 15
    startupProbe:
      enabled: true
      spec:
        exec:
          command:
          - progress_check
          - --progress_interval
          - "300:300"
          - --progress_file
          - /var/run/osmo/last_progress_worker_job:/var/run/osmo/last_progress_worker_heartbeat
        failureThreshold: 30
        periodSeconds: 5
        timeoutSeconds: 60
        initialDelaySeconds: 10
    extraArgs: []
    extraEnv: []
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      affinity: {}
      podSecurityContext: {}
      containerSecurityContext: {}
      initContainers: []
      extraContainers: []
      extraVolumes: []
      hostAliases: []
      topologySpreadConstraints: []

  # Template and RBAC for optional backend validation CronJobs.
  backendTestRunner:
    enabled: false
    extraArgs: []
    serviceAccount:
      name: ''
      create: true
      annotations: {}
      automountServiceAccountToken: true
    image:
      registry: ''
      repository: ''
      name: backend-test-runner
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    cronJob:
      schedule: 0 2 * * *
      timezone: UTC
      startingDeadlineSeconds: 300
      concurrencyPolicy: Forbid
      suspend: false
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
    jobTemplate:
      parallelism: 1
      completions: 1
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      completionMode: NonIndexed
      suspend: false
    initContainer:
      image:
        registry: ''
        repository: ubuntu
        tag: '22.04'
        digest: ''
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    container:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
    configMap:
      nameTemplate: '{{.TestName}}-config'
      defaultMode: 420
      optional: false
    testConfigVolume:
      name: test-config
      mountPath: /test-config
    extraEnv: {}
    labels:
      managed-by: osmo
    annotations:
      description: 'Automated test runner for {{.BackendName}} - {{.TestName}}'
      scheduler: backend-test-scheduler
    pod:
      labels:
        component: backend-test-pod
        pod-type: test-runner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      nodeSelector: {}
      affinity: {}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
          add:
          - NET_BIND_SERVICE
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: true
      hostAliases: []
    extraRoles: []
  # Optional Model Context Protocol endpoint exposed through the gateway.
  mcp:
    enabled: false
    replicas: 1
    image:
      registry: ''
      repository: ''
      name: mcp-self-hosted
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    port: 8000
    resourceUrl: ''
    requestTimeoutSeconds: 10
    authorizationServers: []
    scopes: []
    allowedOrigins: []
    service:
      labels: {}
      annotations: {}
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    livenessProbe:
      enabled: true
      spec:
        httpGet:
          port: http
          path: /health
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
    readinessProbe:
      enabled: true
      spec:
        httpGet:
          port: http
          path: /health
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2
    startupProbe:
      enabled: true
      spec:
        httpGet:
          port: http
          path: /health
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 24
    extraEnv: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        runAsUser: 1001

  # Browser-based OSMO user interface.
  ui:
    enabled: true
    replicas: 1
    image:
      registry: ''
      repository: ''
      name: web-ui
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    # Leave empty to use this release's gateway Service and configured port.
    apiHostname: ''
    portForwardEnabled: false
    nextjsSslEnabled: false
    containerPort: 8000
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    maxHttpHeaderSizeKb: 128
    command: []
    args: []
    docsBaseUrl: https://nvidia.github.io/OSMO/main/user_guide/
    cliInstallScriptUrl: https://raw.githubusercontent.com/NVIDIA/OSMO/refs/heads/main/install.sh
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      hpaCpuTarget: 85
      hpaMemoryTarget: null
      customMetrics: []
      behavior: {}
    service:
      type: ''
      port: 80
      portName: http
      protocol: TCP
      labels: {}
      annotations: {}
      extraPorts: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    extraPorts: []
    envFrom: []
    livenessProbe:
      enabled: true
      spec:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 2
        periodSeconds: 5
        timeoutSeconds: 3
    startupProbe:
      enabled: true
      spec:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 24
        periodSeconds: 5
        timeoutSeconds: 3
        initialDelaySeconds: 5
    readinessProbe:
      enabled: true
      spec:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 2
        timeoutSeconds: 3
        periodSeconds: 5
    extraEnv: []
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
        runAsUser: 1000
      topologySpreadConstraints: []
      hostAliases: []
      initContainers: []
      extraContainers: []
      extraVolumes: []

  # Promotes scheduled Redis jobs when their delay expires.
  delayedJobMonitor:
    enabled: true
    replicas: 1
    image:
      registry: ''
      repository: ''
      name: delayed-job-monitor
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    startupProbe:
      enabled: true
      spec:
        exec:
          command:
          - progress_check
          - --progress_interval
          - '30'
        failureThreshold: 24
        periodSeconds: 5
        timeoutSeconds: 15
        initialDelaySeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraVolumeMounts: []
    extraEnv: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints: []
      initContainers: []
      extraContainers: []
      extraVolumes: []

  # Executes asynchronous control-plane jobs from the Valkey queue.
  worker:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: ''
      repository: ''
      name: worker
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    startupProbe:
      enabled: true
      spec:
        exec:
          command:
          - progress_check
          - --progress_interval
          - '300'
        failureThreshold: 24
        periodSeconds: 5
        timeoutSeconds: 15
        initialDelaySeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    extraArgs: []
    serviceAccount:
      name: ''
      create: false
      annotations: {}
      automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
      labels: {}
      annotations: {}
      unhealthyPodEvictionPolicy: IfHealthyBudget
    extraEnv: []
    replicas: 1
    extraVolumeMounts: []
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      containerSecurityContext:
        readOnlyRootFilesystem: true
      topologySpreadConstraints: []
      initContainers: []
      extraContainers: []
      extraVolumes: []

  # Main OSMO REST API and control-plane service.
  api:
    enabled: true
    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 9
      hpaMemoryTarget: 80
      hpaCpuTarget: 80
      customMetrics: []
      behavior: {}
    image:
      registry: ''
      repository: ''
      name: service
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    hostname: ''
    clientInstallUrl: https://raw.githubusercontent.com/NVIDIA/OSMO/refs/heads/main/install.sh
    disableTaskMetrics: false
    auth:
      enabled: false
      deviceEndpoint: ''
      deviceClientId: ''
      browserEndpoint: ''
      browserClientId: ''
      tokenEndpoint: ''
      logoutEndpoint: ''
    service:
      labels: {}
      annotations: {}
    livenessProbe:
      enabled: true
      spec:
        httpGet:
          port: 8000
          path: /api/version
        timeoutSeconds: 20
        failureThreshold: 3
        periodSeconds: 45
    startupProbe:
      enabled: true
      spec:
        httpGet:
          port: 8000
          path: /api/version
        failureThreshold: 24
        periodSeconds: 5
        timeoutSeconds: 3
        initialDelaySeconds: 5
    # Keep readiness authorization-neutral: this endpoint only confirms that
    # the API process is ready to receive traffic.
    readinessProbe:
      enabled: true
      spec:
        httpGet:
          port: 8000
          path: /health
        failureThreshold: 3
        periodSeconds: 45
        timeoutSeconds: 20
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
