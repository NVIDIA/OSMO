    serviceAccount:
      name: ''
      create: false
      annotations: {}
    envoy: {}
    env: []
    replicas: 1
    pod:
      labels: {}
      annotations: {}
      nodeSelector: {}
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
