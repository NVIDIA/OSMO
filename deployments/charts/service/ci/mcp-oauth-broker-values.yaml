# Synthetic values used only to validate the optional MCP OAuth broker surface.
services:
  mcp:
    enabled: true
    resourceUrl: https://osmo.example.com/mcp
    allowedOrigins:
    - http://localhost:6274
    oauthBroker:
      enabled: true
      issuerUrl: https://osmo.example.com
      trustedHttpsRedirectOrigins:
      - https://trusted-client.example.com
      entra:
        issuerUrl: https://login.microsoftonline.com/example-tenant/v2.0
        clientId: example-mcp-broker-client
      redis:
        serviceName: broker-redis.example.internal
        port: 6380
        dbNumber: 14
        tlsEnabled: true
        passwordFile: /etc/osmo/mcp-auth/redis-password
        keyPrefix: test:mcp-auth
      existingSecret:
        name: mcp-oauth-broker-secrets

gateway:
  # The broker-generated provider is sufficient for MCP; no direct provider is
  # needed in this validation fixture.
  networkPolicies:
    enabled: false
  envoy:
    jwt:
      providers: []
