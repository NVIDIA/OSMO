{{- if .Values.services.backendApiTokens.enabled }}
{{- $managedCredentials := list }}
{{- range .Values.services.backendApiTokens.credentials }}
{{- if hasKey . "managedSecret" }}
{{- $managedCredentials = append $managedCredentials . }}
{{- end }}
{{- end }}
{{- if $managedCredentials }}
{{- $bootstrapName := include "osmo.backend-api-token-bootstrap-name" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  {{- range $managedCredentials }}
  - {{ include "osmo.backend-api-token-secret-name" . | quote }}
  {{- end }}
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
subjects:
- kind: ServiceAccount
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $bootstrapName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: {{ $bootstrapName }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $bootstrapName }}
      {{- with .Values.global.imagePullSecret }}
      imagePullSecrets:
      - name: {{ . }}
      {{- end }}
      nodeSelector:
        {{- range $key, $value := .Values.global.nodeSelector }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.services.service.nodeSelector }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      tolerations:
        {{- toYaml .Values.services.service.tolerations | nindent 8 }}
      containers:
      - name: backend-token-bootstrap
        image: {{ .Values.services.backendApiTokens.bootstrap.image | quote }}
        imagePullPolicy: {{ .Values.services.backendApiTokens.bootstrap.imagePullPolicy }}
        command:
        - /bin/ash
        args:
        - -c
        - |
{{ .Files.Get "files/backend-token-bootstrap.sh" | nindent 10 }}
        - backend-token-bootstrap
        - --namespace
        - {{ .Release.Namespace | quote }}
        - --release-name
        - {{ .Release.Name | quote }}
        {{- if .Release.IsUpgrade }}
        - --fail-if-missing
        {{- end }}
        {{- range $managedCredentials }}
        - --secret-name
        - {{ include "osmo.backend-api-token-secret-name" . | quote }}
        {{- end }}
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - name: bootstrap-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: bootstrap-tmp
        emptyDir: {}
{{- end }}
{{- end }}
