{{- if .Values.services.bootstrapPrincipals.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.services.service.serviceName }}-bootstrap-principals
data:
  principals.yaml: |
    principals:
    {{- range .Values.services.bootstrapPrincipals.principals }}
      - username: {{ .username | quote }}
        token_name: {{ .tokenName | quote }}
        token_file: {{ printf "%s/%s/token" $.Values.services.bootstrapPrincipals.tokenMountRoot .username | quote }}
        roles:
        {{- range .roles }}
          - {{ . | quote }}
        {{- end }}
        expires_in_days: {{ .expiresInDays | default 3650 }}
        description: {{ .description | default "Bootstrap token managed by the OSMO Helm release" | quote }}
    {{- end }}
{{- end }}
