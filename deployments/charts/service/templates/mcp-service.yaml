{{- if .Values.services.mcp.enabled }}
{{- $mcp := .Values.services.mcp }}
{{- $imageTag := $mcp.imageTag | default .Values.global.osmoImageTag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $mcp.serviceName }}
  labels:
    app: {{ $mcp.serviceName }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ $mcp.replicas }}
  selector:
    matchLabels:
      app: {{ $mcp.serviceName }}
  template:
    metadata:
      labels:
        app: {{ $mcp.serviceName }}
        app.kubernetes.io/component: mcp
        {{- with $mcp.extraPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $mcp.extraPodAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with $mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      serviceAccountName: {{ include "osmo.service-account-name" (dict "serviceAccountName" $mcp.serviceAccountName "Values" .Values) }}
      containers:
      - name: {{ $mcp.serviceName }}
        image: {{ .Values.global.osmoImageLocation }}/{{ $mcp.imageName }}:{{ $imageTag }}
        imagePullPolicy: {{ $mcp.imagePullPolicy }}
        command:
        - mcp
        {{- if .Values.gateway.tls.enabled }}
        args:
        {{- include "osmo.upstream-tls-args" (dict "context" . "secretName" .Values.gateway.tls.upstreamCerts.mcp) | nindent 8 }}
        {{- end }}
        securityContext:
          {{- toYaml $mcp.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ $mcp.port }}
          protocol: TCP
        env:
        - name: OSMO_MCP_HOST
          value: "0.0.0.0"
        - name: OSMO_MCP_PORT
          value: {{ $mcp.port | quote }}
        - name: OSMO_API_URL
          value: {{ $mcp.apiUrl | quote }}
        - name: OSMO_MCP_SERVICE_TOKEN_FILE
          value: {{ $mcp.serviceTokenFile | quote }}
        {{- if $mcp.gatewayCaSecretName }}
        - name: OSMO_MCP_GATEWAY_CA_FILE
          value: {{ $mcp.gatewayCaFile | quote }}
        {{- end }}
        - name: OSMO_MCP_TOKEN_CACHE_MAX_SIZE
          value: {{ $mcp.tokenCacheMaxSize | quote }}
        - name: OSMO_MCP_TOKEN_CACHE_SKEW_SECONDS
          value: {{ $mcp.tokenCacheSkewSeconds | quote }}
        - name: OSMO_MCP_REQUEST_TIMEOUT_SECONDS
          value: {{ $mcp.requestTimeoutSeconds | quote }}
        {{- with $mcp.extraEnv }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml $mcp.resources | nindent 10 }}
        volumeMounts:
        - name: mcp-service-token
          mountPath: {{ dir $mcp.serviceTokenFile | quote }}
          readOnly: true
        {{- if $mcp.gatewayCaSecretName }}
        - name: mcp-gateway-ca
          mountPath: {{ dir $mcp.gatewayCaFile | quote }}
          readOnly: true
        {{- end }}
        {{- if and .Values.gateway.tls.enabled .Values.gateway.tls.upstreamCerts.mcp }}
        {{- include "osmo.upstream-tls-volume-mount" (dict "context" . "secretName" .Values.gateway.tls.upstreamCerts.mcp) | nindent 8 }}
        {{- end }}
        livenessProbe:
          {{- include "osmo.upstream-probe-yaml" (dict "probe" $mcp.livenessProbe "context" .) | nindent 10 }}
        readinessProbe:
          {{- include "osmo.upstream-probe-yaml" (dict "probe" $mcp.readinessProbe "context" .) | nindent 10 }}
        startupProbe:
          {{- include "osmo.upstream-probe-yaml" (dict "probe" $mcp.startupProbe "context" .) | nindent 10 }}
      volumes:
      - name: mcp-service-token
        secret:
          secretName: {{ $mcp.serviceTokenSecretName | quote }}
          items:
          - key: {{ $mcp.serviceTokenSecretKey | quote }}
            path: {{ base $mcp.serviceTokenFile | quote }}
      {{- if $mcp.gatewayCaSecretName }}
      - name: mcp-gateway-ca
        secret:
          secretName: {{ $mcp.gatewayCaSecretName | quote }}
          items:
          - key: {{ $mcp.gatewayCaSecretKey | quote }}
            path: {{ base $mcp.gatewayCaFile | quote }}
      {{- end }}
      {{- if and .Values.gateway.tls.enabled .Values.gateway.tls.upstreamCerts.mcp }}
      {{- include "osmo.upstream-tls-volume" (dict "context" . "secretName" .Values.gateway.tls.upstreamCerts.mcp) | nindent 6 }}
      {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ $mcp.serviceName }}
  labels:
    app: {{ $mcp.serviceName }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ $mcp.port }}
    targetPort: http
    protocol: TCP
  selector:
    app: {{ $mcp.serviceName }}

{{- if .Values.gateway.networkPolicies.enabled }}
---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $mcp.serviceName }}-allow-gateway-envoy
spec:
  podSelector:
    matchLabels:
      app: {{ $mcp.serviceName }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "osmo.gateway-component-labels" (dict "component" "envoy" "context" .) | nindent 10 }}
    ports:
    - port: {{ $mcp.port }}
      protocol: TCP
{{- end }}
{{- end }}
