{{- $oauth := .Values.gateway.oauth2Proxy }}
{{- if and $oauth.enabled $oauth.cookieSecret.generate }}
{{- include "osmo.oauth-secrets.validate" . }}
{{- $bootstrapName := printf "%s-oauth-cookie-bootstrap" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $secretName := include "osmo.oauth-cookie-secret-name" . }}
{{- $secretKey := include "osmo.oauth-cookie-secret-key" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and .Release.IsInstall (not $existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: osmo-oauth-cookie-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-30"
    helm.sh/resource-policy: keep
type: Opaque
---
{{- end }}
apiVersion: v1
kind: List
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-29"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
items:
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
  rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
  subjects:
  - kind: ServiceAccount
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ $bootstrapName }}
- apiVersion: batch/v1
  kind: Job
  metadata:
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
  spec:
    activeDeadlineSeconds: 300
    backoffLimit: 0
    ttlSecondsAfterFinished: 300
    template:
      metadata:
        labels:
          app.kubernetes.io/name: {{ include "osmo.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name | quote }}
          app.kubernetes.io/component: oauth-cookie-bootstrap
      spec:
        restartPolicy: Never
        serviceAccountName: {{ $bootstrapName }}
        {{- if .Values.global.imagePullSecret }}
        imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret | quote }}
        {{- end }}
        containers:
        - name: oauth-cookie-bootstrap
          image: {{ $oauth.cookieSecret.bootstrap.image | quote }}
          imagePullPolicy: {{ $oauth.cookieSecret.bootstrap.imagePullPolicy | quote }}
          command: ["/bin/ash"]
          args:
          - -c
          - |
{{ .Files.Get "files/oauth-cookie-bootstrap.sh" | nindent 12 }}
          - oauth-cookie-bootstrap
          - --namespace
          - {{ .Release.Namespace | quote }}
          - --release-name
          - {{ .Release.Name | quote }}
          - --secret-name
          - {{ $secretName | quote }}
          - --secret-key
          - {{ $secretKey | quote }}
          {{- if .Release.IsUpgrade }}
          - --fail-if-missing
          {{- end }}
          env:
          - name: HOME
            value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
          - name: bootstrap-tmp
            mountPath: /tmp
        volumes:
        - name: bootstrap-tmp
          emptyDir: {}
{{- end }}
