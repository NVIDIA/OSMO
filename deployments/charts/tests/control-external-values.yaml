controlPlane:
  services:
    configFile:
      secretName: external-control-secrets
    postgres:
      serviceName: external-postgresql
      passwordSecretName: external-control-secrets
    redis:
      serviceName: external-valkey
      passwordSecretName: external-control-secrets
    configs:
      secretRefs:
        - secretName: external-control-secrets
      workflow:
        workflow_data:
          credential:
            secretName: external-control-secrets
            secretKey: object-storage.yaml
            endpoint: s3://osmo-workflows/workflows
            override_url: https://s3.external.example.com
            region: us-east-1
        workflow_log:
          credential:
            secretName: external-control-secrets
            secretKey: object-storage.yaml
            endpoint: s3://osmo-logs/logs
            override_url: https://s3.external.example.com
            region: us-east-1
        workflow_app:
          credential:
            secretName: external-control-secrets
            secretKey: object-storage.yaml
            endpoint: s3://osmo-apps/apps
            override_url: https://s3.external.example.com
            region: us-east-1
