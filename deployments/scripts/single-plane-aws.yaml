# Layer after the chart's single-plane profile. Endpoints come from Terraform;
# the shared installer provisions referenced credentials outside Helm values.
externalUrl: http://127.0.0.1:9000
authentication:
  bootstrap:
    identities:
      admin:
        tokens:
          primary:
            managedSecret: null
            existingSecret:
              name: osmo-default-admin
              key: password
      backend-operator-default:
        tokens:
          # Replace the profile's externally managed primary token with a
          # chart-managed credential, without retaining its Secret reference.
          primary: null
          single-plane:
            managedSecret:
              name: osmo-backend-token
compute:
  backendName: default
gateway:
  authz:
    enabled: true
externalDependencies:
  postgresql:
    tls:
      enabled: true
      sslMode: verify-full
      caExistingSecret: osmo-postgresql-ca
      caKey: ca.crt
  valkey:
    tls:
      enabled: true
secrets:
  masterEncryptionKey:
    bootstrap:
      enabled: true
  serviceAuth:
    managementMode: osmo
    bootstrap:
      enabled: true
