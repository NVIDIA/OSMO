# Static Azure overlay for deploy-osmo-single-plane.sh. The generic single-plane
# profile is applied first; dynamic, non-secret values are generated as JSON.
externalUrl: http://osmo-gateway
# This example reaches the ClusterIP gateway only through a local port-forward,
# so it permits the development identity. Do not reuse this setting for an
# externally reachable gateway.
gateway:
  envoy:
    defaultIdentity:
      user: testuser
      roles: osmo-admin
      allowedPools: default
    jwt:
      allowMissing: true
compute:
  backendName: default
services:
  api:
    pod:
      labels:
        azure.workload.identity/use: "true"
  worker:
    serviceAccount:
      create: true
    pod:
      labels:
        azure.workload.identity/use: "true"
externalDependencies:
  postgresql:
    port: 5432
    tls:
      enabled: false
  valkey:
    tls:
      enabled: true
  objectStorage:
    authentication:
      type: sdkDefault
secrets:
  postgresql:
    existingSecret: osmo-postgresql
  valkey:
    existingSecret: osmo-valkey
  objectStorage:
    existingSecret: ''
configuration:
  podTemplates:
    azure_workload_identity:
      metadata:
        labels:
          azure.workload.identity/use: "true"
      spec:
        serviceAccountName: osmo-workflow
  pools:
    default:
      common_pod_template:
      - default_ctrl
      - default_user
      - azure_workload_identity
