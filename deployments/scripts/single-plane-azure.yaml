# Static Azure overlay for deploy-osmo-single-plane.sh. The generic single-plane
# profile is applied first; dynamic, non-secret values are generated as JSON.
externalUrl: http://127.0.0.1:9000
authentication:
  bootstrap:
    identities:
      admin:
        tokens:
          primary: null
          cli:
            existingSecret:
              name: osmo-default-admin
              key: password
compute:
  backendName: default
services:
  api:
    pod:
      labels:
        azure.workload.identity/use: "true"
  worker:
    serviceAccount:
      create: true
    pod:
      labels:
        azure.workload.identity/use: "true"
gateway:
  authz:
    # Resolve verified token roles into the allowed-pool headers required by the API.
    enabled: true
externalDependencies:
  postgresql:
    port: 5432
    tls:
      enabled: false
  valkey:
    tls:
      enabled: true
  objectStorage:
    authentication:
      type: sdkDefault
secrets:
  serviceAuth:
    managementMode: osmo
    bootstrap:
      enabled: true
  postgresql:
    existingSecret: osmo-postgresql
  valkey:
    existingSecret: osmo-valkey
  objectStorage:
    existingSecret: ''
configuration:
  service:
    service_base_url: http://osmo-gateway.osmo.svc:80
  podTemplates:
    azure_workload_identity:
      metadata:
        labels:
          azure.workload.identity/use: "true"
      spec:
        serviceAccountName: osmo-workflow
  pools:
    default:
      common_pod_template:
      - default_ctrl
      - default_user
      - azure_workload_identity
