# Basic smoke test — no GPU. Succeeds iff OSMO can schedule two dependent
# tasks and round-trip their intermediate data through configured object storage.
workflow:
  name: verify-hello
  timeout:
    exec_timeout: 5m
    queue_timeout: 5m
  resources:
    tiny:
      cpu: 1
      memory: 1Gi
      storage: 1Gi
  tasks:
  - name: produce
    image: alpine:3.20
    resource: tiny
    command: ["sh", "-c"]
    args:
    - |
      set -e
      mkdir -p {{output}}
      echo "OSMO object storage round trip" > {{output}}/marker.txt
      echo "Hello from OSMO"
  - name: consume
    image: alpine:3.20
    resource: tiny
    command: ["sh", "-c"]
    args:
    - |
      set -e
      test "$(cat {{input:0}}/marker.txt)" = "OSMO object storage round trip"
      mkdir -p {{output}}
      cp {{input:0}}/marker.txt {{output}}/verified.txt
      echo "Object storage round trip verified"
    inputs:
    - task: produce
