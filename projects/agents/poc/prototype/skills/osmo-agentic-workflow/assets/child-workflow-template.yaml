version: 2

# Copy this shape into a new child YAML and replace every REPLACE_* value. The
# child YAML, including its task-scoped AGENTS.md below, is the complete handoff.
workflow:
  name: replace-with-dns-safe-child-name
  timeout:
    queue_timeout: 30m
    exec_timeout: 24h
  resources:
    agent:
      cpu: 2
      memory: 4Gi
      storage: 10Gi
      platform: REPLACE_WITH_VISIBLE_PLATFORM
  tasks:
  - name: agent
    image: "nvcr.io/nvstaging/osmo/agent-runtime@sha256:REPLACE_WITH_64_HEX"
    resource: agent
    credentials:
      nvidia_inference:
        INFERENCE_API_KEY: INFERENCE_API_KEY
    environment:
      STATIC_REPOSITORY_URL: "https://github.com/REPLACE_WITH_OWNER/REPLACE_WITH_REPOSITORY.git"
      STATIC_REPOSITORY_REF: "REPLACE_WITH_FULL_40_CHARACTER_COMMIT_SHA"
      STATIC_REPOSITORY_SUBDIR: "."
    command: ["/opt/agent-runtime/run-agent.sh"]
    args: ["--result-root", "{{output}}"]
    files:
    - path: /run/agent/AGENTS.md
      contents: |
        # Child agent

        Replace this with the bounded child subgoal, acceptance criteria, and
        relevant parent evidence. Do not include secret values.
    outputs:
    - url: "swift://REPLACE_WITH_SWIFT_HOST/REPLACE_WITH_SWIFT_NAMESPACE/REPLACE_WITH_CONTAINER/agent-results/replace-with-child-name/"
