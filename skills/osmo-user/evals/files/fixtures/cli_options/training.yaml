workflow:
  name: gr00t-app-run
  labels:
    project: baseline
    team: original
  tasks:
  - name: train
    image: ubuntu:24.04
    command: ["cat", "/input/training.txt"]
    files:
    - localpath: training.txt
      path: /input/training.txt
  resources:
