# Compact KIND cluster for the canonical OSMO single-node Helm profile.
#
# The chart uses the Kubernetes scheduler and carries no provider-specific node
# labels. Two workers leave capacity for workflow pods while keeping local and
# CI image storage bounded. The first worker exposes the OSMO gateway NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: osmo
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
  - role: worker
