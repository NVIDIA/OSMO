version: 2
workflow:
  name: oetf-redis-reader-cleanup-{{test_id}}
  timeout:
    exec_timeout: 5m
    queue_timeout: 30m
  resources:
    default:
      cpu: 1
      memory: 1Gi
      storage: 1Gi
  tasks:
  - name: quiet-logger
    image: python:3.10-slim
    command: ["python3"]
    args: ["/tmp/oetf/task.py"]
    resource: default

default-values:
  test_id: "0"
